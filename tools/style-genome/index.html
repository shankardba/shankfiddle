<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Style Genome — shankFiddle</title>
<meta name="description" content="Blend the drawing grammar of two art traditions (line, fill, ornament, layout and palette) into one picture, gene by gene.">
<link rel="icon" href="../../favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="../../assets/images/favicon-512.png">
<link rel="apple-touch-icon" href="../../assets/images/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #0b0508; }
  body { display: flex; flex-direction: column; }

  .tool-bar {
    flex: 0 0 auto;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: flex-start;
    row-gap: 8px;
    column-gap: 14px;
    padding: 10px 18px;
    background: #0b0508;
    border-bottom: 1px solid rgba(240, 168, 60, 0.22);
    font-family: 'Inter', sans-serif;
  }

  .tool-bar a.back {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: #f7ece9;
    text-decoration: none;
    font-size: 0.85rem;
    font-weight: 600;
    padding: 7px 14px;
    border-radius: 999px;
    border: 1px solid rgba(255, 46, 166, 0.4);
    transition: border-color 0.2s ease;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .back-logo {
    width: 18px;
    height: 18px;
    object-fit: contain;
    flex-shrink: 0;
  }

  .tool-bar a.back:hover { border-color: #f0a83c; }

  .tool-bar .tool-name {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: 0.95rem;
    letter-spacing: 0.5px;
    color: #ffd27a;
  }

  .tool-bar .tool-name svg { width: 1.15em; height: 1.15em; flex-shrink: 0; }

  .tool-bar a.atlas {
    margin-left: auto;
    color: #ffd27a;
    text-decoration: none;
    font-size: 0.85rem;
    font-weight: 600;
    padding: 7px 14px;
    border-radius: 999px;
    border: 1px solid rgba(240, 168, 60, 0.4);
    transition: border-color 0.2s ease;
    white-space: nowrap;
  }

  .tool-bar a.atlas:hover { border-color: #ff2ea6; }
  .tool-bar a:focus-visible { outline: 2px solid #ffd27a; outline-offset: 2px; }

  iframe {
    flex: 1 1 auto;
    width: 100%;
    border: 0;
    display: block;
  }
</style>
</head>
<body>

<div class="tool-bar">
  <a href="../art/" class="back"><img src="../../assets/images/logo-320.png" alt="" class="back-logo">&larr; Art</a>
  <span class="tool-name"><svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><circle cx="16" cy="16" r="3.2"/><path d="M16 3c3 4 3 6.5 0 9.6C13 9.5 13 7 16 3zM29 16c-4 3-6.5 3-9.6 0 3.1-3 5.6-3 9.6 0zM16 29c-3-4-3-6.5 0-9.6 3 3.1 3 5.6 0 9.6zM3 16c4-3 6.5-3 9.6 0-3.1 3-5.6 3-9.6 0z" stroke="#ff2ea6"/><path d="M6.8 6.8c4.8.8 6.4 2.6 6.6 6.6-4-.2-5.8-1.8-6.6-6.6zM25.2 6.8c-.8 4.8-2.6 6.4-6.6 6.6.2-4 1.8-5.8 6.6-6.6zM25.2 25.2c-4.8-.8-6.4-2.6-6.6-6.6 4 .2 5.8 1.8 6.6 6.6zM6.8 25.2c.8-4.8 2.6-6.4 6.6-6.6-.2 4-1.8 5.8-6.6 6.6z"/></g></svg>Style Genome</span>
  <a href="atlas.html" class="atlas">Atlas &rarr;</a>
</div>
<iframe id="tool" src="app.html" title="Style Genome" allow="fullscreen"></iframe>
<script>
  // a link such as ./?a=kolam&b=kolam (from the Atlas) opens the mixer on that style
  if (location.search) document.getElementById('tool').src = 'app.html' + location.search;
</script>

</body>
</html>
