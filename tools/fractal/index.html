<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fractal Explorer — shankFiddle</title>
<link rel="icon" href="../../assets/images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #0b0508; }
  body { display: flex; flex-direction: column; }

  .tool-bar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    padding: 10px 18px;
    background: #0b0508;
    border-bottom: 1px solid rgba(240, 168, 60, 0.22);
    font-family: 'Inter', sans-serif;
  }

  .tool-bar a.back {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: #f7ece9;
    text-decoration: none;
    font-size: 0.85rem;
    font-weight: 600;
    padding: 7px 14px;
    border-radius: 999px;
    border: 1px solid rgba(255, 46, 166, 0.4);
    transition: border-color 0.2s ease;
  }

  .tool-bar a.back:hover { border-color: #f0a83c; }

  .tool-bar .tool-name {
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: 0.95rem;
    letter-spacing: 0.5px;
    color: #ffd27a;
  }

  .tool-bar a.fullscreen {
    color: #c7abb8;
    text-decoration: none;
    font-size: 0.8rem;
    font-weight: 600;
  }

  .tool-bar a.fullscreen:hover { color: #ff2ea6; }

  iframe {
    flex: 1 1 auto;
    width: 100%;
    border: 0;
    display: block;
  }
</style>
</head>
<body>

<div class="tool-bar">
  <a href="../../index.html#tools" class="back">&larr; shankFiddle</a>
  <span class="tool-name">🌀 Fractal Explorer</span>
  <a href="app.html" target="_blank" rel="noopener" class="fullscreen">Full screen &#8599;</a>
</div>
<iframe src="app.html" title="Fractal Explorer" allow="fullscreen"></iframe>

</body>
</html>
