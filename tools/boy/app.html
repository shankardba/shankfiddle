<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Boy — a tiny diorama adventure</title>
<meta name="description" content="Boy — a miniature 3D top-down adventure in the browser, in the tilt-shift diorama style of Zelda: Link's Awakening.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #05070a; }
  body { font-family: 'Inter', sans-serif; -webkit-user-select: none; user-select: none; }

  #game-root {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #05070a;
  }

  canvas { display: block; width: 100%; height: 100%; }

  /* ---- tilt-shift diorama bands (fake depth-of-field, cheap & convincing) ---- */
  .tilt-band {
    position: absolute;
    left: 0; right: 0;
    pointer-events: none;
    z-index: 5;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
  }
  .tilt-band.top {
    top: 0; height: 16%;
    background: linear-gradient(to bottom, rgba(5,7,10,0.35), rgba(5,7,10,0));
    mask-image: linear-gradient(to bottom, black 40%, transparent 100%);
    -webkit-mask-image: linear-gradient(to bottom, black 40%, transparent 100%);
  }
  .tilt-band.bottom {
    bottom: 0; height: 20%;
    background: linear-gradient(to top, rgba(5,7,10,0.4), rgba(5,7,10,0));
    mask-image: linear-gradient(to top, black 40%, transparent 100%);
    -webkit-mask-image: linear-gradient(to top, black 40%, transparent 100%);
  }
  .vignette {
    position: absolute; inset: 0; pointer-events: none; z-index: 5;
    box-shadow: inset 0 0 18vw rgba(0,0,0,0.55);
  }

  /* ---- HUD ---- */
  .hud { position: absolute; z-index: 10; font-family: 'Inter', sans-serif; }

  #shard-counter {
    top: 16px; right: 16px;
    display: flex; align-items: center; gap: 8px;
    background: rgba(5,7,10,0.55);
    border: 1px solid rgba(240,168,60,0.4);
    border-radius: 999px;
    padding: 7px 16px 7px 12px;
    color: #ffd27a;
    font-weight: 600;
    font-size: 0.9rem;
    letter-spacing: 0.3px;
    backdrop-filter: blur(6px);
  }
  #shard-counter .icon { font-size: 1rem; filter: drop-shadow(0 0 6px rgba(120,220,255,0.8)); }

  #stats-hud {
    top: 16px; left: 16px;
    display: flex; align-items: center; gap: 14px;
    background: rgba(5,7,10,0.55);
    border: 1px solid rgba(240,168,60,0.4);
    border-radius: 999px;
    padding: 7px 16px;
    color: #ffd27a;
    font-weight: 600;
    font-size: 0.9rem;
    letter-spacing: 0.3px;
    backdrop-filter: blur(6px);
  }
  #stats-hud .icon { font-size: 1rem; margin-right: 6px; }

  #dialogue {
    left: 50%; bottom: 8%;
    transform: translateX(-50%) translateY(12px);
    width: min(88vw, 560px);
    background: rgba(8,6,10,0.88);
    border: 1px solid rgba(240,168,60,0.55);
    border-radius: 14px;
    padding: 18px 22px 14px;
    color: #f7ece9;
    font-size: 1rem;
    line-height: 1.5;
    box-shadow: 0 14px 40px rgba(0,0,0,0.5);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  #dialogue.open { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
  #dialogue-speaker {
    display: none;
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: 0.85rem;
    color: #ffd27a;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
  }
  #dialogue-link { display: none; margin-top: 10px; }
  #dialogue-link a {
    color: #7ee8ff;
    font-size: 0.85rem;
    font-weight: 600;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  #dialogue-link a:hover { color: #ffd27a; }
  #dialogue .prompt {
    margin-top: 10px;
    font-size: 0.75rem;
    color: #c7abb8;
    text-align: right;
    animation: blink 1.1s infinite;
  }
  @keyframes blink { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }

  #car-menu {
    display: none;
    left: 50%; bottom: 8%;
    transform: translateX(-50%);
    width: min(88vw, 420px);
    background: rgba(8,6,10,0.92);
    border: 1px solid rgba(240,168,60,0.55);
    border-radius: 14px;
    padding: 18px 22px 14px;
    color: #f7ece9;
    box-shadow: 0 14px 40px rgba(0,0,0,0.5);
  }
  #car-menu.open { display: block; }
  .car-menu-title {
    font-family: 'Cinzel', serif;
    font-weight: 700;
    color: #ffd27a;
    font-size: 1rem;
    margin-bottom: 12px;
  }
  #car-menu-list { display: flex; flex-direction: column; gap: 8px; }
  #car-menu-list button {
    text-align: left;
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid rgba(240,168,60,0.3);
    background: rgba(240,168,60,0.06);
    color: #f7ece9;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
  }
  #car-menu-list button:hover { border-color: #ffd27a; background: rgba(240,168,60,0.14); }

  /* A `goal` mission step opens its tool right here, in-game, rather than
     a new tab — the whole point is watching for the tool's own
     postMessage confirming the task was actually done. */
  #tool-frame-overlay {
    position: fixed; inset: 0; z-index: 40;
    display: none; flex-direction: column;
    background: #05070a;
  }
  #tool-frame-overlay.open { display: flex; }
  #tool-frame-bar {
    display: flex; align-items: center; justify-content: space-between;
    flex: 0 0 auto;
    padding: 10px 16px;
    background: rgba(5,7,10,0.95);
    border-bottom: 1px solid rgba(240,168,60,0.4);
  }
  #tool-frame-title {
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: 0.9rem;
    color: #ffd27a;
    letter-spacing: 0.3px;
  }
  #tool-frame-close {
    width: 32px; height: 32px;
    border-radius: 50%;
    border: 1px solid rgba(240,168,60,0.4);
    background: rgba(240,168,60,0.06);
    color: #f7ece9;
    font-size: 1.2rem;
    line-height: 1;
    cursor: pointer;
  }
  #tool-frame-close:hover { border-color: #ffd27a; background: rgba(240,168,60,0.14); }
  #tool-frame { flex: 1 1 auto; width: 100%; border: none; background: #fff; }

  #tools-btn {
    top: 16px; left: 50%; transform: translateX(-50%);
    width: 40px; height: 40px;
    border-radius: 50%;
    background: rgba(5,7,10,0.55);
    border: 1px solid rgba(240,168,60,0.4);
    font-size: 1.1rem;
    backdrop-filter: blur(6px);
    cursor: pointer;
  }
  #tools-btn:hover { border-color: #ffd27a; }
  #mute-btn {
    top: 64px; right: 16px;
    width: 40px; height: 40px;
    border-radius: 50%;
    background: rgba(5,7,10,0.55);
    border: 1px solid rgba(240,168,60,0.4);
    color: #f7ece9;
    font-size: 1.1rem;
    backdrop-filter: blur(6px);
    cursor: pointer;
  }
  #mute-btn:hover { border-color: #ffd27a; }
  #mute-btn.muted { color: #8a8f96; }
  #tools-panel {
    display: none;
    top: 64px; left: 50%; transform: translateX(-50%);
    flex-direction: column;
    gap: 8px;
    background: rgba(8,6,10,0.9);
    border: 1px solid rgba(240,168,60,0.45);
    border-radius: 12px;
    padding: 12px 16px;
    white-space: nowrap;
  }
  #tools-panel.open { display: flex; }
  #tools-panel a {
    color: #f7ece9;
    font-size: 0.85rem;
    font-weight: 600;
    padding: 4px 6px;
  }
  #tools-panel a:hover { color: #ffd27a; }

  #toast {
    left: 50%; top: 14%;
    transform: translateX(-50%) translateY(-10px);
    background: rgba(8,6,10,0.85);
    border: 1px solid rgba(255,46,166,0.55);
    border-radius: 12px;
    padding: 12px 22px;
    color: #ffd27a;
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: 1rem;
    letter-spacing: 0.4px;
    text-align: center;
    opacity: 0;
    transition: opacity 0.35s ease, transform 0.35s ease;
    pointer-events: none;
    white-space: nowrap;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ---- start overlay ---- */
  #start-overlay {
    position: absolute; inset: 0; z-index: 30;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 24px;
    background:
      radial-gradient(circle at 30% 20%, rgba(255,46,166,0.18), transparent 55%),
      radial-gradient(circle at 75% 80%, rgba(240,168,60,0.14), transparent 55%),
      #05070a;
    transition: opacity 0.5s ease;
  }
  #start-overlay.hidden { opacity: 0; pointer-events: none; }
  #start-overlay h1 {
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: clamp(3rem, 12vw, 5.5rem);
    letter-spacing: 4px;
    background: linear-gradient(135deg, #ffd27a, #f0a83c);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 40px rgba(240,168,60,0.25);
  }
  #start-overlay p.tag {
    margin-top: 10px;
    color: #c7abb8;
    font-style: italic;
    font-size: clamp(0.9rem, 2vw, 1.05rem);
  }
  #start-overlay .controls {
    margin-top: 30px;
    display: flex; gap: 26px; flex-wrap: wrap; justify-content: center;
    color: #c7abb8; font-size: 0.82rem;
  }
  #start-overlay .controls b { color: #ffd27a; display: block; font-size: 0.75rem; letter-spacing: 1px; margin-bottom: 3px; text-transform: uppercase; }
  #begin-btn {
    margin-top: 36px;
    padding: 15px 40px;
    border-radius: 999px;
    border: 2px solid transparent;
    background: linear-gradient(135deg, #ff2ea6, #e11d5c);
    color: #17040d;
    font-weight: 700;
    font-family: 'Inter', sans-serif;
    font-size: 1rem;
    letter-spacing: 0.5px;
    cursor: pointer;
    box-shadow: 0 8px 26px rgba(255,46,166,0.35);
    transition: transform 0.2s ease;
  }
  #begin-btn:hover { transform: translateY(-2px); }

  /* ---- touch controls ---- */
  .touch-controls { display: none; }
  @media (hover: none) and (pointer: coarse) {
    .touch-controls { display: block; }
  }
  #dpad {
    position: absolute; z-index: 20; left: 18px; bottom: 22px;
    width: 148px; height: 148px;
  }
  #dpad button {
    position: absolute;
    width: 50px; height: 50px;
    background: rgba(20,12,16,0.55);
    border: 1px solid rgba(240,168,60,0.4);
    border-radius: 12px;
    color: #ffd27a;
    font-size: 1.2rem;
    backdrop-filter: blur(4px);
  }
  #dpad button:active { background: rgba(255,46,166,0.35); }
  #dpad .up { top: 0; left: 49px; }
  #dpad .down { bottom: 0; left: 49px; }
  #dpad .left { left: 0; top: 49px; }
  #dpad .right { right: 0; top: 49px; }

  #action-btn {
    position: absolute; z-index: 20; right: 26px; bottom: 34px;
    width: 74px; height: 74px;
    border-radius: 50%;
    background: rgba(255,46,166,0.28);
    border: 1px solid rgba(255,46,166,0.6);
    color: #f7ece9;
    font-weight: 700;
    font-size: 0.75rem;
    letter-spacing: 0.5px;
    backdrop-filter: blur(4px);
  }
  #action-btn:active { background: rgba(255,46,166,0.5); }

  #shankfiddle-credit {
    position: absolute; z-index: 10; left: 16px; bottom: 12px;
    font-size: 0.7rem; color: rgba(199,171,184,0.55);
    letter-spacing: 0.3px;
  }
  @media (hover: none) and (pointer: coarse) { #shankfiddle-credit { display: none; } }
</style>
</head>
<body>

<div id="game-root">
  <div class="tilt-band top"></div>
  <div class="tilt-band bottom"></div>
  <div class="vignette"></div>

  <div id="stats-hud" class="hud">
    <span><span class="icon">&#128176;</span><span id="money-count-text">0</span></span>
    <span><span class="icon">&#11088;</span><span id="reputation-count-text">0</span></span>
  </div>
  <div id="shard-counter" class="hud"><span class="icon">&#10022;</span><span id="shard-count-text">0 / 0</span></div>
  <button id="mute-btn" class="hud" title="Mute music &amp; sound effects">&#128266;</button>
  <button id="tools-btn" class="hud" title="shankFiddle tools">&#127932;</button>
  <div id="tools-panel" class="hud">
    <a href="../circle-of-fifths/" target="_blank" rel="noopener">&#127932; Circle of Fifths</a>
    <a href="../fractal/" target="_blank" rel="noopener">&#127744; Fractal Explorer</a>
  </div>
  <div id="dialogue" class="hud">
    <div id="dialogue-speaker"></div>
    <div id="dialogue-text"></div>
    <div id="dialogue-link"></div>
    <div class="prompt">&#9660; space to close</div>
  </div>
  <div id="toast" class="hud"></div>
  <div id="car-menu" class="hud">
    <div class="car-menu-title">Drive to&hellip;</div>
    <div id="car-menu-list"></div>
    <div class="prompt">&#9660; space to close</div>
  </div>
  <div id="tool-frame-overlay">
    <div id="tool-frame-bar">
      <span id="tool-frame-title"></span>
      <button id="tool-frame-close" title="Close">&times;</button>
    </div>
    <iframe id="tool-frame" allow="autoplay"></iframe>
  </div>
  <div id="shankfiddle-credit">Boy — a shankFiddle production</div>

  <div class="touch-controls" id="dpad">
    <button class="up" data-dir="up">&#9650;</button>
    <button class="down" data-dir="down">&#9660;</button>
    <button class="left" data-dir="left">&#9664;</button>
    <button class="right" data-dir="right">&#9654;</button>
  </div>
  <button class="touch-controls" id="action-btn">ACT</button>

  <div id="start-overlay">
    <h1>BOY</h1>
    <p class="tag">a tiny diorama adventure</p>
    <div class="controls">
      <div><b>Move</b>WASD / Arrow Keys</div>
      <div><b>Talk &amp; Interact</b>Space</div>
      <div><b>Goal</b>Talk to everyone you meet</div>
    </div>
    <button id="begin-btn">Begin Adventure</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
<script>
(function () {
  'use strict';

  // ========================================================================
  // LEVELS — this is the whole authoring surface. Add a new level by adding
  // a new entry here; nothing below this block needs to change.
  //
  // map:    array of equal-length strings (the grid). Legend:
  //           #  tree / solid border      .  grass          , flowers
  //           =  path                     o  rock            ~ water
  //           b  bush                     H  house footprint (any block of
  //              H tiles becomes one house prop sized to fit them)
  //           S  sign (reads signs[] in the order signs are encountered
  //              scanning the grid top-to-bottom, left-to-right) — plain
  //              environmental flavor text, not a character
  //           $  collectible Light Shard
  //           c  carrot — a job tier's harvest good (item 'vegetable'),
  //              see `job.tiers`. t (potato) and n (corn) are the same
  //              economy, just different growing things to look at —
  //              see parseLevel()'s switch and createCrop()'s `kind`.
  //           r  basket — a different tier's harvest good (Elsie's, not
  //              part of the vegetable economy above)
  //           p  seed row — Jono's one-time "plant the seeds" upgrade
  //              good, see `job.tiers`' oneTime/plantsSeeds tier
  //           e  crate — an advanced (higher-tier) harvest good
  //           V  practice spot — an interactable prop (not an NPC), see
  //              findNearbyPracticeSpot()/practiceViolin(). Interacting
  //              sets story.learned.practiced, a real one-time action a
  //              family dialogue beat's `requires` can gate on (see the
  //              "requires" shape in the dialogue doc below) instead of
  //              just being talked into existence.
  //           @  player start (used when this level loads with no explicit
  //              spawn override, i.e. as the first level, or via loadLevel
  //              with no spawn argument)
  //           1-9 exit portal — walking onto a digit tile used as a key in
  //              this level's `exits` teleports the player into another
  //              level at the tile given there. Reuse the same digit for
  //              more than one portal within a level, or different digits
  //              for several distinct exits.
  //           any other letter used as a key in this level's `npcs` — a
  //              named character. See `npcs` below.
  //           C  the car — one per game, wherever it's placed. Once earned
  //              (see CAR_FAMILY_RESPECT_THRESHOLD), interacting with it from
  //              anywhere opens a menu to drive straight to any other
  //              level, no matter how far or disconnected — this is how a
  //              new level avoids needing a portal wired into an existing
  //              map at all: it only needs to exist in LEVELS.
  //
  // signs:  array of dialogue strings, matched to 'S' tiles in scan order.
  // exits:  { '<digit>': { to: '<level id>', x: <tx>, y: <ty> } } — arrival
  //         tile in the destination level, in that level's own coordinates.
  // npcs:   { '<letter>': {
  //             id: 'dad',    // stable key into story.respect — every NPC
  //                           // worth tracking a relationship with should
  //                           // have one (falls back to name.toLowerCase()
  //                           // if omitted, but don't rely on that for
  //                           // names that collide once lowercased).
  //             name: 'Mom',
  //             appearance: { top, bottom, skin, hair, hairStyle, skirt,
  //               pieceType, pieceAccent, tieDye },
  //             // pieceType: 'pawn'|'king'|'queen'|'rook'|'bishop' — which
  //             // chess piece this NPC's body renders as when
  //             // CHARACTER_STYLE === 'chess' (defaults to 'pawn'; ignored
  //             // entirely in 'human' style). pieceAccent optionally colors
  //             // the king/queen/bishop head accessory (defaults gold;
  //             // Sir Earth's cross is white — see below).
  //             // tieDye: true swaps the flat `top` color for a painted
  //             // tie-dye pattern (see getTieDyeTexture()) — `top` is
  //             // still required as a fallback for CHARACTER_STYLE ===
  //             // 'human', which doesn't use it.
  //             // skin defaults to SKIN_LIGHT (everyone else in the world);
  //             // Boy's family uses SKIN_BROWN (0xa9714a) — pass it as the
  //             // literal since this data runs before those are defined.
  //             dialogue: { childhood: '...', diagnosis: '...', ... },
  //             presentFrom: 'diagnosis',  // absent BEFORE this chapter —
  //             absentFrom: 'grief',       // and gone FROM this chapter on.
  //             // Both are optional and independent, so the same map tile
  //             // (e.g. one letter in the Hospital's npcs) can be handed
  //             // off between different characters as the story moves —
  //             // a lab supervisor absentFrom 'diagnosis' vacates the spot
  //             // a nurse presentFrom 'diagnosis' then fills.
  //             presentDuring: ['childhood', 'hospice'],  // for a character
  //             // who is present, then gone, then present again — a single
  //             // contiguous presentFrom/absentFrom range can't express
  //             // that, so presentDuring is an explicit chapter whitelist
  //             // instead; give an NPC one or the other, not both. Dad
  //             // uses this: home for childhood/earning_respect, away at
  //             // the Hospital for diagnosis, home again for hospice.
  //             isFamily: true,  // every conversation (whatever line plays)
  //                               // also raises story.respect[id] — see the
  //                               // three-tier respect model below.
  //             challenge: {            // optional — makes talking to this
  //               key: 'violin',        // NPC a repeatable respect grind
  //               threshold: 3,         // (progress is tracked under this
  //               progressLines: ['...', '...', '...'],  // NPC's own id,
  //               completeLine: '...',                    // same as any
  //               learnedMessage: 'You learned the Violin! 🎻',  // other individual respect)
  //               link: { href: '...', label: '...' }  // optional — shown
  //             },                      // as a clickable link under
  //                                     // completeLine once learned, e.g.
  //                                     // pointing a music challenge at the
  //                                     // Circle of Fifths. Omit for a
  //                                     // challenge with no matching tool.
  //             missions: [ /* same shape as one `challenge`, in order */ ],
  //             // optional — an ORDERED chain of challenge-shaped steps for
  //             // an NPC who teaches something with real stages (each step
  //             // its own key/threshold/progressLines/completeLine/link).
  //             // story.missionStep[id] tracks which step is current; each
  //             // step's completeLine plays once, then the NEXT step's
  //             // progressLines start on the following conversation — no
  //             // separate unlock condition. Once every step is done,
  //             // talking falls through to `dialogue` (give these NPCs a
  //             // `dialogue.default` closing line) and the community they
  //             // stand in (world.id) gains MISSION_MASTERY_REPUTATION.
  //             // Use `challenge` instead for a single-stage skill.
  //             //
  //             // A step (in `missions`, or a standalone `challenge`) can
  //             // swap `threshold`/`progressLines` for `goal` instead:
  //             //   goal: { tool: 'fractal', id: 'zoom', href: '../fractal/app.html',
  //             //           linkLabel: 'Pan and zoom into the fractal →' },
  //             //   introLine: '...',  // shown the first time, opens the
  //             // }                    // tool in-game (see openToolFrame())
  //             // A `goal` step earns NOTHING for talking, ever — talking
  //             // just explains the task and (re)opens the tool. The point
  //             // is only awarded once the tool itself calls
  //             // `parent.postMessage({ source: 'boy-tool', tool, goal },
  //             // '*')`, matched against GOAL_INDEX and recorded in
  //             // story.goalDone[key] — see that listener and the sibling
  //             // tools' own instrumentation for what each `id` detects.
  //             // Next time you talk, `completeLine` plays and the mission
  //             // advances exactly like a threshold step completing.
  //             //
  //             // RULE: plain `threshold`/`progressLines` (talk N times,
  //             // done) is legacy and should not be used for a new skill
  //             // that has a matching app — it's exactly the "free respect
  //             // from talking" bug the rest of this file works hard to
  //             // avoid, just with nicer-sounding lines along the way. If
  //             // there's a real tool the skill maps to, use `goal` and
  //             // wire up that tool's own instrumentation (see the sibling
  //             // apps' `sendBoyGoal`) — that's how Sora/flute (its own
  //             // fluteCircleOfFifths tool) and Whitfield/Jax (sharing

  // Story progression — separate from any single level, since the same
  // place (like Home) needs to exist across multiple chapters with
  // different characters and dialogue. Advancing story.chapter and
  // reloading the current level is what moves the story forward; nothing
  // currently advances it past 'childhood' — that's the next piece to build.
  // 'duty' is the story's final state: respect fully earned.
  var CHAPTERS = ['childhood', 'earning_respect', 'diagnosis', 'hospice', 'grief', 'duty'];
  // See "the three-tier respect model" above LEVELS for what respect vs.
  // communityRespect vs. familyRespect() each mean and why they're separate.
  // respect: individual standing per NPC id, e.g. respect.dad, respect.violin.
  // learned: which challenges have been completed, e.g. learned.violin = true.
  // communityRespect: per-community standing, e.g. communityRespect.clearing.
  // money: global, fungible — not scoped to any individual or community.
  // hasCar: earned at the village's car once familyRespect() clears
  // CAR_FAMILY_RESPECT_THRESHOLD — see findNearbyCar()/handleAction().
  // missionStep: per-NPC progress through a `missions` chain, e.g.
  // missionStep.wainwright = 2 means steps 0 and 1 are done, step 2 is current.
  // chapterTalks: per-id-per-chapter visit count, e.g. chapterTalks['dad:diagnosis']
  // — indexes an array `dialogue` value's caregiving beats; separate from
  // the cumulative story.respect total (see talkToNpc's isFamily branch).
  // produce: harvested-but-not-yet-delivered goods by item, e.g.
  // produce.vegetable — see checkCropPickup() and a job's `harvest` field.
  // goalDone: a mission step's `key`, once its `goal` has actually been
  // verified inside the sibling tool itself — see the postMessage
  // listener (GOAL_INDEX) below and talkToNpc's mission-step branch.
  // fieldSeedsPlanted: set once, permanently, by Jono's oneTime
  // plantsSeeds job tier — see updateCropRespawns()/FIELD_REGROW_FAST.
  var story = { chapter: 'childhood', respect: {}, learned: {}, money: 0, communityRespect: {}, missionStep: {}, chapterTalks: {}, produce: {}, goalDone: {}, hasCar: false, fieldSeedsPlanted: false };
  var CAR_FAMILY_RESPECT_THRESHOLD = 3;
  // Community reputation gained once an NPC's whole `missions` chain is
  // finished — same idea as a job's per-visit `reputation`, but paid out
  // once, in full, as the reward for mastering what that mentor teaches.
  var MISSION_MASTERY_REPUTATION = 3;
  // Each threshold below gates one scripted chapter turn — see the four
  // checks in talkToNpc(). They only climb: earning the car is "they trust
  // you to drive," diagnosis is "you kept showing up after that," hospice
  // is "you kept showing up through the hospital stay," and the farewell
  // is "you were there for the whole of it." The last one, rebuilding with
  // just Mom, is scoped to her alone rather than the family sum, since
  // Dad's own respect is frozen once he's gone.
  //
  // Calibrated against what's actually earnable through real, distinct
  // tasks (see talkToNpc's isFamily branch — no more free respect from
  // repeating a conversation), with some slack so a chapter's tasks don't
  // all need to be found to progress. As more family tasks get written
  // for a chapter, its max grows — these can climb to match; they're not
  // sacred numbers, just today's calibration.
  var DIAGNOSIS_FAMILY_RESPECT_THRESHOLD = 9;
  var HOSPICE_FAMILY_RESPECT_THRESHOLD = 16;
  var FAREWELL_FAMILY_RESPECT_THRESHOLD = 24;
  var REBUILD_MOM_RESPECT_THRESHOLD = 16;
  function familyRespect() { return (story.respect.dad || 0) + (story.respect.mom || 0); }

  // absentFrom marks a character gone starting at that chapter and for
  // every chapter after it (not just that one) — once someone is gone from
  // the story, later chapters shouldn't accidentally bring them back.
  // presentFrom is the mirror image: gone in every chapter BEFORE the given
  // one. Together they let one map tile change hands between characters as
  // the chapter changes — e.g. the Hospital's lab supervisor (absentFrom
  // 'diagnosis') giving way to Dad and the nurse (both presentFrom
  // 'diagnosis') without any change to the level's map or tile layout.
  function npcAbsent(npcDef) {
    // presentDuring is an explicit whitelist for a character who isn't
    // present for one contiguous stretch of chapters — see the doc above
    // LEVELS. It fully replaces the presentFrom/absentFrom range check
    // below when given, rather than combining with it.
    if (npcDef.presentDuring) return npcDef.presentDuring.indexOf(story.chapter) === -1;
    var curIdx = CHAPTERS.indexOf(story.chapter);
    if (npcDef.presentFrom) {
      var presentIdx = CHAPTERS.indexOf(npcDef.presentFrom);
      if (presentIdx !== -1 && curIdx < presentIdx) return true;
    }
    if (npcDef.absentFrom) {
      var absentIdx = CHAPTERS.indexOf(npcDef.absentFrom);
      if (absentIdx !== -1 && curIdx >= absentIdx) return true;
    }
    return false;
  }
  // visitCount indexes an ARRAY dialogue value (a sequence of caregiving
  // beats for the current chapter, e.g. Mom's diagnosis lines) the same
  // way a challenge's progressLines cycle by `have` — a plain string
  // value ignores it entirely, so most NPCs never need to know it exists.
  function dialogueFor(npcDef, visitCount) {
    var idx = CHAPTERS.indexOf(story.chapter);
    for (var i = idx; i >= 0; i--) {
      var raw = npcDef.dialogue[CHAPTERS[i]];
      if (raw) {
        if (!Array.isArray(raw)) return raw;
        var entry = raw[Math.min(visitCount || 0, raw.length - 1)];
        // A beat gated behind a real task (see the "requires" shape in the
        // appearance/dialogue doc above LEVELS) is an object, not a plain
        // string — its `line` is what actually gets said once earned.
        // talkToNpc's isFamily branch checks `requires` itself before
        // ever reaching here, so by the time we unwrap it it's earned.
        return (entry && typeof entry === 'object') ? entry.line : entry;
      }
    }
    return npcDef.dialogue.default || '...';
  }

  // Chapters only ever move forward. Rebuilds the current level in place
  // (same tile, no travel) so absentFrom/dialogue/car-menu changes tied to
  // the new chapter take effect immediately rather than on the next level
  // change. Safe to call mid-conversation — callers that also want to show
  // a dialogue line for the new chapter should call this first, then open
  // the dialogue, since it's what makes dialogueFor() see the new chapter.
  function setChapter(newChapter) {
    var newIdx = CHAPTERS.indexOf(newChapter);
    var curIdx = CHAPTERS.indexOf(story.chapter);
    if (newIdx <= curIdx) return;
    story.chapter = newChapter;
    loadLevel(LEVEL_INDEX[world.id], { x: player.tileX, y: player.tileY });
  }

  var TILE = 2;
  // Top surface of a standard (non-water) ground tile — see makeTile's
  // positioning in buildWorldGroup. Characters are placed at y=0 (their own
  // local origin), so anything meant to sit visibly ON the ground rather
  // than embedded in it — like the chess-piece pedestal tile below — needs
  // this offset.
  var GROUND_SURFACE_Y = 0.15;

  function key(tx, ty) { return tx + ',' + ty; }
  function rand(a, b) { return a + Math.random() * (b - a); }

  // Pure — takes an explicit world so it's safe to use while building a
  // level that isn't the active one yet (see buildWorldGroup).
  function worldPos(w, tx, ty) {
    return { x: (tx - w.ORIGIN_X) * TILE, z: (ty - w.ORIGIN_Z) * TILE };
  }
  // Convenience wrapper for runtime/gameplay code, which always operates on
  // whichever level is currently active.
  function tileToWorld(tx, ty) { return worldPos(world, tx, ty); }

  // Parses a level's map into engine-agnostic data: which tiles block
  // movement, where every prop/enemy/shard/sign/portal goes, and where the
  // player starts. Doesn't touch Three.js at all.
  function parseLevel(levelDef) {
    var map = levelDef.map;
    var w = map[0].length, h = map.length;
    var exits = levelDef.exits || {};
    var npcs = levelDef.npcs || {};
    var obstacles = new Set();
    var features = { trees: [], rocks: [], bushes: [], flowers: [], shards: [], crops: [], signs: [], houseTiles: [], portals: [], npcs: [], practiceSpots: [], car: null };
    var groundKinds = [];
    var playerStart = { x: 1, y: 1 };

    for (var y = 0; y < h; y++) {
      groundKinds.push(map[y].split(''));
      for (var x = 0; x < w; x++) {
        var c = map[y][x];
        if (exits[c]) {
          features.portals.push({ x: x, y: y, to: exits[c].to, spawn: { x: exits[c].x, y: exits[c].y } });
          continue;
        }
        if (npcs[c]) {
          if (!npcAbsent(npcs[c])) {
            obstacles.add(key(x, y));
            features.npcs.push({ x: x, y: y, def: npcs[c] });
          }
          continue;
        }
        switch (c) {
          case '#': obstacles.add(key(x, y)); features.trees.push({ x: x, y: y }); break;
          case 'o': obstacles.add(key(x, y)); features.rocks.push({ x: x, y: y }); break;
          case 'b': obstacles.add(key(x, y)); features.bushes.push({ x: x, y: y }); break;
          case '~': obstacles.add(key(x, y)); break;
          case 'H': obstacles.add(key(x, y)); features.houseTiles.push({ x: x, y: y }); break;
          case 'S': obstacles.add(key(x, y)); features.signs.push({ x: x, y: y, message: (levelDef.signs || [])[features.signs.length] || 'A weathered sign, worn smooth by rain.' }); break;
          case ',': features.flowers.push({ x: x, y: y }); break;
          case '$': features.shards.push({ x: x, y: y, collected: false }); break;
          case 'c': features.crops.push({ x: x, y: y, collected: false, item: 'vegetable', kind: 'carrot' }); break;
          case 't': features.crops.push({ x: x, y: y, collected: false, item: 'vegetable', kind: 'potato' }); break;
          case 'n': features.crops.push({ x: x, y: y, collected: false, item: 'vegetable', kind: 'corn' }); break;
          case 'r': features.crops.push({ x: x, y: y, collected: false, item: 'basket' }); break;
          case 'p': features.crops.push({ x: x, y: y, collected: false, item: 'seedrow' }); break;
          case 'e': features.crops.push({ x: x, y: y, collected: false, item: 'crate' }); break;
          case 'C': obstacles.add(key(x, y)); features.car = { x: x, y: y }; break;
          case 'V': obstacles.add(key(x, y)); features.practiceSpots.push({ x: x, y: y }); break;
          case '@': playerStart = { x: x, y: y }; break;
        }
      }
    }

    return {
      id: levelDef.id,
      name: levelDef.name,
      W: w, H: h,
      ORIGIN_X: (w - 1) / 2, ORIGIN_Z: (h - 1) / 2,
      exitChars: new Set(Object.keys(exits)),
      obstacles: obstacles,
      features: features,
      groundKinds: groundKinds,
      playerStart: playerStart,
      totalShards: features.shards.length
    };
  }

  // ----------------------------------------------------------------------
  // Three.js setup — level-independent (scene, camera, renderer, lights).
  // ----------------------------------------------------------------------
  var root = document.getElementById('game-root');
  var SKY_COLOR = 0xbfe3ea;

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(SKY_COLOR);
  scene.fog = new THREE.Fog(SKY_COLOR, 22, 46);

  var camera = new THREE.PerspectiveCamera(30, root.clientWidth / root.clientHeight, 0.1, 100);

  var renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(root.clientWidth, root.clientHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.15;
  root.insertBefore(renderer.domElement, root.firstChild);

  var hemi = new THREE.HemisphereLight(0xdcefff, 0x3a5a34, 0.9);

  // ----------------------------------------------------------------------

  function makeTile(kindColor, thickness) {

    var mat = new THREE.MeshStandardMaterial({ color: kindColor, roughness: 0.9, metalness: 0.02 });
    var mesh = new THREE.Mesh(geo, mat);

  }

  // Every indoor location gets its own vibe: wall (replaces the outdoor
  // tree ring around '#'), floor (this level's base ground tile), prop
  // (replaces decorative rocks), and bg (scene background/fog while
  // inside — loadLevel swaps it in and out so indoors never shows the
  // outdoor sky). A level id with no entry here is outdoor/village as
  // before. Hospital's palette predates this registry (it shipped its own
  // clinical white first) — its floor values are carried over unchanged.
  // The Conservatory used to be in here too (a plum-and-gold recital
  // room) — it's a wooded clearing now instead, so it's deliberately
  // absent and falls through to the default outdoor look below (real
  // trees around '#', sky background, grass floor).
  var INTERIOR_THEMES = {
    home: { wall: 0xe0cba8, floor: 0x8a5c34, prop: 0x5a4230, bg: 0x2e2318 },
    hospital: { wall: 0xe3e8ea, floor: 0xeef1f2, prop: 0xc7d1d4, bg: 0xdfe6e8 },
    schoolhouse: { wall: 0x8a6a45, floor: 0xd8bd8a, prop: 0x2f4a3a, bg: 0x3a2e20 },
    studio: { wall: 0x2a3440, floor: 0x1f262d, prop: 0x4fd6c9, bg: 0x141a20 }
  };

  // levelId opts into a level-specific palette via INTERIOR_THEMES; a
  // level with no entry there stays the grassy outdoor default.
  function groundColorFor(c, levelId) {
    var theme = INTERIOR_THEMES[levelId];
    if (theme) {
      if (levelId === 'hospital' && c === '=') return new THREE.Color(0xcfd6d9).offsetHSL(rand(-0.01, 0.01), 0, rand(-0.02, 0.02));
      if (levelId === 'hospital' && c === '~') return new THREE.Color(0x3aa0c9);
      // per-tile jitter for a hand-painted look
      return new THREE.Color(theme.floor).offsetHSL(rand(-0.005, 0.005), rand(-0.02, 0.02), rand(-0.02, 0.015));
    }
    if (c === '=') return new THREE.Color(0xC9A876).offsetHSL(rand(-0.01, 0.01), 0, rand(-0.03, 0.02));
    if (c === '~') return new THREE.Color(0x3aa0c9);
    // grass base, with per-tile jitter for a hand-painted look
    return new THREE.Color(0x5fae4c).offsetHSL(rand(-0.02, 0.02), rand(-0.05, 0.05), rand(-0.04, 0.03));
  }
  var PORTAL_TILE_COLOR = 0x554a66;

  // Boy is telling his own story: he and his family (Mom, Dad) are Indian
  // — everyone else in the world defaults to SKIN_LIGHT unless an NPC's
  // appearance explicitly overrides it.
  var SKIN_LIGHT = 0xe8b58c;
  var SKIN_BROWN = 0xa9714a;

  // Character body style toggle. 'chess' renders every character's torso

  // the npcs legend above LEVELS); 'human' renders the original capsule

  // underneath it changes. Flip this one constant to change every

  // change just them.
  var CHARACTER_STYLE = 'chess';

  function createTree() {
    var g = new THREE.Group();
    var trunk = new THREE.Mesh(
      new THREE.CylinderGeometry(0.16, 0.2, 0.9, 8),
      new THREE.MeshStandardMaterial({ color: 0x7a4a2b, roughness: 0.95 })
    );
    trunk.position.y = 0.45;
    trunk.castShadow = true;
    g.add(trunk);
    var leafMat = new THREE.MeshStandardMaterial({ color: 0x3f8f4a, roughness: 0.85 });
    var tiers = [ [0.85, 0.95, 1.05], [0.65, 1.4, 1.4], [0.45, 1.85, 1.75] ];
    tiers.forEach(function (t) {
      var cone = new THREE.Mesh(new THREE.ConeGeometry(t[0], 0.85, 7), leafMat);
      cone.position.y = t[1];
      cone.rotation.y = rand(0, Math.PI);
      cone.castShadow = true;
      g.add(cone);
    });
    g.scale.setScalar(rand(0.92, 1.1));
    g.rotation.y = rand(0, Math.PI * 2);
    return g;
  }

  // Indoor counterpart to createTree() — a plain interior wall block for
  // an INTERIOR_THEMES level's '#' border, so it reads as a room instead
  // of a tree-ringed clearing.
  function createInteriorWall(color) {
    var g = new THREE.Group();
    var mesh = new THREE.Mesh(
      new THREE.BoxGeometry(TILE * 0.98, 1.9, TILE * 0.98),
      new THREE.MeshStandardMaterial({ color: color, roughness: 0.8 })

  // Indoor counterpart to createRock() — a plain furniture-block stand-in

  }

  function createRock() {
    var g = new THREE.Group();
    var mesh = new THREE.Mesh(
      new THREE.IcosahedronGeometry(0.5, 0),
      new THREE.MeshStandardMaterial({ color: 0x9a978f, roughness: 0.95, flatShading: true })

    mesh.castShadow = true;

    g.add(mesh);
    return g;
  }

  function createBush() {
    var g = new THREE.Group();
    var mat = new THREE.MeshStandardMaterial({ color: 0x3c7a3f, roughness: 0.9 });
    for (var i = 0; i < 4; i++) {
      var s = new THREE.Mesh(new THREE.SphereGeometry(0.32, 8, 8), mat);
      s.position.set(rand(-0.22, 0.22), rand(0.25, 0.45), rand(-0.22, 0.22));

  function createFlower() {
    var g = new THREE.Group();
    var petalColor = [0xff6fa5, 0xffd166, 0xff8c42, 0xef476f][Math.floor(rand(0, 4))];
    var stem = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.28, 5), new THREE.MeshStandardMaterial({ color: 0x4a8f3f }));
    stem.position.y = 0.14;

  // Sized from tile-index deltas only (no world-origin lookup), so it can
  // be built before the level that owns it has become the active world.
  // buildWorldGroup positions the returned group afterward.
  // theme: 'clinical' swaps the cozy cottage palette (tan walls, terracotta
  // roof, wood door) for a pale, institutional one — used for the Hospital,
  // the one building that shouldn't look like a village home.
  function createHouse(tiles, theme) {
    var minX = Math.min.apply(null, tiles.map(function (t) { return t.x; }));
    var maxX = Math.max.apply(null, tiles.map(function (t) { return t.x; }));
    var minY = Math.min.apply(null, tiles.map(function (t) { return t.y; }));
    var maxY = Math.max.apply(null, tiles.map(function (t) { return t.y; }));
    var width = (maxX - minX) * TILE + TILE * 0.92;
    var depth = (maxY - minY) * TILE + TILE * 0.92;
    var clinical = theme === 'clinical';

    var g = new THREE.Group();
    var wallH = 1.7;
    var walls = new THREE.Mesh(
      new THREE.BoxGeometry(width, wallH, depth),
      new THREE.MeshStandardMaterial({ color: clinical ? 0xf5f7f8 : 0xE4C79A, roughness: clinical ? 0.6 : 0.85 })
    );
    walls.position.y = wallH / 2;
    walls.castShadow = true;
    walls.receiveShadow = true;
    g.add(walls);

    // A peaked roof reads as "a house" — right for a village cottage, wrong
    // for a mass sitting inside the Hospital's own interior, so clinical
    // gets a flat capped ceiling slab instead of the cottage's cone.
    var roof = clinical
      ? new THREE.Mesh(
          new THREE.BoxGeometry(width * 1.06, 0.18, depth * 1.06),
          new THREE.MeshStandardMaterial({ color: 0xc7d1d4, roughness: 0.6 })
        )
      : new THREE.Mesh(
          new THREE.ConeGeometry(Math.max(width, depth) * 0.78, 1.15, 4),
          new THREE.MeshStandardMaterial({ color: 0xB5432E, roughness: 0.75 })
        );
    if (clinical) {
      roof.position.y = wallH + 0.09;
    } else {
      roof.rotation.y = Math.PI / 4;
      roof.position.y = wallH + 0.5;
    }
    roof.castShadow = true;
    g.add(roof);

    var door = new THREE.Mesh(
      new THREE.BoxGeometry(0.6, 1.05, 0.06),
      new THREE.MeshStandardMaterial({ color: clinical ? 0x9aa7ac : 0x5b3620 })
    );
    door.position.set(0, 0.52, depth / 2 + 0.03);
    g.add(door);

    var window1 = new THREE.Mesh(
      new THREE.BoxGeometry(0.4, 0.4, 0.05),
      new THREE.MeshStandardMaterial({ color: 0x9fd8e8, emissive: 0x2a4650, emissiveIntensity: 0.4 })
    );
    window1.position.set(width / 2 + 0.03, 1.0, 0);
    window1.rotation.y = Math.PI / 2;
    g.add(window1);

    return g;
  }

  function createSignPost() {
    var g = new THREE.Group();
    var post = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.07, 0.9, 6), new THREE.MeshStandardMaterial({ color: 0x6b4526 }));
    post.position.y = 0.45;

  // A job's `harvest` requirement — walk over one of these to add to
  // story.produce[item], the same way a shard adds to the level puzzle,
  // except these feed a job turn-in instead: see checkCropPickup() and
  // talkToNpc()'s job branch. Takes `kind` (falls back to `item` when a
  // feature has no separate one) purely for which model to build — carrot/
  // potato/corn all feed the SAME `vegetable` economy, just for variety.
  function createCrop(kind) {
    var g = new THREE.Group();
    if (kind === 'basket') {
      var basket = new THREE.Mesh(
        new THREE.CylinderGeometry(0.22, 0.16, 0.28, 8),
        new THREE.MeshStandardMaterial({ color: 0x8a6a3a, roughness: 0.9 })
      );
      basket.position.y = 0.16;
      basket.castShadow = true;
      g.add(basket);
      var goods = new THREE.Mesh(
        new THREE.SphereGeometry(0.14, 8, 8),
        new THREE.MeshStandardMaterial({ color: 0xd6432f, roughness: 0.6 })
      );
      goods.position.y = 0.32;
      goods.castShadow = true;
      g.add(goods);
    } else if (kind === 'crate') {
      var crate = new THREE.Mesh(
        new THREE.BoxGeometry(0.32, 0.28, 0.32),
        new THREE.MeshStandardMaterial({ color: 0x7a5a35, roughness: 0.9 })
      );
      crate.position.y = 0.16;
      crate.castShadow = true;
      g.add(crate);
      var band = new THREE.Mesh(
        new THREE.BoxGeometry(0.34, 0.05, 0.34),
        new THREE.MeshStandardMaterial({ color: 0x4a3520, roughness: 0.9 })
      );
      band.position.y = 0.16;
      g.add(band);
    } else if (kind === 'seedrow') {
      var mound = new THREE.Mesh(
        new THREE.BoxGeometry(0.4, 0.08, 0.22),
        new THREE.MeshStandardMaterial({ color: 0x5a3f28, roughness: 0.95 })
      );
      mound.position.y = 0.06;
      mound.castShadow = true;
      g.add(mound);

  // ----------------------------------------------------------------------
  // Chess-piece bodies — replace the capsule-torso-and-legs body when
  // CHARACTER_STYLE === 'chess'. Each returns a pedestal shaped and sized
  // to reach up near where the (unchanged) head sits; head/hair/scarf are
  // still built by createHuman/createPlayer on top of whichever body they
  // get, so a character's costume colors carry over unchanged either way.
  // ----------------------------------------------------------------------
  // topColor/bottomColor are normally a hex number, but may instead be a
  // THREE.Texture (see getTieDyeTexture()) for a patterned costume — this
  // is the one place that distinction is handled, so every piece body
  // builder below can just call it instead of constructing its own
  // MeshStandardMaterial.
  function pieceMaterial(colorOrTexture, roughness) {
    if (colorOrTexture && colorOrTexture.isTexture) {
      return new THREE.MeshStandardMaterial({ map: colorOrTexture, roughness: roughness });
    }
    return new THREE.MeshStandardMaterial({ color: colorOrTexture, roughness: roughness });
  }

  // A blotchy tie-dye pattern, painted once onto a canvas and reused by
  // every character with `appearance.tieDye: true` (see createHuman) —
  // there's only one canvas ever built for this, not one per character.
  var tieDyeTexture = null;
  function getTieDyeTexture() {
    if (tieDyeTexture) return tieDyeTexture;
    var size = 128;
    var canvas = document.createElement('canvas');
    canvas.width = size;
    canvas.height = size;
    var ctx = canvas.getContext('2d');
    var colors = ['#ff2ea6', '#ffcf3a', '#3ad6ff', '#7a4fff', '#5fdc6a', '#ff6a3a'];
    ctx.fillStyle = colors[0];
    ctx.fillRect(0, 0, size, size);
    ctx.globalAlpha = 0.85;
    for (var i = 0; i < 22; i++) {
      var cx = rand(0, size), cy = rand(0, size), r = rand(size * 0.14, size * 0.4);
      var grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
      grad.addColorStop(0, colors[Math.floor(rand(0, colors.length))]);
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    tieDyeTexture = new THREE.CanvasTexture(canvas);
    tieDyeTexture.wrapS = tieDyeTexture.wrapT = THREE.RepeatWrapping;
    return tieDyeTexture;
  }

  function createPawnBody(topColor, bottomColor) {

    collar.rotation.x = Math.PI / 2;

    return g;
  }

  function createRookBody(topColor, bottomColor) {

  var PIECE_BODY_BUILDERS = {
    pawn: createPawnBody,
    king: createKingBody,
    queen: createQueenBody,
    rook: createRookBody,
    bishop: createBishopBody
  };

  // Small accessories worn on top of the head to distinguish the taller
  // pieces further — pawn and rook (and bishop, whose body already tapers
  // to a point) don't get one.
  function createCrossTopper(color) {

    var mat = new THREE.MeshStandardMaterial({ color: color, metalness: 0.55, roughness: 0.3, emissive: color, emissiveIntensity: 0.18 });
    var band = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.17, 0.08, 16), mat);
    band.position.y = 0.04;
    band.castShadow = true;

    vert.position.y = 0.08 + 0.17;

    var horiz = new THREE.Mesh(new THREE.BoxGeometry(0.26, 0.09, 0.09), mat);
    horiz.position.y = 0.08 + 0.24;
    horiz.castShadow = true;
    g.add(vert, horiz);
    return g;
  }

  function createCrownTopper(color) {
    var g = new THREE.Group();
    var mat = new THREE.MeshStandardMaterial({ color: color, metalness: 0.55, roughness: 0.3, emissive: color, emissiveIntensity: 0.18 });
    var band = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.19, 0.09, 16), mat);
    band.position.y = 0.045;
    band.castShadow = true;
    g.add(band);

    for (var i = 0; i < spikes; i++) {
      var a = (i / spikes) * Math.PI * 2;
      var spike = new THREE.Mesh(new THREE.ConeGeometry(0.05, 0.2, 8), mat);
      spike.position.set(Math.cos(a) * 0.15, 0.09 + 0.1, Math.sin(a) * 0.15);
      spike.castShadow = true;
      g.add(spike);
    }
    var jewel = new THREE.Mesh(new THREE.SphereGeometry(0.04, 8, 8), mat);
    jewel.position.y = 0.09 + 0.22;
    g.add(jewel);
    return g;
  }

  function createBallTopper(color) {
    var g = new THREE.Group();
    var mat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.4, metalness: 0.3 });
    var ball = new THREE.Mesh(new THREE.SphereGeometry(0.055, 10, 10), mat);
    ball.position.y = 0.08; // crown/cross sit lower now (right on the head); keep the bishop's finial floating where it was
    g.add(ball);

  }

  var PIECE_TOPPER_BUILDERS = {
    king: createCrossTopper,
    queen: createCrownTopper,
    bishop: createBallTopper
  };

  // Generic adult NPC — same low-poly-diorama vocabulary as the player,
  // but taller proportions and customizable clothing/hair so Mom, Dad, and
  // every future townsperson can share one builder.
  function createHuman(opts) {
    opts = opts || {};
    var skinColor = opts.skin || SKIN_LIGHT;
    var hairColor = opts.hair || 0x3a2a22;
    var topColor = opts.tieDye ? getTieDyeTexture() : (opts.top || 0x6b7a8f);
    var bottomColor = opts.bottom || 0x2e2a35;

    var g = new THREE.Group();
    var pivot = new THREE.Group();
    g.add(pivot);

    var isChess = CHARACTER_STYLE === 'chess';
    if (isChess) {
      var pieceType = opts.pieceType || 'pawn';
      var pieceBuilder = PIECE_BODY_BUILDERS[pieceType] || createPawnBody;
      pivot.add(pieceBuilder(topColor, bottomColor));
    } else {
      var body = new THREE.Mesh(
        new THREE.CapsuleGeometry(0.27, 0.5, 4, 8),
        new THREE.MeshStandardMaterial({ color: topColor, roughness: 0.7 })
      );
      body.position.y = 0.63;
      body.castShadow = true;
      pivot.add(body);

      if (opts.skirt) {
        var skirt = new THREE.Mesh(new THREE.ConeGeometry(0.3, 0.4, 10), new THREE.MeshStandardMaterial({ color: bottomColor, roughness: 0.75 }));
        skirt.position.y = 0.22;
        skirt.castShadow = true;
        pivot.add(skirt);
      } else {
        var legGeo = new THREE.CylinderGeometry(0.09, 0.09, 0.42, 8);
        var legMat = new THREE.MeshStandardMaterial({ color: bottomColor });
        [-0.13, 0.13].forEach(function (lx) {
          var leg = new THREE.Mesh(legGeo, legMat);
          leg.position.set(lx, 0.21, 0);
          leg.castShadow = true;
          pivot.add(leg);
        });
      }
    }

    // Shrunk well below life-size proportions in chess mode on purpose — a
    // human-sized head on top of a piece-shaped body read as "a person
    // standing on a fancy plinth," not as a chess piece. A small head
    // perched atop a much bigger turned body is the actual piece silhouette
    // (think finial, not head), while still carrying skin tone and hair so
    // family/identity stays legible.
    var headRadius = isChess ? 0.16 : 0.23;
    var head = new THREE.Mesh(new THREE.SphereGeometry(headRadius, 14, 12), new THREE.MeshStandardMaterial({ color: skinColor, roughness: 0.6 }));
    head.position.y = 1.28;
    head.castShadow = true;
    pivot.add(head);

    var hairMat = new THREE.MeshStandardMaterial({ color: hairColor, roughness: 0.7 });
    var hair;
    if (opts.hairStyle === 'long') {
      hair = new THREE.Mesh(new THREE.SphereGeometry(headRadius + (isChess ? 0.014 : 0.02), 14, 12, 0, Math.PI * 2, 0, Math.PI * 0.8), hairMat);
      hair.position.y = 1.24;
    } else {
      hair = new THREE.Mesh(new THREE.SphereGeometry(headRadius + (isChess ? 0.008 : 0.01), 14, 12, 0, Math.PI * 2, 0, Math.PI * 0.55), hairMat);
      hair.position.y = 1.32;
    }
    pivot.add(hair);

    if (isChess) {
      var topperBuilder = PIECE_TOPPER_BUILDERS[opts.pieceType];
      if (topperBuilder) {
        var topper = topperBuilder(opts.pieceAccent || 0xf0a83c);
        topper.position.y = head.position.y + 0.19;
        pivot.add(topper);
      }
    }

    g.userData = { pivot: pivot, idlePhase: rand(0, Math.PI * 2) };
    return g;
  }

  function createPlayer() {
    var g = new THREE.Group();
    var tunicMat = new THREE.MeshStandardMaterial({ color: 0x2f6fb0, roughness: 0.7 });
    var skinMat = new THREE.MeshStandardMaterial({ color: SKIN_BROWN, roughness: 0.6 });
    var hairMat = new THREE.MeshStandardMaterial({ color: 0x4a2f22, roughness: 0.7 });
    var scarfMat = new THREE.MeshStandardMaterial({ color: 0xd6432f, roughness: 0.6 });

    var pivot = new THREE.Group();
    g.add(pivot);

    var body = null, legL = null, legR = null;
    var isChess = CHARACTER_STYLE === 'chess';

    if (isChess) {
      pivot.add(createPawnBody(0x2f6fb0, 0x3a2a20));
    } else {
      body = new THREE.Mesh(new THREE.CapsuleGeometry(0.26, 0.42, 4, 8), tunicMat);
      body.position.y = 0.5;
      body.castShadow = true;
      pivot.add(body);

      var legGeo = new THREE.CylinderGeometry(0.075, 0.075, 0.34, 8);
      var legMat = new THREE.MeshStandardMaterial({ color: 0x3a2a20 });
      legL = new THREE.Mesh(legGeo, legMat);
      legL.position.set(-0.12, 0.17, 0);
      legL.castShadow = true;
      pivot.add(legL);
      legR = new THREE.Mesh(legGeo, legMat);
      legR.position.set(0.12, 0.17, 0);
      legR.castShadow = true;
      pivot.add(legR);
    }

    // Same shrink-the-head reasoning as createHuman() — see the comment
    // there.
    var playerHeadRadius = isChess ? 0.17 : 0.24;
    var head = new THREE.Mesh(new THREE.SphereGeometry(playerHeadRadius, 14, 12), skinMat);
    head.position.y = 0.98;
    head.castShadow = true;
    pivot.add(head);

    var hair = new THREE.Mesh(new THREE.SphereGeometry(playerHeadRadius + (isChess ? 0.011 : 0.015), 14, 12, 0, Math.PI * 2, 0, Math.PI * 0.62), hairMat);
    hair.position.y = 1.0;
    pivot.add(hair);

    var scarf = new THREE.Mesh(new THREE.TorusGeometry(isChess ? 0.16 : 0.22, isChess ? 0.045 : 0.06, 8, 12), scarfMat);
    scarf.rotation.x = Math.PI / 2;
    scarf.position.y = isChess ? 0.93 : 0.78;
    pivot.add(scarf);

    // Pawn is the smallest, plainest piece by design — no topper. Leg
    // refs stay null in chess mode; the walk-swing animation guards for
    // that and skips itself (a piece doesn't need a leg-cycle to glide).
    g.userData = { pivot: pivot, legL: legL, legR: legR, body: body, head: head };
    return g;
  }

  // ----------------------------------------------------------------------
  // World construction / teardown — turns parsed level data into a Three.js
  // group. This is the only place that touches the scene graph per level.
  // ----------------------------------------------------------------------
  function buildWorldGroup(w) {
    var group = new THREE.Group();
    var waterTiles = [];

    for (var gy = 0; gy < w.H; gy++) {
      for (var gx = 0; gx < w.W; gx++) {
        var ch = w.groundKinds[gy][gx];
        var isPortal = w.exitChars.has(ch);
        var thickness = ch === '~' ? 0.16 : 0.3;
        var color = isPortal ? PORTAL_TILE_COLOR : groundColorFor(ch, w.id);
        var tileMesh = makeTile(color, thickness);
        var pos = worldPos(w, gx, gy);
        tileMesh.position.set(pos.x, thickness / -2 + (ch === '~' ? 0.02 : GROUND_SURFACE_Y), pos.z);
        group.add(tileMesh);
        if (ch === '~') waterTiles.push({ mesh: tileMesh, phase: rand(0, Math.PI * 2), baseY: tileMesh.position.y });
      }
    }

    function place(list, builder) {
      list.forEach(function (f) {
        var p = worldPos(w, f.x, f.y);
        var obj = builder(f);
        obj.position.x += p.x;
        obj.position.z += p.z;
        group.add(obj);
        f.obj = obj;
      });
    }

    // An INTERIOR_THEMES level swaps the outdoor tree ring and rock
    // decorations for plain walls/furniture in its own palette, and drops
    // flowers entirely — none of that reads as "indoors" otherwise.
    var interiorTheme = INTERIOR_THEMES[w.id];
    place(w.features.trees, interiorTheme ? function () { return createInteriorWall(interiorTheme.wall); } : createTree);
    place(w.features.rocks, interiorTheme ? function () { return createInteriorProp(interiorTheme.prop); } : createRock);
    place(w.features.bushes, createBush);
    if (!interiorTheme) place(w.features.flowers, createFlower);
    place(w.features.signs, createSignPost);
    place(w.features.portals, createPortalMarker);

    if (w.features.houseTiles.length) {
      var hMinX = Math.min.apply(null, w.features.houseTiles.map(function (t) { return t.x; }));
      var hMaxX = Math.max.apply(null, w.features.houseTiles.map(function (t) { return t.x; }));
      var hMinY = Math.min.apply(null, w.features.houseTiles.map(function (t) { return t.y; }));
      var hMaxY = Math.max.apply(null, w.features.houseTiles.map(function (t) { return t.y; }));
      var hc1 = worldPos(w, hMinX, hMinY), hc2 = worldPos(w, hMaxX, hMaxY);
      var house = createHouse(w.features.houseTiles, w.id === 'hospital' ? 'clinical' : undefined);
      house.position.set((hc1.x + hc2.x) / 2, 0, (hc1.z + hc2.z) / 2);
      group.add(house);
    }

    place(w.features.shards, createShard);
    place(w.features.crops, function (f) { return createCrop(f.kind || f.item); });
    place(w.features.practiceSpots, createPracticeSpot);

    w.features.npcs.forEach(function (n) {
      var p = worldPos(w, n.x, n.y);
      var obj = createHuman(n.def.appearance);
      obj.position.set(p.x, 0, p.z);
      group.add(obj);
      n.obj = obj;
    });

    if (w.features.car) {
      var carPos = worldPos(w, w.features.car.x, w.features.car.y);
      var carObj = createCar();
      carObj.position.set(carPos.x, 0, carPos.z);
      group.add(carObj);
      w.features.car.obj = carObj;
    }

    return { group: group, waterTiles: waterTiles };
  }

  function disposeGroup(group) {
    group.traverse(function (obj) {
      if (obj.isMesh) {
        if (obj.geometry) obj.geometry.dispose();
        if (obj.material) {
          if (Array.isArray(obj.material)) obj.material.forEach(function (m) { m.dispose(); });
          else obj.material.dispose();
        }
      }
    });
  }

  // ----------------------------------------------------------------------
  // Player state
  // ----------------------------------------------------------------------
  var DIR_VEC = { up: { dx: 0, dz: -1 }, down: { dx: 0, dz: 1 }, left: { dx: -1, dz: 0 }, right: { dx: 1, dz: 0 } };
  var DIR_ROT = { down: 0, up: Math.PI, right: Math.PI / 2, left: -Math.PI / 2 };

  // The player's facing direction is remembered independent of movement —
  // set the instant a direction is pressed, not deferred to the next move
  // tick, so even a very quick tap (or a tap+release inside one frame)
  // still turns the character to face that way.
  function setFacing(dir) {
    player.facing = dir;
    player.obj.rotation.y = DIR_ROT[dir];
  }

  var player = {
    obj: createPlayer(),
    tileX: 0,
    tileY: 0,
    facing: 'down',
    isMoving: false,
    moveElapsed: 0,
    from: null,
    to: null
  };

  var MOVE_DURATION = 0.17;

  // ----------------------------------------------------------------------
  // Camera
  // ----------------------------------------------------------------------
  var camOffset = new THREE.Vector3(0, 10.5, 6.2);
  var camLookAhead = new THREE.Vector3(0, 0.6, -1.1);

  window.addEventListener('resize', function () {
    camera.aspect = root.clientWidth / root.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(root.clientWidth, root.clientHeight);
  });

  // ----------------------------------------------------------------------
  // Level loading — the level-switching engine. loadLevel() is the whole
  // API: tear down the current level's group (if any), build the new one,
  // drop the player at the right spawn tile, and snap the camera/shadow
  // frustum to fit.
  // ----------------------------------------------------------------------
  var world = null;
  var LEVEL_INDEX = {};
  LEVELS.forEach(function (lvl, i) { LEVEL_INDEX[lvl.id] = i; });

  // GOAL_INDEX['<tool>:<goal id>'] -> { key, npcName } — built once from
  // every mission/challenge step with a `goal`, so the postMessage
  // listener below can turn a tool's "I saw you do X" into "which mission
  // key was that for, and whose name goes in the toast." See the `goal`
  // field's doc comment above LEVELS.
  var GOAL_INDEX = {};
  LEVELS.forEach(function (lvl) {
    if (!lvl.npcs) return;
    Object.keys(lvl.npcs).forEach(function (letter) {
      var npc = lvl.npcs[letter];
      var steps = npc.missions || (npc.challenge ? [npc.challenge] : []);
      steps.forEach(function (step) {
        if (step.goal) GOAL_INDEX[step.goal.tool + ':' + step.goal.id] = { key: step.key, npcName: npc.name };
      });
    });
  });

  // A sibling tool running in #tool-frame posts this when the player
  // does the SPECIFIC thing a mission step asked for — never on merely
  // opening the tool. Matched against GOAL_INDEX; story.goalDone[key] is
  // what talkToNpc's `goal` branch actually checks (see there for why
  // this doesn't just complete the step immediately: you still have to
  // go tell the teacher, same as every other mission in this game).
  window.addEventListener('message', function (e) {
    if (!e.data || e.data.source !== 'boy-tool') return;
    var entry = GOAL_INDEX[e.data.tool + ':' + e.data.goal];
    if (!entry || story.goalDone[entry.key]) return;
    story.goalDone[entry.key] = true;
    showToast('✓ Task complete! Go tell ' + entry.npcName + '.', 2600);
    setTimeout(closeToolFrame, 1400);
  });

  function loadLevel(index, spawnOverride) {
    var levelDef = LEVELS[index];
    // First step outside Home, into the village — respect-earning begins.
    if (levelDef.id === 'clearing' && story.chapter === 'childhood') {
      story.chapter = 'earning_respect';
    }
    var newWorld = parseLevel(levelDef);
    var built = buildWorldGroup(newWorld);
    newWorld.group = built.group;
    newWorld.waterTiles = built.waterTiles;
    newWorld.shardsCollected = 0;
    newWorld.maxShards = newWorld.totalShards;

    // Indoors never shows the outdoor sky — swap the background/fog color
    // to this level's own interior tone, or back to SKY_COLOR outdoors.
    var bgColor = (INTERIOR_THEMES[levelDef.id] || { bg: SKY_COLOR }).bg;
    scene.background = new THREE.Color(bgColor);
    scene.fog.color.set(bgColor);

    if (world) {
      scene.remove(world.group);
      disposeGroup(world.group);
    }

    world = newWorld;
    scene.add(world.group);
    world.group.add(player.obj);

    var spawnTile = spawnOverride || world.playerStart;
    player.tileX = spawnTile.x;
    player.tileY = spawnTile.y;
    player.isMoving = false;
    var p = tileToWorld(player.tileX, player.tileY);
    player.obj.position.set(p.x, 0, p.z);

    var shadowSpan = Math.max(world.W, world.H) * TILE * 0.6;
    sun.shadow.camera.left = -shadowSpan;
    sun.shadow.camera.right = shadowSpan;
    sun.shadow.camera.top = shadowSpan;
    sun.shadow.camera.bottom = -shadowSpan;
    sun.shadow.camera.updateProjectionMatrix();

    renderShardCount();
    renderStats();
    dialogueOpen = false;
    closeDialogue();
    closeCarMenu();

    // Snap instantly rather than lerping — panning across the old map on
    // the way to the new one would look broken.
    camera.position.copy(player.obj.position).add(camOffset);
    camera.lookAt(player.obj.position.clone().add(camLookAhead));

    startMusicForLevel(levelDef.id);
    showToast(levelDef.name, 2000);
  }

  // ----------------------------------------------------------------------
  // Audio — tiny synthesized SFX + a per-level 8-bit soundtrack, no
  // external files. Everything routes through masterGain, so one mute
  // toggle (see muted/setMuted() and #mute-btn below) silences both at
  // once — sfxBus and musicBus underneath it exist only to let music sit
  // quieter than sound effects, never to be muted independently.
  // ----------------------------------------------------------------------
  var audioCtx = null, masterGain = null, sfxBus = null, musicBus = null;
  var muted = (function () {
    try { return localStorage.getItem('boy_muted') === '1'; } catch (e) { return false; }
  })();
  function ensureAudio() {
    if (!audioCtx) {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      audioCtx = new Ctx();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = muted ? 0 : 1;
      masterGain.connect(audioCtx.destination);
      sfxBus = audioCtx.createGain();
      sfxBus.gain.value = 1;
      sfxBus.connect(masterGain);
      musicBus = audioCtx.createGain();
      musicBus.gain.value = 0.55;
      musicBus.connect(masterGain);
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    // Music is scheduled independently of any user gesture (see
    // startMusicForLevel), so the very first gesture that unlocks
    // audioCtx also needs to kick the current level's loop off.
    if (!musicState.timer && world) startMusicForLevel(world.id);
  }
  function setMuted(next) {
    muted = next;
    try { localStorage.setItem('boy_muted', muted ? '1' : '0'); } catch (e) {}
    if (masterGain) masterGain.gain.value = muted ? 0 : 1;
    var btn = document.getElementById('mute-btn');
    btn.textContent = muted ? '\u{1F507}' : '\u{1F50A}';
    btn.classList.toggle('muted', muted);
  }
  function tone(freq, start, dur, type, gain, bus) {
    if (!audioCtx) return;
    var osc = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    g.gain.value = 0;
    osc.connect(g);
    g.connect(bus || sfxBus);
    var t0 = audioCtx.currentTime + start;
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(gain || 0.18, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.start(t0);
    osc.stop(t0 + dur + 0.02);
  }
  function sfxPickup() { tone(660, 0, 0.12, 'triangle'); tone(880, 0.07, 0.14, 'triangle'); tone(1180, 0.14, 0.2, 'triangle'); }
  function sfxWin() { [523, 659, 784, 1046].forEach(function (f, i) { tone(f, i * 0.12, 0.28, 'triangle'); }); }
  function sfxBump() { tone(140, 0, 0.06, 'square', 0.08); }
  function sfxPortal() { tone(440, 0, 0.14, 'sine', 0.14); tone(660, 0.08, 0.2, 'sine', 0.14); tone(880, 0.16, 0.26, 'sine', 0.12); }

  // A one-shot flourish for the moment a challenge is actually LEARNED
  // (story.learned[ch.key] going true for the first time — see
  // completeMissionStep()), not a loop. The four classic instrument
  // teachers (violin/piano/guitar/flute) each get a motif shaped like
  // their instrument; anything else falls back to the original sfxWin()
  // fanfare, so no learned-moment plays silent.
  var INSTRUMENT_STINGS = {
    violin: { notes: [392.00, 493.88, 587.33, 783.99], wave: 'triangle', step: 0.11, dur: 0.32 },   // G4 B4 D5 G5 — bright ascending arpeggio
    piano: { notes: [783.99, 659.25, 523.25, 349.23], wave: 'square', step: 0.09, dur: 0.22 },       // G5 E5 C5 F4 — crisp descending run
    guitar: { notes: [164.81, 196.00, 220.00, 246.94, 329.63], wave: 'square', step: 0.09, dur: 0.24 }, // E3 G3 A3 B3 E4 — bluesy walk-up
    flute: { notes: [523.25, 659.25, 783.99, 659.25, 523.25], wave: 'sine', step: 0.14, dur: 0.4 }   // C5 E5 G5 E5 C5 — airy rise & fall
  };
  function sfxInstrumentLearned(key) {
    var sting = INSTRUMENT_STINGS[key];
    if (!sting) { sfxWin(); return; }
    sting.notes.forEach(function (f, i) { tone(f, i * sting.step, sting.dur, sting.wave, 0.16, sfxBus); });
  }

  // ---- 8-bit soundtrack ----
  // One looping theme per level, matching that place's vibe — Home warm,
  // Hospital cold and sparse, the Clearing a bright village jig, and each
  // single-teacher level (Hollow/Riverside/Meadow/Schoolhouse/Studio/
  // Conservatory) carrying that teacher's own instrument/subject motif.
  // Maestro Alden is the one teacher without his own level (he shares the
  // Clearing with Jono/Elsie/Milo) — his motif lives in INSTRUMENT_STINGS
  // above instead of here, played once when the violin is actually learned.
  //
  // A theme is { tempo, wave, pattern }: pattern is a sequence of
  // [melodyNote, bassNoteOrNull, steps] triples, played in a single
  // lockstep loop (both notes of a step start together) — 'R' means rest.
  // tempo is milliseconds per step. Note names are parsed by noteFreq().
  var MUSIC_THEMES = {
    home: {
      tempo: 320, wave: 'triangle',
      pattern: [
        ['F4', 'F3', 2], ['A4', null, 1], ['C5', 'C3', 1],
        ['A4', null, 2], ['F4', 'F3', 1], ['G4', null, 1],
        ['A4', 'Bb2', 2], ['G4', null, 1], ['F4', 'C3', 1]
      ]
    },
    hospital: {
      // No bass at all, long held tones, lots of rest — cold and empty on
      // purpose. wave 'sine' is the plainest, least "alive" timbre we have.
      tempo: 420, wave: 'sine',
      pattern: [
        ['A3', null, 3], ['R', null, 2], ['C4', null, 2], ['R', null, 1],
        ['B3', null, 3], ['R', null, 2], ['A3', null, 3], ['R', null, 3]
      ]
    },
    clearing: {
      tempo: 210, wave: 'square',
      pattern: [
        ['G4', 'G3', 1], ['B4', null, 1], ['D5', 'D3', 1], ['B4', null, 1],
        ['G4', 'G3', 1], ['A4', null, 1], ['B4', 'D3', 1], ['D5', null, 1],
        ['E5', 'G3', 1], ['D5', null, 1], ['B4', 'D3', 1], ['G4', null, 1]
      ]
    },
    field: {
      // Slower and steadier than the Clearing — plodding root-note bass,
      // like working a steady rhythm into the ground.
      tempo: 260, wave: 'triangle',
      pattern: [
        ['D4', 'G2', 2], ['B3', null, 2], ['D4', 'G2', 2], ['G4', null, 2],
        ['E4', 'C3', 2], ['D4', null, 2], ['B3', 'G2', 2], ['D4', null, 2]
      ]
    },
    hollow: {
      // Ms. Whitfield teaches piano here — an arpeggiated, no-bass line
      // (a solo piano, not a band) in a minor key for the cave-like hush.
      tempo: 230, wave: 'triangle',
      pattern: [
        ['D4', null, 1], ['F4', null, 1], ['A4', null, 1], ['D5', null, 1],
        ['C5', null, 1], ['A4', null, 1], ['F4', null, 1], ['A4', null, 1],
        ['Bb3', null, 1], ['D4', null, 1], ['F4', null, 1], ['A4', null, 1],
        ['G4', null, 1], ['F4', null, 1], ['D4', null, 2]
      ]
    },
    riverside: {
      // Jax teaches guitar — a syncopated blues-scale riff with a
      // square-wave "twang".
      tempo: 190, wave: 'square',
      pattern: [
        ['E4', 'E3', 1], ['G4', null, 1], ['E4', null, 1], ['R', null, 1],
        ['A4', 'A2', 1], ['G4', null, 1], ['E4', null, 2],
        ['D4', 'D3', 1], ['E4', null, 1], ['G4', null, 1], ['R', null, 1],
        ['E4', 'E3', 2]
      ]
    },
    meadow: {
      // Sora teaches flute — slow, breathy, wide-interval, no bass at all
      // so it stays airy and open like the field itself.
      tempo: 300, wave: 'sine',
      pattern: [
        ['E4', null, 3], ['G4', null, 2], ['A4', null, 3],
        ['G4', null, 2], ['E4', null, 3], ['D4', null, 3],
        ['C4', null, 4]
      ]
    },
    schoolhouse: {
      // Mr. Wainwright teaches fractals — the melody is a single 3-note
      // cell (step, step, step) repeated at successively higher
      // transpositions before resolving, echoing self-similarity instead
      // of just being "a cheerful classroom tune."
      tempo: 200, wave: 'square',
      pattern: [
        ['C4', null, 1], ['D4', null, 1], ['E4', null, 1],
        ['F4', null, 1], ['G4', null, 1], ['A4', null, 1],
        ['G4', null, 1], ['A4', null, 1], ['B4', null, 1],
        ['C5', null, 1], ['B4', null, 1], ['C5', null, 2]
      ]
    },
    studio: {
      // Professor Coffee teaches modular synthesis — a fast sawtooth
      // 16th-note arpeggio, the most "electronic sequencer" timbre and
      // rhythm we have on hand.
      tempo: 130, wave: 'sawtooth',
      pattern: [
        ['A4', null, 1], ['C5', null, 1], ['E5', null, 1], ['A5', null, 1],
        ['E5', null, 1], ['C5', null, 1], ['A4', null, 1], ['R', null, 1],
        ['G4', null, 1], ['B4', null, 1], ['D5', null, 1], ['G5', null, 1],
        ['D5', null, 1], ['B4', null, 1], ['G4', null, 1], ['R', null, 1]
      ]
    },
    conservatory: {
      // Sir Earth teaches the Circle of Fifths — so the bass line IS one:
      // A-D-G-C, each root a fifth below the last (the vi-ii-V-I everyone
      // already knows the sound of), with the melody arpeggiating each
      // chord in turn.
      tempo: 260, wave: 'triangle',
      pattern: [
        ['A4', 'A3', 1], ['C5', null, 1], ['E5', null, 1], ['C5', null, 1],
        ['D4', 'D3', 1], ['F4', null, 1], ['A4', null, 1], ['F4', null, 1],
        ['G4', 'G3', 1], ['B4', null, 1], ['D5', null, 1], ['B4', null, 1],
        ['C4', 'C3', 1], ['E4', null, 1], ['G4', null, 1], ['E4', null, 1]
      ]
    }
  };

  var NOTE_SEMITONES = { C: -9, 'C#': -8, D: -7, 'D#': -6, E: -5, F: -4, 'F#': -3, G: -2, 'G#': -1, A: 0, 'A#': 1, Bb: 1, B: 2 };
  function noteFreq(name) {
    var m = /^([A-G][#b]?)(\d)$/.exec(name);
    if (!m) return 0;
    var semitonesFromA4 = NOTE_SEMITONES[m[1]] + (parseInt(m[2], 10) - 4) * 12;
    return 440 * Math.pow(2, semitonesFromA4 / 12);
  }

  var musicState = { levelId: null, stepIndex: 0, timer: null };
  function scheduleNextMusicStep() {
    var theme = MUSIC_THEMES[musicState.levelId];
    if (!theme || !audioCtx) { musicState.timer = null; return; }
    var step = theme.pattern[musicState.stepIndex % theme.pattern.length];
    var stepSeconds = (step[2] * theme.tempo) / 1000;
    if (step[0] !== 'R') tone(noteFreq(step[0]), 0, stepSeconds * 0.9, theme.wave, 0.11, musicBus);
    if (step[1]) tone(noteFreq(step[1]) / 2, 0, stepSeconds * 0.9, theme.wave, 0.09, musicBus);
    musicState.stepIndex++;
    musicState.timer = setTimeout(scheduleNextMusicStep, stepSeconds * 1000);
  }
  // Called on every loadLevel() and from ensureAudio() once audio first
  // unlocks — safe to call with no audioCtx yet (it just resets the
  // pointer; ensureAudio() picks the loop back up once it exists).
  function startMusicForLevel(levelId) {
    clearTimeout(musicState.timer);
    musicState.timer = null;
    musicState.levelId = levelId;
    musicState.stepIndex = 0;
    if (audioCtx && MUSIC_THEMES[levelId]) scheduleNextMusicStep();
  }

  function renderStats() {
    moneyCountText.textContent = story.money;
    reputationCountText.textContent = story.communityRespect[world.id] || 0;

  var dialogueEl = document.getElementById('dialogue');
  var dialogueSpeakerEl = document.getElementById('dialogue-speaker');
  var dialogueTextEl = document.getElementById('dialogue-text');
  var dialogueLinkEl = document.getElementById('dialogue-link');
  var dialogueOpen = false;
  // link: optional { href, label } — used to point a conversation at one of
  // the sibling shankFiddle tools (see the music challenges' tie-in to the
  // Circle of Fifths in talkToNpc). link.frame: { tool, id } instead opens
  // that tool right here in-game (see openToolFrame()) rather than a new
  // tab — used by a `goal` mission step, since the point of opening it is
  // to watch for the tool's own postMessage confirming the task was done.
  function openDialogue(text, speaker, link) {
    dialogueSpeakerEl.textContent = speaker || '';
    dialogueSpeakerEl.style.display = speaker ? 'block' : 'none';
    dialogueTextEl.textContent = text;

        a.target = '_blank';
        a.rel = 'noopener';

      dialogueLinkEl.style.display = 'block';
    } else {
      dialogueLinkEl.style.display = 'none';

  var toolFrameOverlayEl = document.getElementById('tool-frame-overlay');
  var toolFrameEl = document.getElementById('tool-frame');
  var toolFrameTitleEl = document.getElementById('tool-frame-title');
  var toolFrameOpen = false;
  function openToolFrame(href, title) {

  var toastEl = document.getElementById('toast');

    toastEl.textContent = text;
