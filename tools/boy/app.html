<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Boy — a tiny diorama adventure</title>
<meta name="description" content="Boy — a miniature 3D top-down adventure in the browser, in the tilt-shift diorama style of Zelda: Link's Awakening.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #05070a; }
  body { font-family: 'Inter', sans-serif; -webkit-user-select: none; user-select: none; }

  #game-root {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #05070a;
  }

  canvas { display: block; width: 100%; height: 100%; }

  /* ---- tilt-shift diorama bands (fake depth-of-field, cheap & convincing) ---- */
  .tilt-band {
    position: absolute;
    left: 0; right: 0;
    pointer-events: none;
    z-index: 5;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
  }
  .tilt-band.top {
    top: 0; height: 16%;
    background: linear-gradient(to bottom, rgba(5,7,10,0.35), rgba(5,7,10,0));
    mask-image: linear-gradient(to bottom, black 40%, transparent 100%);
    -webkit-mask-image: linear-gradient(to bottom, black 40%, transparent 100%);
  }
  .tilt-band.bottom {
    bottom: 0; height: 20%;
    background: linear-gradient(to top, rgba(5,7,10,0.4), rgba(5,7,10,0));
    mask-image: linear-gradient(to top, black 40%, transparent 100%);
    -webkit-mask-image: linear-gradient(to top, black 40%, transparent 100%);
  }
  .vignette {
    position: absolute; inset: 0; pointer-events: none; z-index: 5;
    box-shadow: inset 0 0 18vw rgba(0,0,0,0.55);
  }

  /* ---- HUD ---- */
  .hud { position: absolute; z-index: 10; font-family: 'Inter', sans-serif; }

  #shard-counter {
    top: 16px; right: 16px;
    display: flex; align-items: center; gap: 8px;
    background: rgba(5,7,10,0.55);
    border: 1px solid rgba(240,168,60,0.4);
    border-radius: 999px;
    padding: 7px 16px 7px 12px;
    color: #ffd27a;
    font-weight: 600;
    font-size: 0.9rem;
    letter-spacing: 0.3px;
    backdrop-filter: blur(6px);
  }
  #shard-counter .icon { font-size: 1rem; filter: drop-shadow(0 0 6px rgba(120,220,255,0.8)); }

  #stats-hud {
    top: 16px; left: 16px;
    display: flex; align-items: center; gap: 14px;
    background: rgba(5,7,10,0.55);
    border: 1px solid rgba(240,168,60,0.4);
    border-radius: 999px;
    padding: 7px 16px;
    color: #ffd27a;
    font-weight: 600;
    font-size: 0.9rem;
    letter-spacing: 0.3px;
    backdrop-filter: blur(6px);
  }
  #stats-hud .icon { font-size: 1rem; margin-right: 6px; }

  #dialogue {
    left: 50%; bottom: 8%;
    transform: translateX(-50%) translateY(12px);
    width: min(88vw, 560px);
    background: rgba(8,6,10,0.88);
    border: 1px solid rgba(240,168,60,0.55);
    border-radius: 14px;
    padding: 18px 22px 14px;
    color: #f7ece9;
    font-size: 1rem;
    line-height: 1.5;
    box-shadow: 0 14px 40px rgba(0,0,0,0.5);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  #dialogue.open { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
  #dialogue-speaker {
    display: none;
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: 0.85rem;
    color: #ffd27a;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
  }
  #dialogue-link { display: none; margin-top: 10px; }
  #dialogue-link a {
    color: #7ee8ff;
    font-size: 0.85rem;
    font-weight: 600;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  #dialogue-link a:hover { color: #ffd27a; }
  #dialogue .prompt {
    margin-top: 10px;
    font-size: 0.75rem;
    color: #c7abb8;
    text-align: right;
    animation: blink 1.1s infinite;
  }
  @keyframes blink { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }

  #car-menu {
    display: none;
    left: 50%; bottom: 8%;
    transform: translateX(-50%);
    width: min(88vw, 420px);
    background: rgba(8,6,10,0.92);
    border: 1px solid rgba(240,168,60,0.55);
    border-radius: 14px;
    padding: 18px 22px 14px;
    color: #f7ece9;
    box-shadow: 0 14px 40px rgba(0,0,0,0.5);
  }
  #car-menu.open { display: block; }
  .car-menu-title {
    font-family: 'Cinzel', serif;
    font-weight: 700;
    color: #ffd27a;
    font-size: 1rem;
    margin-bottom: 12px;
  }
  #car-menu-list { display: flex; flex-direction: column; gap: 8px; }
  #car-menu-list button {
    text-align: left;
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid rgba(240,168,60,0.3);
    background: rgba(240,168,60,0.06);
    color: #f7ece9;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
  }
  #car-menu-list button:hover { border-color: #ffd27a; background: rgba(240,168,60,0.14); }

  /* Generic reusable yes/no (or multi-option) choice prompt — first built
     for the Devil's restart-the-game exchange in Hell, but deliberately
     generic (see openChoice()) so any dialogue can ask a real question
     instead of just displaying text. Styled to match #car-menu rather than
     invent a third visual language for "a box with buttons." */
  #choice-overlay {
    display: none;
    left: 50%; bottom: 8%;
    transform: translateX(-50%);
    width: min(88vw, 460px);
    background: rgba(8,6,10,0.94);
    border: 1px solid rgba(240,168,60,0.55);
    border-radius: 14px;
    padding: 18px 22px 14px;
    color: #f7ece9;
    box-shadow: 0 14px 40px rgba(0,0,0,0.5);
  }
  #choice-overlay.open { display: block; }
  #choice-speaker { font-family: 'Cinzel', serif; font-weight: 700; color: #ffd27a; font-size: 0.95rem; margin-bottom: 6px; }
  #choice-prompt { font-family: 'Inter', sans-serif; font-size: 0.95rem; line-height: 1.4; margin-bottom: 14px; }
  #choice-options { display: flex; flex-direction: column; gap: 8px; }
  #choice-options button {
    text-align: left;
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid rgba(240,168,60,0.3);
    background: rgba(240,168,60,0.06);
    color: #f7ece9;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
  }
  #choice-options button:hover { border-color: #ffd27a; background: rgba(240,168,60,0.14); }

  /* A `goal` mission step opens its tool right here, in-game, rather than
     a new tab — the whole point is watching for the tool's own
     postMessage confirming the task was actually done. */
  #tool-frame-overlay {
    position: fixed; inset: 0; z-index: 40;
    display: none; flex-direction: column;
    background: #05070a;
  }
  #tool-frame-overlay.open { display: flex; }
  #tool-frame-bar {
    display: flex; align-items: center; justify-content: space-between;
    flex: 0 0 auto;
    padding: 10px 16px;
    background: rgba(5,7,10,0.95);
    border-bottom: 1px solid rgba(240,168,60,0.4);
  }
  #tool-frame-title {
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: 0.9rem;
    color: #ffd27a;
    letter-spacing: 0.3px;
  }
  #tool-frame-close {
    width: 32px; height: 32px;
    border-radius: 50%;
    border: 1px solid rgba(240,168,60,0.4);
    background: rgba(240,168,60,0.06);
    color: #f7ece9;
    font-size: 1.2rem;
    line-height: 1;
    cursor: pointer;
  }
  #tool-frame-close:hover { border-color: #ffd27a; background: rgba(240,168,60,0.14); }
  #tool-frame { flex: 1 1 auto; width: 100%; border: none; background: #fff; }

  #mute-btn {
    top: 64px; right: 16px;
    width: 40px; height: 40px;
    border-radius: 50%;
    background: rgba(5,7,10,0.55);
    border: 1px solid rgba(240,168,60,0.4);
    color: #f7ece9;
    font-size: 1.1rem;
    backdrop-filter: blur(6px);
    cursor: pointer;
  }
  #mute-btn:hover { border-color: #ffd27a; }
  #mute-btn.muted { color: #8a8f96; }
  #save-btn {
    top: 112px; right: 16px;
    width: 40px; height: 40px;
    border-radius: 50%;
    background: rgba(5,7,10,0.55);
    border: 1px solid rgba(240,168,60,0.4);
    color: #f7ece9;
    font-size: 1.1rem;
    backdrop-filter: blur(6px);
    cursor: pointer;
  }
  #save-btn:hover { border-color: #ffd27a; }

  #toast {
    left: 50%; top: 14%;
    transform: translateX(-50%) translateY(-10px);
    background: rgba(8,6,10,0.85);
    border: 1px solid rgba(255,46,166,0.55);
    border-radius: 12px;
    padding: 12px 22px;
    color: #ffd27a;
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: 1rem;
    letter-spacing: 0.4px;
    text-align: center;
    opacity: 0;
    transition: opacity 0.35s ease, transform 0.35s ease;
    pointer-events: none;
    white-space: nowrap;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ---- start overlay ---- */
  #start-overlay {
    position: absolute; inset: 0; z-index: 30;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 24px;
    background:
      radial-gradient(circle at 30% 20%, rgba(255,46,166,0.18), transparent 55%),
      radial-gradient(circle at 75% 80%, rgba(240,168,60,0.14), transparent 55%),
      #05070a;
    transition: opacity 0.5s ease;
  }
  #start-overlay.hidden { opacity: 0; pointer-events: none; }
  #start-overlay h1 {
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: clamp(3rem, 12vw, 5.5rem);
    letter-spacing: 4px;
    background: linear-gradient(135deg, #ffd27a, #f0a83c);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 40px rgba(240,168,60,0.25);
  }
  #start-overlay p.tag {
    margin-top: 10px;
    color: #c7abb8;
    font-style: italic;
    font-size: clamp(0.9rem, 2vw, 1.05rem);
  }
  #start-overlay .controls {
    margin-top: 30px;
    display: flex; gap: 26px; flex-wrap: wrap; justify-content: center;
    color: #c7abb8; font-size: 0.82rem;
  }
  #start-overlay .controls b { color: #ffd27a; display: block; font-size: 0.75rem; letter-spacing: 1px; margin-bottom: 3px; text-transform: uppercase; }
  #begin-btn {
    margin-top: 36px;
    padding: 15px 40px;
    border-radius: 999px;
    border: 2px solid transparent;
    background: linear-gradient(135deg, #ff2ea6, #e11d5c);
    color: #17040d;
    font-weight: 700;
    font-family: 'Inter', sans-serif;
    font-size: 1rem;
    letter-spacing: 0.5px;
    cursor: pointer;
    box-shadow: 0 8px 26px rgba(255,46,166,0.35);
    transition: transform 0.2s ease;
  }
  #begin-btn:hover { transform: translateY(-2px); }

  /* ---- touch controls ---- */
  .touch-controls { display: none; }
  @media (hover: none) and (pointer: coarse) {
    .touch-controls { display: block; }
  }
  #dpad {
    position: absolute; z-index: 20; left: 18px; bottom: 22px;
    width: 148px; height: 148px;
  }
  #dpad button {
    position: absolute;
    width: 50px; height: 50px;
    background: rgba(20,12,16,0.55);
    border: 1px solid rgba(240,168,60,0.4);
    border-radius: 12px;
    color: #ffd27a;
    font-size: 1.2rem;
    backdrop-filter: blur(4px);
  }
  #dpad button:active { background: rgba(255,46,166,0.35); }
  #dpad .up { top: 0; left: 49px; }
  #dpad .down { bottom: 0; left: 49px; }
  #dpad .left { left: 0; top: 49px; }
  #dpad .right { right: 0; top: 49px; }

  #action-btn {
    position: absolute; z-index: 20; right: 26px; bottom: 34px;
    width: 74px; height: 74px;
    border-radius: 50%;
    background: rgba(255,46,166,0.28);
    border: 1px solid rgba(255,46,166,0.6);
    color: #f7ece9;
    font-weight: 700;
    font-size: 0.75rem;
    letter-spacing: 0.5px;
    backdrop-filter: blur(4px);
  }
  #action-btn:active { background: rgba(255,46,166,0.5); }

  #shankfiddle-credit {
    position: absolute; z-index: 10; left: 16px; bottom: 12px;
    font-size: 0.7rem; color: rgba(199,171,184,0.55);
    letter-spacing: 0.3px;
  }
  @media (hover: none) and (pointer: coarse) { #shankfiddle-credit { display: none; } }
</style>
</head>
<body>

<div id="game-root">
  <div class="tilt-band top"></div>
  <div class="tilt-band bottom"></div>
  <div class="vignette"></div>

  <div id="stats-hud" class="hud">
    <span><span class="icon">&#128176;</span><span id="money-count-text">0</span></span>
    <span><span class="icon">&#11088;</span><span id="reputation-count-text">0</span></span>
  </div>
  <div id="shard-counter" class="hud"><span class="icon">&#10022;</span><span id="shard-count-text">0 / 0</span></div>
  <button id="mute-btn" class="hud" title="Mute music &amp; sound effects">&#128266;</button>
  <button id="save-btn" class="hud" title="Copy a save link (dev/testing stand-in for real progress-saving)">&#128279;</button>
  <div id="dialogue" class="hud">
    <div id="dialogue-speaker"></div>
    <div id="dialogue-text"></div>
    <div id="dialogue-link"></div>
    <div class="prompt">&#9660; space to close</div>
  </div>
  <div id="toast" class="hud"></div>
  <div id="car-menu" class="hud">
    <div class="car-menu-title" id="car-menu-title">Drive to&hellip;</div>
    <div id="car-menu-list"></div>
    <div class="prompt">&#9660; space to close</div>
  </div>
  <div id="choice-overlay" class="hud">
    <div id="choice-speaker"></div>
    <div id="choice-prompt"></div>
    <div id="choice-options"></div>
  </div>
  <div id="tool-frame-overlay">
    <div id="tool-frame-bar">
      <span id="tool-frame-title"></span>
      <button id="tool-frame-close" title="Close">&times;</button>
    </div>
    <iframe id="tool-frame" allow="autoplay"></iframe>
  </div>
  <div id="shankfiddle-credit">Boy — a shankFiddle production</div>

  <div class="touch-controls" id="dpad">
    <button class="up" data-dir="up">&#9650;</button>
    <button class="down" data-dir="down">&#9660;</button>
    <button class="left" data-dir="left">&#9664;</button>
    <button class="right" data-dir="right">&#9654;</button>
  </div>
  <button class="touch-controls" id="action-btn">ACT</button>

  <div id="start-overlay">
    <h1>BOY</h1>
    <p class="tag">a tiny diorama adventure</p>
    <div class="controls">
      <div><b>Move</b>WASD / Arrow Keys</div>
      <div><b>Talk &amp; Interact</b>Space</div>
      <div><b>Goal</b>Talk to everyone you meet</div>
    </div>
    <button id="begin-btn">Begin Adventure</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
<script>
(function () {
  'use strict';

  // ========================================================================
  // LEVELS — this is the whole authoring surface. Add a new level by adding
  // a new entry here; nothing below this block needs to change.
  //
  // map:    array of equal-length strings (the grid). Legend:
  //           #  tree / solid border      .  grass          , flowers
  //           =  path                     o  rock            ~ water
  //           b  bush                     H  house footprint (any block of
  //              H tiles becomes one house prop sized to fit them)
  //           S  sign (reads signs[] in the order signs are encountered
  //              scanning the grid top-to-bottom, left-to-right) — plain
  //              environmental flavor text, not a character
  //           $  collectible Light Shard
  //           c  carrot — a job tier's harvest good (item 'vegetable'),
  //              see `job.tiers`. t (potato) and n (corn) are the same
  //              economy, just different growing things to look at —
  //              see parseLevel()'s switch and createCrop()'s `kind`.
  //           r  basket — a different tier's harvest good (Elsie's, not
  //              part of the vegetable economy above)
  //           p  seed row — Jono's one-time "plant the seeds" upgrade
  //              good, see `job.tiers`' oneTime/plantsSeeds tier
  //           e  crate — an advanced (higher-tier) harvest good
  //           V  practice spot — an interactable prop (not an NPC), see
  //              findNearbyPracticeSpot()/practiceViolin(). Interacting
  //              sets story.learned.practiced, a real one-time action a
  //              family dialogue beat's `requires` can gate on (see the
  //              "requires" shape in the dialogue doc below) instead of
  //              just being talked into existence.
  //           @  player start (used when this level loads with no explicit
  //              spawn override, i.e. as the first level, or via loadLevel
  //              with no spawn argument)
  //           1-9 exit portal — walking onto a digit tile used as a key in
  //              this level's `exits` teleports the player into another
  //              level at the tile given there. Reuse the same digit for
  //              more than one portal within a level, or different digits
  //              for several distinct exits.
  //           any other letter used as a key in this level's `npcs` — a
  //              named character. See `npcs` below.
  //           C  the car — one per game, wherever it's placed. Once earned
  //              (see CAR_FAMILY_RESPECT_THRESHOLD), interacting with it from
  //              anywhere opens a menu to drive straight to any other
  //              level, no matter how far or disconnected — this is how a
  //              new level avoids needing a portal wired into an existing
  //              map at all: it only needs to exist in LEVELS.
  //
  // signs:  array of dialogue strings, matched to 'S' tiles in scan order.
  // exits:  { '<digit>': { to: '<level id>', x: <tx>, y: <ty> } } — arrival
  //         tile in the destination level, in that level's own coordinates.
  // npcs:   { '<letter>': {
  //             id: 'dad',    // stable key into story.respect — every NPC
  //                           // worth tracking a relationship with should
  //                           // have one (falls back to name.toLowerCase()
  //                           // if omitted, but don't rely on that for
  //                           // names that collide once lowercased).
  //             name: 'Mom',
  //             appearance: { top, bottom, skin, hair, hairStyle, skirt,
  //               pieceType, pieceAccent, tieDye },
  //             // pieceType: 'pawn'|'king'|'queen'|'rook'|'bishop' — which
  //             // chess piece this NPC's body renders as when
  //             // CHARACTER_STYLE === 'chess' (defaults to 'pawn'; ignored
  //             // entirely in 'human' style). pieceAccent optionally colors
  //             // the king/queen/bishop head accessory (defaults gold;
  //             // Sir Earth's cross is white — see below).
  //             // tieDye: true swaps the flat `top` color for a painted
  //             // tie-dye pattern (see getTieDyeTexture()) — `top` is
  //             // still required as a fallback for CHARACTER_STYLE ===
  //             // 'human', which doesn't use it.
  //             // skin defaults to SKIN_LIGHT (everyone else in the world);
  //             // Boy's family uses SKIN_BROWN (0xa9714a) — pass it as the
  //             // literal since this data runs before those are defined.
  //             // bedridden: true swaps the whole standing figure for a
  //             // self-contained bed+patient prop (createBedriddenHuman()) —
  //             // only skin/hair still apply; pieceType/top/bottom/tieDye
  //             // are ignored lying down. Dad uses this from his diagnosis
  //             // onward (Hospital) and through hospice (Home) — see
  //             // appearanceDuring below for how Home's Dad stays standing
  //             // in earlier chapters on that same tile.
  //             appearanceDuring: { hospice: { bedridden: true, skin: ... } },
  //             // optional — a per-chapter override map, checked before the
  //             // base `appearance` above (see the npc-creation line in
  //             // buildWorldGroup()). Lets one NPC def look different across
  //             // the chapters it's presentDuring/presentFrom, without a
  //             // second map tile — e.g. Dad standing, then bedridden, on
  //             // the exact same spot in the room.
  //             dialogue: { childhood: '...', diagnosis: '...', ... },
  //             presentFrom: 'diagnosis',  // absent BEFORE this chapter —
  //             absentFrom: 'grief',       // and gone FROM this chapter on.
  //             // Both are optional and independent, so the same map tile
  //             // (e.g. one letter in the Hospital's npcs) can be handed
  //             // off between different characters as the story moves —
  //             // a lab supervisor absentFrom 'diagnosis' vacates the spot
  //             // a nurse presentFrom 'diagnosis' then fills.
  //             presentDuring: ['childhood', 'hospice'],  // for a character
  //             // who is present, then gone, then present again — a single
  //             // contiguous presentFrom/absentFrom range can't express
  //             // that, so presentDuring is an explicit chapter whitelist
  //             // instead; give an NPC one or the other, not both. Dad
  //             // uses this: home for childhood/earning_respect, away at
  //             // the Hospital for diagnosis, home again for hospice.
  //             isFamily: true,  // every conversation (whatever line plays)
  //                               // also raises story.respect[id] — see the
  //                               // three-tier respect model below.
  //             challenge: {            // optional — makes talking to this
  //               key: 'violin',        // NPC a repeatable respect grind
  //               threshold: 3,         // (progress is tracked under this
  //               progressLines: ['...', '...', '...'],  // NPC's own id,
  //               completeLine: '...',                    // same as any
  //               learnedMessage: 'You learned the Violin! 🎻',  // other individual respect)
  //               link: { href: '...', label: '...' }  // optional — shown
  //             },                      // as a clickable link under
  //                                     // completeLine once learned, e.g.
  //                                     // pointing a music challenge at the
  //                                     // Circle of Fifths. Omit for a
  //                                     // challenge with no matching tool.
  //             missions: [ /* same shape as one `challenge`, in order */ ],
  //             // optional — an ORDERED chain of challenge-shaped steps for
  //             // an NPC who teaches something with real stages (each step
  //             // its own key/threshold/progressLines/completeLine/link).
  //             // story.missionStep[id] tracks which step is current; each
  //             // step's completeLine plays once, then the NEXT step's
  //             // progressLines start on the following conversation — no
  //             // separate unlock condition. Once every step is done,

  // Story progression — separate from any single level, since the same
  // place (like Home) needs to exist across multiple chapters with
  // different characters and dialogue. Advancing story.chapter and
  // reloading the current level is what moves the story forward; nothing
  // currently advances it past 'childhood' — that's the next piece to build.
  // 'duty' is the story's final state: respect fully earned.
  var CHAPTERS = ['childhood', 'earning_respect', 'diagnosis', 'hospice', 'grief', 'duty'];

  // Growth scaling — Boy (and Eric) stay pawns their whole life, but grow
  // physically bigger as the story advances, reaching king-size by 'duty'.
  // 1.278 is derived from the actual king/pawn body-height ratio (king's
  // base+body = 0.1+1.05 = 1.15, pawn's = 0.08+0.82 = 0.90 — see
  // createKingBody()/createPawnBody()), not an arbitrary number, so "grows
  // to king-size" is literally true rather than just a vague upscale.
  // Applied to the outer object (player.obj / npc.obj), never to
  // userData.pivot — the idle-breathing animation in update() overwrites
  // pivot.scale every frame, so growth has to live one level higher up to
  // survive it.
  var PAWN_TO_KING_SCALE = 1.278;
  function growthScaleForChapter(chapter) {
    var idx = CHAPTERS.indexOf(chapter);
    if (idx < 0) idx = 0;
    var t = idx / (CHAPTERS.length - 1);
    return 1 + (PAWN_TO_KING_SCALE - 1) * t;
  }
  // See "the three-tier respect model" above LEVELS for what respect vs.
  // communityRespect vs. familyRespect() each mean and why they're separate.
  // respect: individual standing per NPC id, e.g. respect.dad, respect.violin.
  // learned: which challenges have been completed, e.g. learned.violin = true.
  // communityRespect: per-community standing, e.g. communityRespect.clearing.
  // money: global, fungible — not scoped to any individual or community.
  // hasCar: earned at the village's car once familyRespect() clears
  // CAR_FAMILY_RESPECT_THRESHOLD — see findNearbyCar()/handleAction().
  // missionStep: per-NPC progress through a `missions` chain, e.g.
  // missionStep.wainwright = 2 means steps 0 and 1 are done, step 2 is current.
  // chapterTalks: per-id-per-chapter visit count, e.g. chapterTalks['dad:diagnosis']
  // — indexes an array `dialogue` value's caregiving beats; separate from
  // the cumulative story.respect total (see talkToNpc's isFamily branch).
  // produce: harvested-but-not-yet-delivered goods by item, e.g.
  // produce.vegetable — see checkCropPickup() and a job's `harvest` field.
  // goalDone: a mission step's `key`, once its `goal` has actually been
  // verified inside the sibling tool itself — see the postMessage

  // fieldSeedsPlanted: set once, permanently, by Jono's oneTime

  // colorRestored: which GREYSCALE_ROSTER members you've reconnected with
  // since Dad died — see worldColorFactor()/markReconnected() below.

  var CAR_FAMILY_RESPECT_THRESHOLD = 3;

  // whole world desaturates. Mom and the Devil are the two permanent
  // exceptions (colorful from the start of grief, see applyWorldColor());
  // everyone and everything else — ground, props, every other NPC, Boy
  // himself — follows ONE shared dial:
  // worldColorFactor(). It climbs as you genuinely reconnect with each
  // person in GREYSCALE_ROSTER (see markReconnected(), called from three
  // places in talkToNpc() — a job's real payout, a kindness act, and a
  // mission/challenge step's completion — plus the "already fully
  // mastered before Dad died, so just showing up again is the real thing
  // now" fallback in the `if (!ch)` branch). Boy is the deliberate last
  // exception: no matter how many others are restored, he only rejoins
  // in color once 'duty' begins (see applyWorldColor()) — Mom's own arc
  // finishing is what closes his.
  //
  // Julia (id: 'alden') is left out of this roster on purpose: his violin `goal` points
  // at a tool that doesn't exist yet (see the debt note above LEVELS), so
  // "their next real interaction" can never actually happen for him —
  // including him would make full restoration permanently impossible.
  // Dr. Voss and Nurse Odalys are out too: Voss is absentFrom diagnosis
  // (gone for good long before grief), and Nurse is flavor-only with no
  // real mechanic to reconnect through.
  var GREYSCALE_ROSTER = ['farmer_jono', 'elsie', 'hungry_kid', 'whitfield', 'eric', 'sora', 'wainwright', 'coffee', 'sir_earth'];
  function worldColorFactor() {
    if (CHAPTERS.indexOf(story.chapter) < CHAPTERS.indexOf('grief')) return 1;
    var n = GREYSCALE_ROSTER.filter(function (id) { return story.colorRestored[id]; }).length;
    return n / GREYSCALE_ROSTER.length;
  }
  // Idempotent and safe to call for anyone, not just roster members — see
  // the three call sites in talkToNpc(). Silently a no-op before grief, or
  // for a second reconnection with someone already restored.
  function markReconnected(npcId) {
    if (CHAPTERS.indexOf(story.chapter) < CHAPTERS.indexOf('grief')) return;
    if (GREYSCALE_ROSTER.indexOf(npcId) === -1 || story.colorRestored[npcId]) return;
    story.colorRestored[npcId] = true;
    showToast('🎨 A little color comes back to the world.', 2400);
    applyWorldColor();
  }
  // Community reputation gained once an NPC's whole `missions` chain is
  // finished — same idea as a job's per-visit `reputation`, but paid out
  // once, in full, as the reward for mastering what that mentor teaches.
  var MISSION_MASTERY_REPUTATION = 3;
  // Each threshold below gates one scripted chapter turn — see the four
  // checks in talkToNpc(). They only climb: earning the car is "they trust
  // you to drive," diagnosis is "you kept showing up after that," hospice
  // is "you kept showing up through the hospital stay," and the farewell
  // is "you were there for the whole of it." The last one, rebuilding with
  // just Mom, is scoped to her alone rather than the family sum, since
  // Dad's own respect is frozen once he's gone.
  //
  // Calibrated against what's actually earnable through real, distinct
  // tasks (see talkToNpc's isFamily branch — no more free respect from
  // repeating a conversation), with some slack so a chapter's tasks don't
  // all need to be found to progress. As more family tasks get written
  // for a chapter, its max grows — these can climb to match; they're not
  // sacred numbers, just today's calibration.
  var DIAGNOSIS_FAMILY_RESPECT_THRESHOLD = 9;
  var HOSPICE_FAMILY_RESPECT_THRESHOLD = 16;
  var FAREWELL_FAMILY_RESPECT_THRESHOLD = 24;
  var REBUILD_MOM_RESPECT_THRESHOLD = 16;
  function familyRespect() { return (story.respect.dad || 0) + (story.respect.mom || 0); }

  // absentFrom marks a character gone starting at that chapter and for
  // every chapter after it (not just that one) — once someone is gone from
  // the story, later chapters shouldn't accidentally bring them back.
  // presentFrom is the mirror image: gone in every chapter BEFORE the given
  // one. Together they let one map tile change hands between characters as
  // the chapter changes — e.g. the Hospital's lab supervisor (absentFrom
  // 'diagnosis') giving way to Dad and the nurse (both presentFrom
  // 'diagnosis') without any change to the level's map or tile layout.
  function npcAbsent(npcDef) {
    // requiresLearned gates a character's very presence on a real,
    // checkable fact — story.learned[key] — rather than a chapter. Sir
    // Earth uses this: he doesn't appear at all until Boy has earned
    // Liz's respect (learned.songwriting), a real prerequisite rather
    // than two independent, order-free teachers.
    if (npcDef.requiresLearned && !story.learned[npcDef.requiresLearned]) return true;
    // presentDuring is an explicit whitelist for a character who isn't
    // present for one contiguous stretch of chapters — see the doc above
    // LEVELS. It fully replaces the presentFrom/absentFrom range check
    // below when given, rather than combining with it.
    if (npcDef.presentDuring) return npcDef.presentDuring.indexOf(story.chapter) === -1;
    var curIdx = CHAPTERS.indexOf(story.chapter);
    if (npcDef.presentFrom) {
      var presentIdx = CHAPTERS.indexOf(npcDef.presentFrom);
      if (presentIdx !== -1 && curIdx < presentIdx) return true;
    }
    if (npcDef.absentFrom) {
      var absentIdx = CHAPTERS.indexOf(npcDef.absentFrom);
      if (absentIdx !== -1 && curIdx >= absentIdx) return true;
    }
    return false;
  }
  // visitCount indexes an ARRAY dialogue value (a sequence of caregiving
  // beats for the current chapter, e.g. Mom's diagnosis lines) the same
  // way a challenge's progressLines cycle by `have` — a plain string
  // value ignores it entirely, so most NPCs never need to know it exists.
  function dialogueFor(npcDef, visitCount) {
    var idx = CHAPTERS.indexOf(story.chapter);
    for (var i = idx; i >= 0; i--) {
      var raw = npcDef.dialogue[CHAPTERS[i]];
      if (raw) {
        if (!Array.isArray(raw)) return raw;
        var entry = raw[Math.min(visitCount || 0, raw.length - 1)];
        // A beat gated behind a real task (see the "requires" shape in the
        // appearance/dialogue doc above LEVELS) is an object, not a plain
        // string — its `line` is what actually gets said once earned.
        // talkToNpc's isFamily branch checks `requires` itself before
        // ever reaching here, so by the time we unwrap it it's earned.
        return (entry && typeof entry === 'object') ? entry.line : entry;
      }
    }
    return npcDef.dialogue.default || '...';
  }

  // Chapters only ever move forward. Rebuilds the current level in place
  // (same tile, no travel) so absentFrom/dialogue/car-menu changes tied to
  // the new chapter take effect immediately rather than on the next level
  // change. Safe to call mid-conversation — callers that also want to show
  // a dialogue line for the new chapter should call this first, then open
  // the dialogue, since it's what makes dialogueFor() see the new chapter.
  function setChapter(newChapter) {
    var newIdx = CHAPTERS.indexOf(newChapter);
    var curIdx = CHAPTERS.indexOf(story.chapter);
    if (newIdx <= curIdx) return;
    story.chapter = newChapter;
    player.obj.scale.setScalar(growthScaleForChapter(story.chapter));
    loadLevel(LEVEL_INDEX[world.id], { x: player.tileX, y: player.tileY });
  }

  var TILE = 2;
  // Top surface of a standard (non-water) ground tile — see makeTile's
  // positioning in buildWorldGroup. Characters are placed at y=0 (their own
  // local origin), so anything meant to sit visibly ON the ground rather
  // than embedded in it — like the chess-piece pedestal tile below — needs
  // this offset.
  var GROUND_SURFACE_Y = 0.15;

  function key(tx, ty) { return tx + ',' + ty; }
  function rand(a, b) { return a + Math.random() * (b - a); }

  // Pure — takes an explicit world so it's safe to use while building a
  // level that isn't the active one yet (see buildWorldGroup).
  function worldPos(w, tx, ty) {
    return { x: (tx - w.ORIGIN_X) * TILE, z: (ty - w.ORIGIN_Z) * TILE };
  }
  // Convenience wrapper for runtime/gameplay code, which always operates on
  // whichever level is currently active.
  function tileToWorld(tx, ty) { return worldPos(world, tx, ty); }

  // Parses a level's map into engine-agnostic data: which tiles block
  // movement, where every prop/enemy/shard/sign/portal goes, and where the
  // player starts. Doesn't touch Three.js at all.
  function parseLevel(levelDef) {
    var map = levelDef.map;
    var w = map[0].length, h = map.length;
    var exits = levelDef.exits || {};
    var npcs = levelDef.npcs || {};
    var obstacles = new Set();
    var features = { trees: [], rocks: [], bushes: [], flowers: [], shards: [], crops: [], signs: [], houseTiles: [], portals: [], npcs: [], crowd: [], practiceSpots: [], car: null };
    var groundKinds = [];
    var playerStart = { x: 1, y: 1 };

    for (var y = 0; y < h; y++) {
      groundKinds.push(map[y].split(''));
      for (var x = 0; x < w; x++) {
        var c = map[y][x];
        if (exits[c]) {
          features.portals.push({ x: x, y: y, to: exits[c].to, spawn: { x: exits[c].x, y: exits[c].y } });
          continue;
        }
        if (npcs[c]) {
          if (!npcAbsent(npcs[c])) {
            obstacles.add(key(x, y));
            features.npcs.push({ x: x, y: y, def: npcs[c] });
          }
          continue;
        }
        switch (c) {
          case '#': obstacles.add(key(x, y)); features.trees.push({ x: x, y: y }); break;
          case 'o': obstacles.add(key(x, y)); features.rocks.push({ x: x, y: y }); break;
          case 'b': obstacles.add(key(x, y)); features.bushes.push({ x: x, y: y }); break;
          case '~': obstacles.add(key(x, y)); break;
          case 'H': obstacles.add(key(x, y)); features.houseTiles.push({ x: x, y: y }); break;
          case 'S': obstacles.add(key(x, y)); features.signs.push({ x: x, y: y, message: (levelDef.signs || [])[features.signs.length] || 'A weathered sign, worn smooth by rain.' }); break;
          case ',': features.flowers.push({ x: x, y: y }); break;
          case '$': features.shards.push({ x: x, y: y, collected: false }); break;
          case 'c': features.crops.push({ x: x, y: y, collected: false, item: 'vegetable', kind: 'carrot' }); break;
          case 't': features.crops.push({ x: x, y: y, collected: false, item: 'vegetable', kind: 'potato' }); break;
          case 'n': features.crops.push({ x: x, y: y, collected: false, item: 'vegetable', kind: 'corn' }); break;
          case 'r': features.crops.push({ x: x, y: y, collected: false, item: 'basket' }); break;
          case 'p': features.crops.push({ x: x, y: y, collected: false, item: 'seedrow' }); break;
          case 'e': features.crops.push({ x: x, y: y, collected: false, item: 'crate' }); break;
          case '%':
            // Decorative background crowd — see randomCrowdAppearance() and
            // its render loop in buildWorldGroup(). Never a `npcs[c]` entry:
            // no dialogue, no story.respect id, purely a randomized figure
            // among Pawn/Bishop/Rook (King/Queen stay reserved for named
            // characters). Still an obstacle, like every other standing
            // figure, so Boy walks around them rather than through them.
            obstacles.add(key(x, y)); features.crowd.push({ x: x, y: y }); break;
          case 'C': obstacles.add(key(x, y)); features.car = { x: x, y: y }; break;
          case 'V': obstacles.add(key(x, y)); features.practiceSpots.push({ x: x, y: y }); break;
          case '@': playerStart = { x: x, y: y }; break;
        }
      }
    }

    return {
      id: levelDef.id,
      name: levelDef.name,
      W: w, H: h,
      ORIGIN_X: (w - 1) / 2, ORIGIN_Z: (h - 1) / 2,
      exitChars: new Set(Object.keys(exits)),
      obstacles: obstacles,
      features: features,
      groundKinds: groundKinds,
      playerStart: playerStart,
      totalShards: features.shards.length
    };
  }

  // ----------------------------------------------------------------------
  // Three.js setup — level-independent (scene, camera, renderer, lights).
  // ----------------------------------------------------------------------
  var root = document.getElementById('game-root');
  var SKY_COLOR = 0xbfe3ea;

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(SKY_COLOR);
  scene.fog = new THREE.Fog(SKY_COLOR, 22, 46);

  var camera = new THREE.PerspectiveCamera(30, root.clientWidth / root.clientHeight, 0.1, 100);

  var renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(root.clientWidth, root.clientHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.15;
  root.insertBefore(renderer.domElement, root.firstChild);

  var hemi = new THREE.HemisphereLight(0xdcefff, 0x3a5a34, 0.9);
  scene.add(hemi);

  var sun = new THREE.DirectionalLight(0xfff3d6, 1.35);
  sun.position.set(9, 16, 7);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.near = 1;
  sun.shadow.camera.far = 50;
  sun.shadow.bias = -0.0015;
  scene.add(sun);
  scene.add(sun.target);

  // ----------------------------------------------------------------------
  // Prop builders — small, chunky, low-poly "toy diorama" shapes. All
  // level-independent factories; buildWorldGroup places instances of them.
  // ----------------------------------------------------------------------
  function makeTile(kindColor, thickness) {
    var geo = new THREE.BoxGeometry(TILE * 0.97, thickness, TILE * 0.97);
    var mat = new THREE.MeshStandardMaterial({ color: kindColor, roughness: 0.9, metalness: 0.02 });
    var mesh = new THREE.Mesh(geo, mat);
    mesh.receiveShadow = true;
    return mesh;
  }

  // Every indoor location gets its own vibe: wall (replaces the outdoor
  // tree ring around '#'), floor (this level's base ground tile), prop
  // (replaces decorative rocks), and bg (scene background/fog while
  // inside — loadLevel swaps it in and out so indoors never shows the
  // outdoor sky). A level id with no entry here is outdoor/village as
  // before. Hospital's palette predates this registry (it shipped its own
  // clinical white first) — its floor values are carried over unchanged.
  // The Conservatory used to be in here too (a plum-and-gold recital
  // room) — it's a wooded clearing now instead, so it's deliberately
  // absent and falls through to the default outdoor look below (real
  // trees around '#', sky background, grass floor).
  var INTERIOR_THEMES = {
    home: { wall: 0xe0cba8, floor: 0x8a5c34, prop: 0x5a4230, bg: 0x2e2318 },
    hospital: { wall: 0xe3e8ea, floor: 0xeef1f2, prop: 0xc7d1d4, bg: 0xdfe6e8 },
    schoolhouse: { wall: 0x8a6a45, floor: 0xd8bd8a, prop: 0x2f4a3a, bg: 0x3a2e20 },
    studio: { wall: 0x2a3440, floor: 0x1f262d, prop: 0x4fd6c9, bg: 0x141a20, glow: { prop: 'panel', color: 0x4fd6c9 } },
    college: { wall: 0x5a4a3a, floor: 0x9c8560, prop: 0x2a2f3a, bg: 0x1f1a14 },
    // A cave-like environment unlocked from College, long before diagnosis
    // — see the Devil's own talkToNpc() special-case and buildHorns() for
    // the rest of what lives here. Director's note: "too dark" — given the
    // lighting Apple Hall used to have (that level is cut; its theater
    // mechanic never got a cast or design beyond the door, and it wasn't
    // needed) — lighter wall/floor/prop/bg values and Apple Hall's own
    // warm near-white glow color, brighter than the fire-orange this used
    // to be. Kept the fire-brazier PROP shape rather than Apple Hall's
    // glowing stage panels — a floating rectangle would read as tech
    // equipment in a cave, not hellfire — so only the color and base
    // palette were actually "Apple Hall's lighting," not its literal prop.
    hell: { wall: 0x4a1a26, floor: 0x5a3a20, prop: 0x8a7030, bg: 0x150a10, glow: { prop: 'fire', color: 0xfff0c2 } },
    // hell_2/hell_3 — the staircase's lower two floors (see the 'hell'
    // LEVELS entry). Each step down is a linear blend toward Hell's
    // ORIGINAL pre-fix palette (wall 0x3a1f1a / floor 0x241210 /
    // prop 0x6b1f14 / bg 0x1a0d0a / glow 0xff8a3a) — but capped well short
    // of it (45% of the way at the bottom, hell_3), never actually
    // reaching that original darkness, per the director's note: tails and
    // horns should stay visible all the way down.
    hell_2: { wall: 0x451b22, floor: 0x4b2f1c, prop: 0x815928, bg: 0x160b0e, glow: { prop: 'fire', color: 0xffd49c } },
    hell_3: { wall: 0x411d1f, floor: 0x3c2417, prop: 0x794321, bg: 0x180c0d, glow: { prop: 'fire', color: 0xffb877 } }
  };

  // levelId opts into a level-specific palette via INTERIOR_THEMES; a
  // level with no entry there stays the grassy outdoor default.
  function groundColorFor(c, levelId) {
    var theme = INTERIOR_THEMES[levelId];
    if (theme) {
      if (levelId === 'hospital' && c === '=') return new THREE.Color(0xcfd6d9).offsetHSL(rand(-0.01, 0.01), 0, rand(-0.02, 0.02));
      if (levelId === 'hospital' && c === '~') return new THREE.Color(0x3aa0c9);
      // per-tile jitter for a hand-painted look
      return new THREE.Color(theme.floor).offsetHSL(rand(-0.005, 0.005), rand(-0.02, 0.02), rand(-0.02, 0.015));
    }
    if (c === '=') return new THREE.Color(0xC9A876).offsetHSL(rand(-0.01, 0.01), 0, rand(-0.03, 0.02));
    if (c === '~') return new THREE.Color(0x3aa0c9);
    // grass base, with per-tile jitter for a hand-painted look
    return new THREE.Color(0x5fae4c).offsetHSL(rand(-0.02, 0.02), rand(-0.05, 0.05), rand(-0.04, 0.03));
  }
  var PORTAL_TILE_COLOR = 0x554a66;

  // Boy is telling his own story: he and his family (Mom, Dad) are Indian
  // — everyone else in the world defaults to SKIN_LIGHT unless an NPC's
  // appearance explicitly overrides it. Dad's own three appearance objects
  // (Home standing/hospice, Hospital diagnosis) use a hand-picked darker
  // 0x8a5a3a rather than this shared SKIN_BROWN — director's note: at
  // SKIN_BROWN, next to his white balding hair, Dad read visibly lighter
  // than Mom/Boy by contrast even though the hex was the same; darkening
  // his own value directly is a real, deliberate difference now, not a bug.
  var SKIN_LIGHT = 0xe8b58c;
  var SKIN_BROWN = 0xa9714a;

  // Character body style toggle. 'chess' renders every character's torso
  // as a chess-piece pedestal (shape driven by appearance.pieceType — see
  // the npcs legend above LEVELS); 'human' renders the original capsule
  // body + legs. Head, hair, and all appearance colors are unchanged by
  // this switch either way — the "costume" stays the same, only the body
  // underneath it changes. Flip this one constant to change every
  // character in the game at once; change one NPC's own `pieceType` to
  // change just them.
  var CHARACTER_STYLE = 'chess';

  function createTree() {
    var g = new THREE.Group();
    var trunk = new THREE.Mesh(
      new THREE.CylinderGeometry(0.16, 0.2, 0.9, 8),
      new THREE.MeshStandardMaterial({ color: 0x7a4a2b, roughness: 0.95 })
    );
    trunk.position.y = 0.45;
    trunk.castShadow = true;
    g.add(trunk);
    var leafMat = new THREE.MeshStandardMaterial({ color: 0x3f8f4a, roughness: 0.85 });
    var tiers = [ [0.85, 0.95, 1.05], [0.65, 1.4, 1.4], [0.45, 1.85, 1.75] ];
    tiers.forEach(function (t) {
      var cone = new THREE.Mesh(new THREE.ConeGeometry(t[0], 0.85, 7), leafMat);
      cone.position.y = t[1];
      cone.rotation.y = rand(0, Math.PI);
      cone.castShadow = true;
      g.add(cone);
    });
    g.scale.setScalar(rand(0.92, 1.1));
    g.rotation.y = rand(0, Math.PI * 2);
    return g;
  }

  // Indoor counterpart to createTree() — a plain interior wall block for
  // an INTERIOR_THEMES level's '#' border, so it reads as a room instead
  // of a tree-ringed clearing.
  function createInteriorWall(color) {
    var g = new THREE.Group();
    var mesh = new THREE.Mesh(
      new THREE.BoxGeometry(TILE * 0.98, 1.9, TILE * 0.98),
      new THREE.MeshStandardMaterial({ color: color, roughness: 0.8 })
    );
    mesh.position.y = 0.95;
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    g.add(mesh);
    return g;
  }

  // Indoor counterpart to createRock() — a plain furniture-block stand-in
  // for an INTERIOR_THEMES level's 'o' decoration.
  function createInteriorProp(color) {
    var g = new THREE.Group();
    var mesh = new THREE.Mesh(
      new THREE.BoxGeometry(0.55, 0.55, 0.55),
      new THREE.MeshStandardMaterial({ color: color, roughness: 0.6 })
    );
    mesh.position.y = 0.275;
    mesh.rotation.y = rand(0, Math.PI * 2);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    g.add(mesh);
    return g;
  }

  // A brazier + flame — for interior themes that want a real light source
  // instead of a plain furniture prop (Hell, first). The flame mesh is
  // emissive on its own material, which reads even without a light source;
  // buildWorldGroup() also nests a real PointLight into this same group at
  // each glow spot, so the light actually falls on neighboring tiles and
  // props instead of just lighting itself. See INTERIOR_THEMES' `glow`
  // field and its use in buildWorldGroup().
  function createFire() {
    var g = new THREE.Group();
    var brazier = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.1, 0.22, 8), new THREE.MeshStandardMaterial({ color: 0x2a2018, roughness: 0.9 }));
    brazier.position.y = 0.11;
    brazier.castShadow = true;
    g.add(brazier);
    var flameMat = new THREE.MeshStandardMaterial({ color: 0xff7a2a, emissive: 0xff5a1a, emissiveIntensity: 1.4, roughness: 0.4 });
    var flame = new THREE.Mesh(new THREE.ConeGeometry(0.1, 0.32, 8), flameMat);
    flame.position.y = 0.38;
    g.add(flame);
    var innerFlame = new THREE.Mesh(new THREE.ConeGeometry(0.055, 0.2, 8), new THREE.MeshStandardMaterial({ color: 0xffd166, emissive: 0xffc233, emissiveIntensity: 1.6 }));
    innerFlame.position.y = 0.34;
    g.add(innerFlame);
    return g;
  }

  // A glowing instrument panel — same purpose as createFire() (an emissive
  // prop paired with a real PointLight), for tech environments where an
  // open flame wouldn't fit (Coffee's Studio). Color is caller-supplied so
  // it's reusable for any tech-glow environment, not teal specifically.
  function createGlowPanel(color) {
    var g = new THREE.Group();
    var frame = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.35, 0.08), new THREE.MeshStandardMaterial({ color: 0x161616, roughness: 0.7 }));
    frame.position.y = 0.3;
    g.add(frame);
    var panel = new THREE.Mesh(new THREE.PlaneGeometry(0.4, 0.25), new THREE.MeshStandardMaterial({ color: color, emissive: color, emissiveIntensity: 1.6, roughness: 0.25 }));
    panel.position.set(0, 0.3, 0.045);
    g.add(panel);
    return g;
  }

  function createRock() {
    var g = new THREE.Group();
    var mesh = new THREE.Mesh(
      new THREE.IcosahedronGeometry(0.5, 0),
      new THREE.MeshStandardMaterial({ color: 0x9a978f, roughness: 0.95, flatShading: true })
    );
    mesh.scale.set(rand(0.9, 1.2), rand(0.6, 0.85), rand(0.9, 1.2));
    mesh.position.y = 0.32;
    mesh.rotation.set(rand(0, Math.PI), rand(0, Math.PI), rand(0, Math.PI));
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    g.add(mesh);
    return g;
  }

  function createBush() {
    var g = new THREE.Group();
    var mat = new THREE.MeshStandardMaterial({ color: 0x3c7a3f, roughness: 0.9 });
    for (var i = 0; i < 4; i++) {
      var s = new THREE.Mesh(new THREE.SphereGeometry(0.32, 8, 8), mat);
      s.position.set(rand(-0.22, 0.22), rand(0.25, 0.45), rand(-0.22, 0.22));
      s.castShadow = true;
      g.add(s);
    }
    return g;
  }

  function createFlower() {
    var g = new THREE.Group();
    var petalColor = [0xff6fa5, 0xffd166, 0xff8c42, 0xef476f][Math.floor(rand(0, 4))];
    var stem = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.28, 5), new THREE.MeshStandardMaterial({ color: 0x4a8f3f }));
    stem.position.y = 0.14;
    g.add(stem);
    var bloom = new THREE.Mesh(new THREE.SphereGeometry(0.09, 6, 6), new THREE.MeshStandardMaterial({ color: petalColor, roughness: 0.6 }));
    bloom.position.y = 0.3;
    g.add(bloom);
    g.position.set(rand(-0.4, 0.4), 0, rand(-0.4, 0.4));
    g.scale.setScalar(rand(0.8, 1.2));
    return g;
  }

  // Sized from tile-index deltas only (no world-origin lookup), so it can
  // be built before the level that owns it has become the active world.
  // buildWorldGroup positions the returned group afterward.
  // theme: 'clinical' swaps the cozy cottage palette (tan walls, terracotta
  // roof, wood door) for a pale, institutional one — used for the Hospital,
  // the one building that shouldn't look like a village home.
  function createHouse(tiles, theme) {
    var minX = Math.min.apply(null, tiles.map(function (t) { return t.x; }));
    var maxX = Math.max.apply(null, tiles.map(function (t) { return t.x; }));
    var minY = Math.min.apply(null, tiles.map(function (t) { return t.y; }));
    var maxY = Math.max.apply(null, tiles.map(function (t) { return t.y; }));
    var width = (maxX - minX) * TILE + TILE * 0.92;
    var depth = (maxY - minY) * TILE + TILE * 0.92;
    var clinical = theme === 'clinical';

    var g = new THREE.Group();
    var wallH = 1.7;
    var walls = new THREE.Mesh(
      new THREE.BoxGeometry(width, wallH, depth),
      new THREE.MeshStandardMaterial({ color: clinical ? 0xf5f7f8 : 0xE4C79A, roughness: clinical ? 0.6 : 0.85 })
    );
    walls.position.y = wallH / 2;
    walls.castShadow = true;
    walls.receiveShadow = true;
    g.add(walls);

    // A peaked roof reads as "a house" — right for a village cottage, wrong
    // for a mass sitting inside the Hospital's own interior, so clinical
    // gets a flat capped ceiling slab instead of the cottage's cone.
    var roof = clinical
      ? new THREE.Mesh(
          new THREE.BoxGeometry(width * 1.06, 0.18, depth * 1.06),
          new THREE.MeshStandardMaterial({ color: 0xc7d1d4, roughness: 0.6 })
        )
      : new THREE.Mesh(
          new THREE.ConeGeometry(Math.max(width, depth) * 0.78, 1.15, 4),
          new THREE.MeshStandardMaterial({ color: 0xB5432E, roughness: 0.75 })
        );
    if (clinical) {
      roof.position.y = wallH + 0.09;
    } else {
      roof.rotation.y = Math.PI / 4;
      roof.position.y = wallH + 0.5;
    }
    roof.castShadow = true;
    g.add(roof);

    var door = new THREE.Mesh(
      new THREE.BoxGeometry(0.6, 1.05, 0.06),
      new THREE.MeshStandardMaterial({ color: clinical ? 0x9aa7ac : 0x5b3620 })
    );
    door.position.set(0, 0.52, depth / 2 + 0.03);
    g.add(door);

    var window1 = new THREE.Mesh(
      new THREE.BoxGeometry(0.4, 0.4, 0.05),
      new THREE.MeshStandardMaterial({ color: 0x9fd8e8, emissive: 0x2a4650, emissiveIntensity: 0.4 })
    );
    window1.position.set(width / 2 + 0.03, 1.0, 0);
    window1.rotation.y = Math.PI / 2;
    g.add(window1);

    return g;
  }

  function createSignPost() {
    var g = new THREE.Group();
    var post = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.07, 0.9, 6), new THREE.MeshStandardMaterial({ color: 0x6b4526 }));
    post.position.y = 0.45;
    post.castShadow = true;
    g.add(post);
    var board = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.36, 0.08), new THREE.MeshStandardMaterial({ color: 0x9c6a3c }));
    board.position.y = 0.85;
    board.castShadow = true;
    g.add(board);
    return g;
  }

  function createShard() {
    var g = new THREE.Group();
    var mat = new THREE.MeshStandardMaterial({ color: 0x7ee8ff, emissive: 0x2fb8e0, emissiveIntensity: 0.9, roughness: 0.25, metalness: 0.3 });
    var mesh = new THREE.Mesh(new THREE.OctahedronGeometry(0.26, 0), mat);
    mesh.castShadow = true;
    mesh.position.y = 0.55;
    g.add(mesh);
    var light = new THREE.PointLight(0x7ee8ff, 1.1, 2.4, 2);
    light.position.y = 0.55;
    g.add(light);
    g.userData.spin = mesh;
    return g;
  }

  // A job's `harvest` requirement — walk over one of these to add to
  // story.produce[item], the same way a shard adds to the level puzzle,
  // except these feed a job turn-in instead: see checkCropPickup() and
  // talkToNpc()'s job branch. Takes `kind` (falls back to `item` when a
  // feature has no separate one) purely for which model to build — carrot/
  // potato/corn all feed the SAME `vegetable` economy, just for variety.
  function createCrop(kind) {
    var g = new THREE.Group();
    if (kind === 'basket') {
      var basket = new THREE.Mesh(
        new THREE.CylinderGeometry(0.22, 0.16, 0.28, 8),
        new THREE.MeshStandardMaterial({ color: 0x8a6a3a, roughness: 0.9 })
      );
      basket.position.y = 0.16;
      basket.castShadow = true;
      g.add(basket);
      var goods = new THREE.Mesh(
        new THREE.SphereGeometry(0.14, 8, 8),
        new THREE.MeshStandardMaterial({ color: 0xd6432f, roughness: 0.6 })
      );
      goods.position.y = 0.32;
      goods.castShadow = true;
      g.add(goods);
    } else if (kind === 'crate') {
      var crate = new THREE.Mesh(
        new THREE.BoxGeometry(0.32, 0.28, 0.32),
        new THREE.MeshStandardMaterial({ color: 0x7a5a35, roughness: 0.9 })
      );
      crate.position.y = 0.16;
      crate.castShadow = true;
      g.add(crate);
      var band = new THREE.Mesh(
        new THREE.BoxGeometry(0.34, 0.05, 0.34),
        new THREE.MeshStandardMaterial({ color: 0x4a3520, roughness: 0.9 })
      );
      band.position.y = 0.16;
      g.add(band);
    } else if (kind === 'seedrow') {
      var mound = new THREE.Mesh(
        new THREE.BoxGeometry(0.4, 0.08, 0.22),
        new THREE.MeshStandardMaterial({ color: 0x5a3f28, roughness: 0.95 })
      );
      mound.position.y = 0.06;
      mound.castShadow = true;
      g.add(mound);
      var sproutMat = new THREE.MeshStandardMaterial({ color: 0x6fbf5a, roughness: 0.8 });
      for (var si = 0; si < 3; si++) {
        var sprout = new THREE.Mesh(new THREE.ConeGeometry(0.025, 0.14, 5), sproutMat);
        sprout.position.set(-0.12 + si * 0.12, 0.15, 0);
        g.add(sprout);
      }
    } else if (kind === 'potato') {
      var tuber = new THREE.Mesh(
        new THREE.SphereGeometry(0.15, 8, 8),
        new THREE.MeshStandardMaterial({ color: 0xa9825a, roughness: 0.95 })
      );
      tuber.scale.set(1, 0.78, 1.15);
      tuber.position.y = 0.13;
      tuber.castShadow = true;
      g.add(tuber);
      var vine = new THREE.MeshStandardMaterial({ color: 0x4f9a4a, roughness: 0.8 });
      for (var pi = 0; pi < 2; pi++) {
        var stem = new THREE.Mesh(new THREE.ConeGeometry(0.03, 0.24, 5), vine);
        stem.position.set(pi === 0 ? -0.05 : 0.06, 0.34, 0);
        g.add(stem);
      }
    } else if (kind === 'corn') {
      var cob = new THREE.Mesh(
        new THREE.CylinderGeometry(0.06, 0.07, 0.32, 8),
        new THREE.MeshStandardMaterial({ color: 0xe8c53f, roughness: 0.6 })
      );
      cob.position.y = 0.22;
      cob.castShadow = true;
      g.add(cob);
      var huskMat = new THREE.MeshStandardMaterial({ color: 0x6fbf5a, roughness: 0.8 });
      for (var ci = 0; ci < 3; ci++) {
        var husk = new THREE.Mesh(new THREE.ConeGeometry(0.05, 0.3, 5), huskMat);
        husk.position.set(Math.cos(ci * 2.1) * 0.05, 0.16, Math.sin(ci * 2.1) * 0.05);
        husk.rotation.z = (ci - 1) * 0.25;
        g.add(husk);
      }
    } else {
      var root = new THREE.Mesh(
        new THREE.ConeGeometry(0.09, 0.32, 6),
        new THREE.MeshStandardMaterial({ color: 0xe8792f, roughness: 0.6 })
      );
      root.position.y = 0.16;
      root.rotation.x = Math.PI;
      root.castShadow = true;
      g.add(root);

  // ----------------------------------------------------------------------
  // Chess-piece bodies — replace the capsule-torso-and-legs body when
  // CHARACTER_STYLE === 'chess'. Each returns a pedestal shaped and sized
  // to reach up near where the (unchanged) head sits; head/hair/scarf are
  // still built by createHuman/createPlayer on top of whichever body they
  // get, so a character's costume colors carry over unchanged either way.
  // ----------------------------------------------------------------------
  // topColor/bottomColor are normally a hex number, but may instead be a
  // THREE.Texture (see getTieDyeTexture()) for a patterned costume — this
  // is the one place that distinction is handled, so every piece body
  // builder below can just call it instead of constructing its own
  // MeshStandardMaterial.
  function pieceMaterial(colorOrTexture, roughness) {
    if (colorOrTexture && colorOrTexture.isTexture) {
      return new THREE.MeshStandardMaterial({ map: colorOrTexture, roughness: roughness });
    }
    return new THREE.MeshStandardMaterial({ color: colorOrTexture, roughness: roughness });
  }

  // A blotchy tie-dye pattern, painted once onto a canvas and reused by
  // every character with `appearance.tieDye: true` (see createHuman) —
  // there's only one canvas ever built for this, not one per character.
  var tieDyeTexture = null;
  function getTieDyeTexture() {
    if (tieDyeTexture) return tieDyeTexture;
    var size = 128;
    var canvas = document.createElement('canvas');
    canvas.width = size;
    canvas.height = size;
    var ctx = canvas.getContext('2d');
    var colors = ['#ff2ea6', '#ffcf3a', '#3ad6ff', '#7a4fff', '#5fdc6a', '#ff6a3a'];
    ctx.fillStyle = colors[0];
    ctx.fillRect(0, 0, size, size);
    ctx.globalAlpha = 0.85;
    for (var i = 0; i < 22; i++) {
      var cx = rand(0, size), cy = rand(0, size), r = rand(size * 0.14, size * 0.4);
      var grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
      grad.addColorStop(0, colors[Math.floor(rand(0, colors.length))]);
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    tieDyeTexture = new THREE.CanvasTexture(canvas);
    tieDyeTexture.wrapS = tieDyeTexture.wrapT = THREE.RepeatWrapping;
    return tieDyeTexture;
  }

  // Alternate queen crown, ported from the Character Gallery workshop —
  // a ring of small faceted "blooms" on a plain stem-colored band, at the

  // Picked via appearance.crownStyle: 'flower' (queen pieceType only, see
  // createHuman() below); unset defaults to the plain crown above, so
  // every already-authored queen NPC is untouched.
  var FLOWER_CROWN_COLORS = [0xf2b6c6, 0xf7e07a, 0xffffff, 0xd9a8e0, 0xf5c99b];
  function createFlowerCrownTopper() {
    var g = new THREE.Group();
    var bandMat = new THREE.MeshStandardMaterial({ color: 0x4a6b3a, roughness: 0.85 });

      var flower = new THREE.Mesh(new THREE.IcosahedronGeometry(0.028, 0), petalMat);
      flower.position.set(Math.cos(a) * 0.16, 0.035 + 0.02, Math.sin(a) * 0.16);
      g.add(flower);
      var centerMat = new THREE.MeshStandardMaterial({ color: 0xe0a83c, roughness: 0.6 });
      var center = new THREE.Mesh(new THREE.SphereGeometry(0.012, 6, 6), centerMat);
      center.position.copy(flower.position);
      center.position.y += 0.018;

  // A thin, OPEN band with one raised point at the front instead of six
  // evenly-spaced ones — built as a partial CylinderGeometry (its
  // circular cross-section is already horizontal by construction, so no
  // extra rotation guesswork). Picked via crownStyle: 'tiara'; given to
  // Ms. Whitfield (piano) for recital elegance, distinct from Liz's
  // flower crown and Sora's reed crown below.
  function createTiaraTopper(color) {
    var g = new THREE.Group();
    var mat = new THREE.MeshStandardMaterial({ color: color, metalness: 0.55, roughness: 0.28, emissive: color, emissiveIntensity: 0.16 });
    var gapDeg = 110;
    var thetaStart = (90 + gapDeg / 2) * Math.PI / 180;
    var thetaLength = (360 - gapDeg) * Math.PI / 180;
    var band = new THREE.Mesh(new THREE.CylinderGeometry(0.155, 0.17, 0.05, 16, 1, true, thetaStart, thetaLength), mat);
    band.position.y = 0.025;
    g.add(band);
    var centerAngle = Math.PI / 2;
    [[-0.5, 0.07], [0, 0.16], [0.5, 0.07]].forEach(function (pair) {
      var a = centerAngle + pair[0];
      var h = pair[1];
      var spike = new THREE.Mesh(new THREE.ConeGeometry(0.02, h, 8), mat);
      spike.position.set(Math.cos(a) * 0.16, 0.05 + h / 2, Math.sin(a) * 0.16);
      g.add(spike);
    });
    var gem = new THREE.Mesh(new THREE.OctahedronGeometry(0.03), mat);
    gem.position.set(Math.cos(centerAngle) * 0.16, 0.05 + 0.09, Math.sin(centerAngle) * 0.16);
    g.add(gem);
    return g;
  }

  // Thin reed/pipe blades fanned across the front like panpipes, rooted
  // in a stem-colored band the same way the flower crown is — natural
  // material, so (like createFlowerCrownTopper) this ignores the passed
  // accent color on purpose and uses its own fixed reed palette instead.
  // Picked via crownStyle: 'reed'; given to Sora (flute, Meadow).
  function createReedCrownTopper() {
    var g = new THREE.Group();
    var bandMat = new THREE.MeshStandardMaterial({ color: 0x4a6b3a, roughness: 0.85 });
    var band = new THREE.Mesh(new THREE.CylinderGeometry(0.155, 0.16, 0.03, 16), bandMat);
    band.position.y = 0.015;
    g.add(band);
    var reedMat = new THREE.MeshStandardMaterial({ color: 0xc9a860, roughness: 0.6 });
    var reedCount = 7;
    var heights = [0.10, 0.16, 0.21, 0.24, 0.21, 0.16, 0.10];
    var spread = Math.PI * 0.55;
    for (var i = 0; i < reedCount; i++) {
      var t = i / (reedCount - 1) - 0.5;
      var a = Math.PI / 2 + t * spread;
      var h = heights[i];
      var reed = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.014, h, 8), reedMat);
      reed.position.set(Math.cos(a) * 0.15, 0.03 + h / 2, Math.sin(a) * 0.15);
      g.add(reed);
    }
    return g;
  }
  var CROWN_STYLE_BUILDERS = { flower: createFlowerCrownTopper, tiara: createTiaraTopper, reed: createReedCrownTopper };

  // Alternate bishop topper — two ribbon-like arcs twisting above the
  // finial instead of a plain ball, inspired by a director's-note
  // reference image (ornate glass chess pieces) — not a recreation of it,
  // just borrowing its technique: a curved arc (partial TorusGeometry,
  // the same primitive the tiara/thorn crowns above already use) reads as
  // a ribbon/flame far more than any of our straight cones or spheres do.
  // Picked via appearance.bishopTopperStyle: 'swirl' (bishop pieceType
  // only, see createHuman() below); unset defaults to the plain ball
  // above, so every already-authored bishop NPC is untouched — this is
  // for select individual bishops (Dr. Watson first), not a blanket
  // replacement.
  //
  // The two arcs are deliberately NOT mirror images of each other —
  // different radii, angles, and tube thickness — per the director's
  // second note on that reference image: asymmetry is what makes a piece
  // read as distinctive/organic rather than a formal, evenly-balanced
  // crown. Every other topper on this page (crown, tiara, cross) is
  // symmetric on purpose; this one deliberately isn't.
  function createSwirlTopper(color) {
    var g = new THREE.Group();
    var mat = new THREE.MeshStandardMaterial({ color: color, metalness: 0.35, roughness: 0.3, emissive: color, emissiveIntensity: 0.12 });
    var big = new THREE.Mesh(new THREE.TorusGeometry(0.095, 0.02, 8, 16, Math.PI * 1.2), mat);
    big.rotation.x = Math.PI * 0.32;

    var small = new THREE.Mesh(new THREE.TorusGeometry(0.062, 0.014, 8, 14, Math.PI * 1.35), mat);
    small.rotation.x = Math.PI * 0.55;
    small.rotation.z = -0.85;
    small.position.set(0.02, 0.185, 0.01);
    g.add(small);
    var tip = new THREE.Mesh(new THREE.SphereGeometry(0.02, 8, 8), mat);
    tip.position.set(0.03, 0.245, 0.015);
    g.add(tip);
    return g;
  }
  // A violin scroll — three concentric partial rings of shrinking radius,
  // standing on edge (TorusGeometry is already flat in its local XY
  // plane, which is vertical/side-on by default — no rotation needed),
  // reading as a tight spiral silhouette at this game's abstraction
  // level. Picked via bishopTopperStyle: 'scroll'; given to Julia
  // (id: 'alden', violin) — distinct from Dr. Voss's swirl and
  // Professor Coffee's antenna below.
  function createScrollTopper(color) {
    var g = new THREE.Group();
    var mat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.4, metalness: 0.2 });
    var stem = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.022, 0.08, 8), mat);
    stem.position.y = 0.04;
    g.add(stem);
    var radii = [0.075, 0.05, 0.026];
    var tubes = [0.016, 0.014, 0.012];
    radii.forEach(function (r, i) {
      var ring = new THREE.Mesh(new THREE.TorusGeometry(r, tubes[i], 8, 12, Math.PI * 1.5), mat);
      ring.position.set(0, 0.08 + r, 0);
      ring.rotation.z = i * 0.5;
      g.add(ring);
    });
    return g;
  }

  // A coil/antenna — three shrinking horizontal loops stacked upward like
  // a spring, each a full TorusGeometry ring tipped onto its side
  // (rotation.x = 90°), topped with a small ball — an oscillator/antenna
  // silhouette. Picked via bishopTopperStyle: 'antenna'; given to
  // Professor Coffee (synth, Studio).
  function createAntennaTopper(color) {
    var g = new THREE.Group();
    var mat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.35, metalness: 0.5 });
    var base = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.026, 0.03, 8), mat);
    base.position.y = 0.015;
    g.add(base);
    var loopRadii = [0.05, 0.04, 0.03];
    var y = 0.05;
    loopRadii.forEach(function (r) {
      var loop = new THREE.Mesh(new THREE.TorusGeometry(r, 0.012, 8, 12), mat);
      loop.rotation.x = Math.PI / 2;
      loop.position.y = y;
      g.add(loop);
      y += 0.055;
    });
    var tip = new THREE.Mesh(new THREE.SphereGeometry(0.022, 8, 8), mat);
    tip.position.y = y;
    g.add(tip);

  var BISHOP_TOPPER_BUILDERS = { swirl: createSwirlTopper, scroll: createScrollTopper, antenna: createAntennaTopper };
