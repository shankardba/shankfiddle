  // ----------------------------------------------------------------------
  // URL-hash save link — a TESTING stand-in for real progress-saving, not
  // the target design. It works by trusting the client completely: the
  // whole `story` blob (the same one restartGame() resets to its initial
  // literal) plus the current level id gets JSON-encoded straight into
  // location.hash, and reading it back on load just overwrites `story`
  // wholesale. That is exactly the property a real save system must NOT
  // have once Google login exists — the eventual backend has to validate
  // discrete, named events (a job payout, a challenge step) against
  // server-held state, not accept a client-asserted "money is now 9999."
  // Until then, this is deliberately hand-editable: JSON.stringify's
  // output is encodeURIComponent'd for correctness, but every actual
  // value (chapter names, numbers, npc ids) survives that encoding
  // untouched — only the JSON punctuation turns into %7B/%22/%3A/%2C/%7D —
  // so pasting the link into the address bar and editing a word or number
  // directly, then hitting Enter, is the whole "hack in progress" workflow.
  // Not tied to exact position — matches every other "resume" point in
  // this game (loadLevel's own spawn tile), just like a real save reads.
  var SAVE_HASH_PREFIX = 'save=';
  function serializeSave() {
    return '#' + SAVE_HASH_PREFIX + encodeURIComponent(JSON.stringify({ level: world.id, story: story }));
  }
  // Returns the saved level id if a save link was present and parsed, or
  // null otherwise (including "no save link at all," a plain fresh visit).
  // Overlays the save's fields onto a fresh default `story` rather than
  // trusting the parsed object outright, so a hand-truncated/edited link
  // missing a field (respect, learned, etc.) still gets a safe {} instead
  // of crashing the first time something reads a missing key.
  function applySaveFromHash() {
    var prefix = '#' + SAVE_HASH_PREFIX;
    if (location.hash.indexOf(prefix) !== 0) return null;
    var payload;
    try {
      payload = JSON.parse(decodeURIComponent(location.hash.slice(prefix.length)));
    } catch (e) {
      console.warn('Boy: could not parse the save link, starting fresh.', e);
      return null;
    }
    if (!payload || typeof payload.story !== 'object') return null;
    story = { chapter: 'childhood', respect: {}, learned: {}, money: 0, communityRespect: {}, missionStep: {}, chapterTalks: {}, produce: {}, goalDone: {}, hasCar: false, fieldSeedsPlanted: false, colorRestored: {} };
    Object.keys(payload.story).forEach(function (k) { story[k] = payload.story[k]; });
    return payload.level || null;
  }
  // Writes the current save link into the address bar (so it's always
  // there to copy by hand, clipboard permission or not) and tries the
  // clipboard as a convenience on top.
  function copySaveLink() {
    var url = location.origin + location.pathname + serializeSave();
    history.replaceState(null, '', url);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(function () {
        showToast('🔗 Save link copied — paste it anywhere to resume here.', 2600);
      }).catch(function () {
        showToast('🔗 Save link is in the address bar now — copy it from there.', 3200);
      });
    } else {
      showToast('🔗 Save link is in the address bar now — copy it from there.', 3200);
    }
  }

  // Wipes every piece of run state back to its very first value (see the
  // `var story = {...}` literal this mirrors) and reloads Home — a real
  // restart, not a soft reset. Growth scaling (see growthScaleForChapter())
  // is tied to story.chapter, so player.obj's scale is reset alongside it;
  // everything else (level geometry, NPC defs) is stateless and just
  // re-derives itself correctly once story.chapter is back to 'childhood'.
  function restartGame() {
    story = { chapter: 'childhood', respect: {}, learned: {}, money: 0, communityRespect: {}, missionStep: {}, chapterTalks: {}, produce: {}, goalDone: {}, hasCar: false, fieldSeedsPlanted: false, colorRestored: {} };
    player.obj.scale.setScalar(growthScaleForChapter(story.chapter));
    loadLevel(0);
    showToast('The game begins again.', 2400);
  }

  // The Devil's one mechanic — see the doc comment on his talkToNpc()
  // special-case above. A fixed three-step exchange using openChoice()
  // twice in a row (its own doc comment covers why onSelect can safely
  // open a second choice): the warning text lives in the SECOND choice's
  // own prompt, rather than a separate plain dialogue screen in between,
  // since openChoice already renders a speaker + prompt like any dialogue
  // box before its buttons. Saying "No" at step one, or "I can bear it" at
  // the final choice, both just return to normal play with no side effect
  // — the story doesn't say what "No" leads to beyond that, so this
  // doesn't invent anything further for it.
  // From 'diagnosis' onward, the "end it" offer retires for good — the
  // first visit that chapter (or any later one) plays a one-time respect
  // beat instead (story.learned.devilFriend), then every visit after that
  // is a placeholder for the task-giving mechanic described as "TBD" —
  // no task system exists yet, so this just acknowledges there's nothing
  // to hand over yet rather than faking one. Note this is a DIFFERENT
  // trigger than his color exception in applyWorldColor(), which doesn't
  // fire until 'grief' — he earns your respect two chapters before the
  // world (and he) actually turns to color.
  function talkToDevil(npc) {
    if (CHAPTERS.indexOf(story.chapter) >= CHAPTERS.indexOf('diagnosis')) {
      if (!story.learned.devilFriend) {
        story.learned.devilFriend = true;
        openDialogue("Not anymore. I'm not going to be the one who ends it for you — not you. You're not a soul passing through down here. You're my friend.", 'The Devil', undefined, npc.obj);
      } else {
        openDialogue("Nothing for you to do yet. When I've got something worth asking, you'll be the first to know.", 'The Devil', undefined, npc.obj);
      }
      return;
    }
    openChoice('Do you want to end it?', 'The Devil', [
      {
        label: 'Yes',
        onSelect: function () {
          openChoice(
            "I can do it, but you're not getting anything better, reincarnation, or heaven are bullshit, if you want to end it you will replay the same challenges over and over until you can handle it.",
            'The Devil',
            [
              { label: 'I can bear it', onSelect: function () {} },
              { label: 'Take me', onSelect: restartGame }
            ],
            npc.obj
          );
        }
      },
      { label: 'No', onSelect: function () {} }
    ], npc.obj);
  }

  // A second, narrower way into the same #car-menu UI: before the car is
  // earned, Mom can drive Boy to any location that actually needs a ride
  // (any `availableFrom` level his own two feet can't reach yet — Hospital,
  // then the High School) — see momRideLink(), which hangs this off her own
  // dialogue rather than a whole separate NPC branch. Once hasCar, this
  // never fires — the car itself supersedes it, see momRideLink() below.
  function openMomRideMenu() {
    closeDialogue();
    carMenuTitleEl.textContent = 'Ride to…';
    carMenuListEl.innerHTML = '';
    var curChapterIdx = CHAPTERS.indexOf(story.chapter);
    LEVELS.forEach(function (lvl, i) {
      if (lvl.id === world.id || !lvl.availableFrom) return;
      var fromIdx = CHAPTERS.indexOf(lvl.availableFrom);
      if (fromIdx === -1 || curChapterIdx < fromIdx) return;
      var btn = document.createElement('button');
      btn.textContent = lvl.name;
      btn.addEventListener('click', function () {
        closeCarMenu();
        loadLevel(i);
      });
      carMenuListEl.appendChild(btn);
    });
    carMenuEl.classList.add('open');
    carMenuOpen = true;
  }
  // Returns a dialogue `link` (see openDialogue) offering Mom's ride, or
  // undefined when it doesn't apply — safe to call for any isFamily NPC;
  // only actually produces anything for Mom, at Home, before the car, and
  // only once there's somewhere that ride would actually go.
  function momRideLink(def) {
    if (def.id !== 'mom' || world.id !== 'home' || story.hasCar) return undefined;
    var curChapterIdx = CHAPTERS.indexOf(story.chapter);
    var hasDestination = LEVELS.some(function (lvl) {
      if (!lvl.availableFrom) return false;
      var fromIdx = CHAPTERS.indexOf(lvl.availableFrom);
      return fromIdx !== -1 && curChapterIdx >= fromIdx;
    });
    return hasDestination ? { label: '🚗 Ask Mom for a ride →', onClick: openMomRideMenu } : undefined;
  }

  // NPCs with a `challenge` turn talking into a repeatable respect grind
  // instead of a static line: each conversation nudges story.respect[key]
  // up by one (with a line reacting to where you're at) until it reaches
  // the threshold, at which point story.learned[key] is set once and the
  // completion line plays from then on.
  // Stable key into story.respect for an NPC — prefer their declared `id`;
  // falling back to a lowercased name is a convenience for quick NPCs, not
  // a guarantee (two NPCs named the same would collide), so give any NPC
  // whose individual respect actually matters a real `id`.
  function npcRespectKey(def) { return def.id || def.name.toLowerCase(); }

  function talkToNpc(npc) {
    var def = npc.def;

    // The Devil doesn't fit job/challenge/missions/dialogue — his one
    // mechanic is the game's restart offer, driven entirely by openChoice()
    // (see its doc comment) rather than the respect/dialogue system every
    // other NPC uses. See talkToDevil() below for the fixed three-step text.
    if (def.id === 'devil') { talkToDevil(npc); return; }

    if (def.job) {
      var job = def.job;
      var jobKey = npcRespectKey(def);
      var jobRespect = story.respect[jobKey] || 0;

      // A job with `trust` doesn't hand you any paid work at all until
      // you've earned a base level of respect first — a short, BOUNDED
      // getting-to-know-you exchange (same rule as everywhere else: a new
      // line is a distinct beat worth +1 respect once, never free
      // repetition — see talkToNpc's isFamily branch for the original).
      if (job.trust && jobRespect < job.trust.need) {
        var trustKey = jobKey + ':trust';
        var trustVisit = story.chapterTalks[trustKey] || 0;
        var trustLines = job.trust.lines;
        openDialogue(trustLines[Math.min(trustVisit, trustLines.length - 1)], def.name, null, npc.obj);
        if (trustVisit < trustLines.length) {
          story.chapterTalks[trustKey] = trustVisit + 1;
          story.respect[jobKey] = jobRespect + 1;
        }
        return;
      }

      // Once trusted, the highest tier your respect qualifies for is the
      // work on offer — maturing at a job means graduating to better-paid
      // tasks, not doing the entry-level chore forever. `tiers` is
      // optional; a job without one just uses its own top-level
      // pay/harvest/lines as a single implicit tier. A tier marked
      // `oneTime` drops out of consideration for good once claimed (see
      // story.learned below) — a real upgrade, not a repeatable wage.
      var tier = job;
      var tierIndex = -1;
      if (job.tiers) {
        tier = job.tiers[0];
        tierIndex = 0;
        for (var ti = 0; ti < job.tiers.length; ti++) {
          var candidate = job.tiers[ti];
          if (candidate.oneTime && story.learned[jobKey + ':tier' + ti]) continue;
          if (jobRespect >= candidate.minRespect) { tier = candidate; tierIndex = ti; }
        }
      }

      // A tier with `harvest` isn't paid for showing up — go collect the
      // goods (checkCropPickup) first. Below the requirement, talking
      // just tells you what's still needed; nothing is charged or paid.
      if (tier.harvest) {
        var haveProduce = story.produce[tier.harvest.item] || 0;
        if (haveProduce < tier.harvest.need) {
          openDialogue(
            tier.harvest.needLine ||
              ('Bring me ' + tier.harvest.need + ' ' + tier.harvest.itemLabel + ' and I\'ll pay you for it. (' + haveProduce + ' / ' + tier.harvest.need + ')'),
            def.name, null, npc.obj
          );
          return;
        }
        story.produce[tier.harvest.item] = haveProduce - tier.harvest.need;
      }
      story.money += tier.pay || 0;
      story.respect[jobKey] = jobRespect + 1;
      // A real, one-time record that this job has actually been worked —
      // lets other content (e.g. a family dialogue beat's `requires`)
      // reference "have they done real work for Jono/Elsie/etc." without
      // caring about the current respect number, which keeps climbing.
      if (!story.learned['worked_' + jobKey]) story.learned['worked_' + jobKey] = true;
      markReconnected(jobKey);
      if (tier.reputation) {
        var communityId = tier.community || job.community || world.id;
        story.communityRespect[communityId] = (story.communityRespect[communityId] || 0) + tier.reputation;
      }
      if (tier.oneTime && tierIndex >= 0) story.learned[jobKey + ':tier' + tierIndex] = true;
      if (tier.plantsSeeds) story.fieldSeedsPlanted = true;
      renderStats();
      var jobLine = tier.lines[Math.floor(rand(0, tier.lines.length))];
      openDialogue(jobLine, def.name, null, npc.obj);
      var parts = [];
      if (tier.pay) parts.push('+' + tier.pay + ' 💰');
      if (tier.reputation) parts.push('+' + tier.reputation + ' respect');
      if (tier.plantsSeeds) parts.push('🌱 field grows back faster now');
      if (parts.length) showToast(parts.join('   '), 1600);
      return;
    }

    // An NPC with `kindness` is a repeatable act of generosity, not a
    // skill to learn or a wage to earn — you spend money, not gain it,
    // and the community notices: this is how "no combat, only
    // communication" pays out materially, not just in conversation.
    if (def.kindness) {
      var kindness = def.kindness;
      if (story.money < kindness.cost) {
        openDialogue(kindness.needLine || "...", def.name, null, npc.obj);
        return;
      }
      story.money -= kindness.cost;
      var kindCommunity = kindness.community || world.id;
      story.communityRespect[kindCommunity] = (story.communityRespect[kindCommunity] || 0) + (kindness.reputation || 0);
      // Same idea as a job's worked_<jobKey> flag — a real, one-time
      // record that this act of generosity actually happened, so other
      // content can gate on it (see e.g. Dad's earning_respect beats).
      if (!story.learned['kindness_' + npcRespectKey(def)]) story.learned['kindness_' + npcRespectKey(def)] = true;
      markReconnected(npcRespectKey(def));
      renderStats();
      var kindLine = kindness.lines[Math.floor(rand(0, kindness.lines.length))];
      openDialogue(kindLine, def.name, null, npc.obj);
      showToast('-' + kindness.cost + ' 💰   +' + (kindness.reputation || 0) + ' respect', 1800);
      return;
    }

    // An NPC with `missions` resolves to whichever step is current, exactly
    // like a single `challenge`, from here down — this is the only place
    // that needs to know missions are a chain at all.
    var ch = def.challenge;
    var missionIdx = -1;
    if (!ch && def.missions) {
      missionIdx = story.missionStep[def.id] || 0;
      if (missionIdx < def.missions.length) ch = def.missions[missionIdx];
    }
    if (!ch) {
      // Four scripted chapter turns, each gated behind continued care —
      // see the thresholds above. setChapter() runs first in every case,
      // so the very same dialogueFor(def) call below that plays ordinary
      // lines picks up each reveal automatically once the chapter flips.
      if (def.id === 'dad' && story.chapter === 'earning_respect' && story.hasCar &&
          familyRespect() >= DIAGNOSIS_FAMILY_RESPECT_THRESHOLD) {
        // Diagnosis reveal, at home — he leaves for the Hospital from here.
        setChapter('diagnosis');
      } else if (def.id === 'dad' && story.chapter === 'diagnosis' &&
          familyRespect() >= HOSPICE_FAMILY_RESPECT_THRESHOLD) {
        // Cleared to go home to hospice — at the Hospital bedside.
        setChapter('hospice');
      } else if (def.id === 'dad' && story.chapter === 'hospice' &&
          familyRespect() >= FAREWELL_FAMILY_RESPECT_THRESHOLD) {
        // His last line, at home — he's gone for good after this.
        setChapter('grief');
      } else if (def.id === 'mom' && story.chapter === 'grief' &&
          (story.respect.mom || 0) >= REBUILD_MOM_RESPECT_THRESHOLD) {
        // Rebuilding, just the two of them — at home.
        setChapter('duty');
      }
      var famKey = npcRespectKey(def);
      // Scoped to id+chapter, separate from story.respect's cumulative
      // total (which is already well past 0 by the time 'diagnosis'
      // starts — the chapter-turn thresholds above see to that) — this is
      // just which beat of THIS chapter's dialogue array you're on.
      var chapterTalkKey = famKey + ':' + story.chapter;
      var chapterVisit = story.chapterTalks[chapterTalkKey] || 0;
      var chapterDialogue = def.dialogue && def.dialogue[story.chapter];
      var beatCount = Array.isArray(chapterDialogue) ? chapterDialogue.length : (chapterDialogue ? 1 : 0);
      // A beat can be gated behind a real task instead of just being
      // talked into existence — an object `{ requires, reminder, line }`
      // instead of a plain string (see the doc above LEVELS). Below the
      // requirement, talking only replays the reminder: no advance, no
      // respect, same "no free respect from talking" rule as everywhere
      // else. dialogueFor() unwraps `line` once it's actually earned.
      if (def.isFamily && chapterVisit < beatCount) {
        var pendingBeat = chapterDialogue[chapterVisit];
        if (pendingBeat && typeof pendingBeat === 'object' && pendingBeat.requires && !story.learned[pendingBeat.requires]) {
          openDialogue(pendingBeat.reminder, def.name, momRideLink(def), npc.obj);
          return;
        }
      }
      openDialogue(dialogueFor(def, chapterVisit), def.name, momRideLink(def), npc.obj);
      if (def.isFamily) {
        story.chapterTalks[chapterTalkKey] = chapterVisit + 1;
        // Respect is earned by reaching a NEW beat of this chapter's
        // dialogue — a distinct caregiving moment, e.g. "you sat with
        // him" — never by repeating one you've already heard. A plain
        // string is one beat; an array is that many. Once you've heard
        // them all, talking is still welcome (the last line just
        // repeats), but it stops growing respect until a new chapter
        // gives this person something new to do.
        if (chapterVisit < beatCount) {
          story.respect[famKey] = (story.respect[famKey] || 0) + 1;
          if (!story.hasCar) showToast('Family respect: ' + familyRespect() + ' / ' + CAR_FAMILY_RESPECT_THRESHOLD, 1600);
        }
        // Care missions: finishing a whole multi-beat arc (not just a
        // single line) is a concrete completed act — waiting out a whole
        // hospital visit, driving Mom home — worth an extra one-time
        // bonus on top of its own beat, milestoned like a challenge's
        // `learned` flag.
        var careKey = 'care_' + chapterTalkKey;
        if (beatCount > 1 && chapterVisit === beatCount - 1 && !story.learned[careKey]) {
          story.learned[careKey] = true;
          story.respect[famKey] += 1;
          var careMessage = def.careMessages && def.careMessages[story.chapter];
          showToast(careMessage || 'Family respect +1 💛', 2400);
        }
      }
      // A roster mentor already fully mastered before Dad died has no
      // further step left to complete — for them specifically, showing up
      // again during grief IS the real reconnection (see the doc above
      // GREYSCALE_ROSTER). Family is excluded — Dad/Mom's own arcs above
      // already cover them, and neither is in the roster anyway.
      if (!def.isFamily) markReconnected(def.id);
      return;
    }

    // Shared by both a threshold step and a goal step below: the
    // completeLine, the learned-once toast, and advancing a `missions`
    // chain (with its mastery bonus on the very last step) all work the
    // same way regardless of how the step got earned.
    function completeMissionStep() {
      if (!story.learned[ch.key]) {
        story.learned[ch.key] = true;
        showToast(ch.learnedMessage || ('You learned ' + ch.key + '!'), 2800);
        sfxInstrumentLearned(ch.key);
      }
      // Any real forward progress with this mentor — a new step, not just
      // repeating one already done — is "their next real interaction" for
      // the greyscale system. See markReconnected() above.
      markReconnected(def.id);
      // A music challenge points its `link` at the Circle of Fifths so you
      // can go practice what the teacher just taught; a challenge with no
      // matching tool (e.g. the research bench) just omits `link`.
      openDialogue(ch.completeLine, def.name, ch.link || null, npc.obj);
      if (missionIdx >= 0) {
        story.missionStep[def.id] = missionIdx + 1;
        if (story.missionStep[def.id] >= def.missions.length) {
          story.communityRespect[world.id] = (story.communityRespect[world.id] || 0) + MISSION_MASTERY_REPUTATION;
          renderStats();
          if (def.instrumentSting) sfxInstrumentLearned(def.instrumentSting);
        }
      }
    }

    // A `goal` step earns nothing for talking, ever — see the doc comment
    // above LEVELS. Talking just explains the task (introLine) and opens
    // the tool; the postMessage listener below is what actually sets
    // story.goalDone[ch.key], the moment the tool itself verifies you did
    // the specific thing, not just visited.
    if (ch.goal) {
      if (story.goalDone[ch.key]) {
        if (!story.learned[ch.key]) story.respect[ch.key] = (story.respect[ch.key] || 0) + 1;
        completeMissionStep();
        return;
      }
      openDialogue(ch.introLine, def.name, {
        href: ch.goal.href,
        label: ch.goal.linkLabel || 'Open the tool →',
        frame: { tool: ch.goal.tool, id: ch.goal.id }
      }, npc.obj);
      return;
    }

    var have = story.respect[ch.key] || 0;
    if (have >= ch.threshold) {
      completeMissionStep();
      return;
    }

    story.respect[ch.key] = have + 1;
    var line = ch.progressLines[Math.min(have, ch.progressLines.length - 1)];
    openDialogue(line, def.name, null, npc.obj);
    showToast('Respect: ' + (have + 1) + ' / ' + ch.threshold, 1600);
  }

  function handleAction() {
    if (toolFrameOpen) return;
    ensureAudio();
    // choiceOpen is deliberately NOT closed here — a choice only advances
    // via clicking one of its own buttons (see openChoice()), never via
    // the space/E action key, so a pending decision (especially the
    // Devil's) can't be casually dismissed the way a plain dialogue line can.
    if (choiceOpen) return;
    if (carMenuOpen) { closeCarMenu(); return; }
    if (dialogueOpen) { closeDialogue(); return; }

    var car = findNearbyCar();
    if (car) {
      if (story.hasCar) { openCarMenu(); return; }
      var famRespect = familyRespect();
      if (famRespect >= CAR_FAMILY_RESPECT_THRESHOLD) {
        story.hasCar = true;
        openDialogue('Dad tosses you the keys. "Don\'t make us regret this." Mom just smiles.');
        showToast('You can drive now! 🚗 Visit the car anytime to travel between towns.', 2800);
      } else {
        openDialogue('"This old car won\'t start until Mom and Dad trust you behind the wheel." (' + famRespect + ' / ' + CAR_FAMILY_RESPECT_THRESHOLD + ' family respect)');
      }
      return;
    }

    var npc = findNearbyNpc();
    if (npc) { talkToNpc(npc); return; }
    var practiceSpot = findNearbyPracticeSpot();
    if (practiceSpot) { practiceViolin(); return; }
    var sign = findNearbySign();
    if (sign) openDialogue(sign.message);
  }

  // ----------------------------------------------------------------------
  // Begin overlay
  // ----------------------------------------------------------------------
  var started = false;
  document.getElementById('begin-btn').addEventListener('click', function () {
    ensureAudio();
    document.getElementById('start-overlay').classList.add('hidden');
    started = true;
  });

  // ----------------------------------------------------------------------
  // Update loop
  // ----------------------------------------------------------------------
  function inBounds(tx, ty) { return tx >= 0 && ty >= 0 && tx < world.W && ty < world.H; }

  function attemptMove(dir) {
    setFacing(dir);
    if (player.isMoving) return;
    var vec = DIR_VEC[dir];
    var ntx = player.tileX + vec.dx, nty = player.tileY + vec.dz;
    if (!inBounds(ntx, nty) || world.obstacles.has(key(ntx, nty))) { sfxBump(); return; }
    player.from = tileToWorld(player.tileX, player.tileY);
    player.to = tileToWorld(ntx, nty);
    player.tileX = ntx;
    player.tileY = nty;
    player.isMoving = true;
    player.moveElapsed = 0;
  }

  function checkShardPickup() {
    world.features.shards.forEach(function (s) {
      if (s.collected) return;
      if (s.x === player.tileX && s.y === player.tileY) {
        s.collected = true;
        s.obj.visible = false;
        world.shardsCollected++;
        renderShardCount();
        sfxPickup();
        if (world.shardsCollected === world.maxShards) {
          setTimeout(function () { showToast('✦ Every Light Shard is found — the grove is at peace ✦', 3600); sfxWin(); }, 150);
        } else {
          showToast('Light Shard found! (' + world.shardsCollected + ' / ' + world.maxShards + ')', 1600);
        }
      }
    });
  }

  var CROP_LABELS = {
    carrot: { name: 'Carrot', emoji: '🥕' },
    potato: { name: 'Potato', emoji: '🥔' },
    corn: { name: 'Corn', emoji: '🌽' },
    basket: { name: 'Basket', emoji: '🧺' },
    seedrow: { name: 'Row planted', emoji: '🌱' },
    crate: { name: 'Crate', emoji: '📦' }
  };

  // Vegetable tiles ('vegetable' item — carrot/potato/corn `kind`s) regrow
  // in place, timed off the same clock as update() — see
  // updateCropRespawns(). Everything else a job harvests (basket/crate/
  // seedrow) still only comes back on the next loadLevel(), since nothing
  // in the story lets you speed THEM up.
  var FIELD_REGROW_SLOW = 40;
  var FIELD_REGROW_FAST = 15;

  // A job's harvest requirement, picked up the same way a shard is —
  // walk onto the tile. Unlike shards these feed story.produce (global,
  // persists across level loads) rather than a per-level puzzle count.
  function checkCropPickup(t) {
    world.features.crops.forEach(function (c) {
      if (c.collected) return;
      if (c.x === player.tileX && c.y === player.tileY) {
        c.collected = true;
        c.obj.visible = false;
        if (c.item === 'vegetable') {
          c.respawnAt = t + (story.fieldSeedsPlanted ? FIELD_REGROW_FAST : FIELD_REGROW_SLOW);
        }
        story.produce[c.item] = (story.produce[c.item] || 0) + 1;
        sfxPickup();
        var label = CROP_LABELS[c.kind || c.item] || { name: c.item, emoji: '' };
        showToast(label.emoji + ' ' + label.name + ' (' + story.produce[c.item] + ')', 1200);
      }
    });
  }

  // Brings a picked vegetable tile back once its respawnAt clears — the
  // ONLY crop kind that regrows in place; see checkCropPickup() and
  // FIELD_REGROW_FAST/SLOW.
  function updateCropRespawns(t) {
    world.features.crops.forEach(function (c) {
      if (!c.collected || c.item !== 'vegetable' || c.respawnAt === undefined) return;
      if (t >= c.respawnAt) {
        c.collected = false;
        c.respawnAt = undefined;
        if (c.obj) c.obj.visible = true;
      }
    });
  }

  // Keep in sync with Farmer Jono's job.trust.need (Clearing level) — this
  // is the same "does he trust you yet" bar, just enforced on the gate
  // into his field instead of on talking to him.
  var FIELD_ENTRY_RESPECT = 2;

  // The very first room is locked from the inside: the story doesn't
  // start until you've heard both parents out, at least once each — see
  // Dad's and Mom's `isFamily` dialogue and checkPortal() below. Respect
  // never decreases once earned, so this is a one-time gate, not
  // something that can re-lock later — exactly like FIELD_ENTRY_RESPECT.
  function homeUnlocked() {
    return (story.respect.dad || 0) >= 1 && (story.respect.mom || 0) >= 1;
  }

  function checkPortal() {
    var portals = world.features.portals;
    for (var i = 0; i < portals.length; i++) {
      var p = portals[i];
      if (p.x === player.tileX && p.y === player.tileY) {
        if (p.to === 'field' && (story.respect.farmer_jono || 0) < FIELD_ENTRY_RESPECT) {
          showToast("The field's fenced off — Farmer Jono hasn't said you can go in yet.", 2200);
          return;
        }
        if (world.id === 'home' && p.to !== 'home' && !homeUnlocked()) {
          showToast("You're not going anywhere until you've heard both of them out.", 2200);
          return;
        }
        var destIndex = LEVEL_INDEX[p.to];
        if (destIndex !== undefined) {
          sfxPortal();
          loadLevel(destIndex, p.spawn);
        }
        return;
      }
    }
  }

  var clock = new THREE.Clock();

  function update() {
    var dt = Math.min(clock.getDelta(), 0.05);
    var t = clock.elapsedTime;

    if (started) {
      if (player.isMoving) {
        player.moveElapsed += dt;
        var frac = Math.min(1, player.moveElapsed / MOVE_DURATION);
        player.obj.position.x = player.from.x + (player.to.x - player.from.x) * frac;
        player.obj.position.z = player.from.z + (player.to.z - player.from.z) * frac;
        player.obj.position.y = Math.sin(frac * Math.PI) * 0.16;
        if (player.obj.userData.legL) {
          var swing = Math.sin(frac * Math.PI * 2) * 0.5;
          player.obj.userData.legL.rotation.x = swing;
          player.obj.userData.legR.rotation.x = -swing;
        }
        if (frac >= 1) {
          player.isMoving = false;
          player.obj.position.y = 0;
          if (player.obj.userData.legL) {
            player.obj.userData.legL.rotation.x = 0;
            player.obj.userData.legR.rotation.x = 0;
          }
          checkShardPickup();
          checkCropPickup(t);
          checkPortal();
        }
      } else if (!dialogueOpen && !carMenuOpen && !toolFrameOpen && !choiceOpen) {
        var dir = pressedDirs[pressedDirs.length - 1];
        if (dir) attemptMove(dir);
        var breathe = 1 + Math.sin(t * 2.4) * 0.015;
        player.obj.userData.pivot.scale.set(1, breathe, 1);
      }

      updateCropRespawns(t);
      world.waterTiles.forEach(function (wt) {
        wt.mesh.position.y = wt.baseY + Math.sin(t * 1.6 + wt.phase) * 0.03;
      });
      world.features.shards.forEach(function (s) {
        if (s.collected || !s.obj) return;
        s.obj.userData.spin.rotation.y = t * 1.6;
        s.obj.userData.spin.position.y = 0.55 + Math.sin(t * 2.2) * 0.08;
      });
      world.features.portals.forEach(function (p) {
        if (!p.obj) return;
        p.obj.userData.bob.position.y = 0.58 + Math.sin(t * 3 + p.x) * 0.06;
      });
      world.features.npcs.forEach(function (n) {
        if (!n.obj) return;
        var breathe = 1 + Math.sin(t * 1.8 + n.obj.userData.idlePhase) * 0.012;
        n.obj.userData.pivot.scale.set(1, breathe, 1);
        // One-shot "speak wiggle" — see triggerSpeakWiggle()'s doc comment.
        // Two quick bounces of Boy's own hop shape (abs(sin), always an
        // upward bounce, never inverted), fading out across the duration
        // so it reads as a quick reaction rather than a repeating loop.
        if (n.obj.userData.wiggleAt != null) {
          var wiggleElapsed = t - n.obj.userData.wiggleAt;
          if (wiggleElapsed < WIGGLE_DURATION) {
            var wiggleFrac = wiggleElapsed / WIGGLE_DURATION;
            n.obj.position.y = Math.abs(Math.sin(wiggleFrac * WIGGLE_BOUNCES * Math.PI)) * WIGGLE_AMPLITUDE * (1 - wiggleFrac);
          } else {
            n.obj.position.y = 0;
            n.obj.userData.wiggleAt = null;
          }
        }
      });

      var desiredCamPos = player.obj.position.clone().add(camOffset);
      camera.position.lerp(desiredCamPos, 1 - Math.pow(0.0008, dt));
      var lookTarget = player.obj.position.clone().add(camLookAhead);
      camera.lookAt(player.obj.position.clone().add(new THREE.Vector3(0, 0.6, 0)).lerp(lookTarget, 1));
    }

    renderer.render(scene, camera);
    requestAnimationFrame(update);
  }

  // A save link (see applySaveFromHash() above) starts Boy at whatever
  // level it names instead of Home, at that level's own default spawn
  // tile — the resume point is "which level," never an exact position.
  var savedLevelId = applySaveFromHash();
  if (savedLevelId !== null) player.obj.scale.setScalar(growthScaleForChapter(story.chapter));
  loadLevel((savedLevelId !== null && LEVEL_INDEX.hasOwnProperty(savedLevelId)) ? LEVEL_INDEX[savedLevelId] : 0);
  requestAnimationFrame(update);
})();
</script>
</body>
</html>
