  // Purely decorative background figures for crowded places (School,
  // College) — no dialogue, no story.respect id, never affects gameplay.
  // Randomized only among pawn/bishop/rook; King/Queen are reserved for
  // named/special characters (see the '%' map symbol in parseLevel()).
  var CROWD_PIECE_TYPES = ['pawn', 'bishop', 'rook'];
  var CROWD_TOP_COLORS = [0x4b5566, 0x6b2338, 0x6f7d4a, 0x3f6b6b, 0x8a6a4a, 0x2a4a3a, 0xc9a84a, 0x5a4a35, 0x3a6b52, 0xe4e8ea];
  var CROWD_BOTTOM_COLORS = [0x2a2730, 0x2a2a30, 0x4a3a28, 0x1f2a2a, 0x5a4a35, 0x3a2a35];
  var CROWD_HAIR_COLORS = [0x3a2a22, 0x2a2018, 0x8a6a3a, 0xb8b8b8, 0x4a2f22, 0xd8d0b0, 0x6a6a6a];
  var CROWD_SKIN_COLORS = [SKIN_LIGHT, SKIN_BROWN, 0xf0d0a8, 0x8a5a3a];
  var CROWD_HAIR_STYLES = ['short', 'long', 'balding', 'full', 'tied_back'];
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function randomCrowdAppearance() {
    return {
      pieceType: pick(CROWD_PIECE_TYPES),
      top: pick(CROWD_TOP_COLORS),
      bottom: pick(CROWD_BOTTOM_COLORS),
      hair: pick(CROWD_HAIR_COLORS),
      skin: pick(CROWD_SKIN_COLORS),
      hairStyle: pick(CROWD_HAIR_STYLES),
      skirt: Math.random() < 0.5
    };
  }

  function blendColor(a, b, t) {
    var ca = new THREE.Color(a), cb = new THREE.Color(b);
    return ca.lerp(cb, t == null ? 0.5 : t).getHex();
  }

  // Hair styles — 'short'/'long' are the original two; 'balding', 'full',
  // 'tied_back', and 'bald' are ported from the Character Gallery workshop.
  // Every partial-sphere style is positioned RELATIVE to headY (not a bare
  // hardcoded Y) so it sits flush on both standing (headY 1.28) and
  // bedridden (headY 0.38) heads. A thin hair/skin-blended seam ring
  // (TorusGeometry, whose tube is naturally rounded) is layered along the
  // sharpest boundary of each style — the crown line for 'balding' and the
  // hairline for 'short'/'long'/'full' — so the edge reads as a soft
  // hairline instead of a jagged two-tone polygon cutoff; 'balding' also
  // gets two small blended temple caps to round off its horseshoe-gap
  // corners, the other sharp edge that a plain ring doesn't cover.
  function buildHair(headRadius, hairColor, style, isChess, headY, skinColor) {
    var mat = new THREE.MeshStandardMaterial({ color: hairColor, roughness: 0.7 });
    var seamColor = blendColor(hairColor, skinColor || SKIN_LIGHT, 0.5);
    var seamMat = new THREE.MeshStandardMaterial({ color: seamColor, roughness: 0.7 });
    var longOff = isChess ? 0.014 : 0.02;
    var shortOff = isChess ? 0.008 : 0.01;
    if (style === 'bald') {
      return new THREE.Group();
    }
    if (style === 'balding') {
      var frontGapDeg = 100;
      var phiStart = (90 + frontGapDeg / 2) * Math.PI / 180;
      var phiLength = (360 - frontGapDeg) * Math.PI / 180;
      var g = new THREE.Group();
      var ring = new THREE.Mesh(new THREE.SphereGeometry(headRadius + shortOff, 14, 12, phiStart, phiLength, Math.PI * 0.35, Math.PI * 0.55), mat);
      ring.position.y = headY;
      g.add(ring);
      // Crown-line seam: a full torus at the band's top edge reads fine even
      // though the band itself has a front gap — the gap is far enough
      // toward the face that the torus's blended color there just looks
      // like skin peeking through, not a visible ring across the forehead.
      var crownR = (headRadius + shortOff) * Math.sin(Math.PI * 0.35);
      var crownY = headY + (headRadius + shortOff) * Math.cos(Math.PI * 0.35);
      var crownSeam = new THREE.Mesh(new THREE.TorusGeometry(Math.max(crownR, 0.01), headRadius * 0.09, 8, 16), seamMat);
      crownSeam.position.y = crownY;
      crownSeam.rotation.x = Math.PI / 2;
      g.add(crownSeam);
      // Round the two temple corners where the horseshoe's phi gap meets
      // its theta band — a small blended cap at each end softens what
      // would otherwise be a sharp rectangular corner.
      [phiStart, phiStart + phiLength].forEach(function (phi) {
        var midTheta = Math.PI * (0.35 + 0.55 / 2);
        var cap = new THREE.Mesh(new THREE.SphereGeometry(headRadius * 0.16, 8, 8), seamMat);
        cap.position.set(
          (headRadius + shortOff) * Math.sin(midTheta) * Math.cos(phi),
          headY + (headRadius + shortOff) * Math.cos(midTheta),
          (headRadius + shortOff) * Math.sin(midTheta) * Math.sin(phi)
        );
        g.add(cap);
      });
      return g;
    }
    if (style === 'full') {
      var g2 = new THREE.Group();
      var full = new THREE.Mesh(new THREE.SphereGeometry(headRadius + longOff, 14, 12, 0, Math.PI * 2, 0, Math.PI * 0.85), mat);
      full.position.y = headY;
      g2.add(full);
      var fR = (headRadius + longOff) * Math.sin(Math.PI * 0.85);
      var fY = headY + (headRadius + longOff) * Math.cos(Math.PI * 0.85);
      var fSeam = new THREE.Mesh(new THREE.TorusGeometry(Math.max(fR, 0.01), headRadius * 0.08, 8, 16), seamMat);
      fSeam.position.y = fY;
      fSeam.rotation.x = Math.PI / 2;
      g2.add(fSeam);
      return g2;
    }
    if (style === 'tied_back') {
      var g3 = new THREE.Group();
      var capRadius = headRadius + longOff;
      var cap = new THREE.Mesh(new THREE.SphereGeometry(capRadius, 14, 12, 0, Math.PI * 2, 0, Math.PI * 0.85), mat);
      cap.position.y = headY;
      g3.add(cap);
      var tR = capRadius * Math.sin(Math.PI * 0.85);
      var tY = headY + capRadius * Math.cos(Math.PI * 0.85);
      var tSeam = new THREE.Mesh(new THREE.TorusGeometry(Math.max(tR, 0.01), headRadius * 0.08, 8, 16), seamMat);
      tSeam.position.y = tY;
      tSeam.rotation.x = Math.PI / 2;
      g3.add(tSeam);
      var bunRadius = headRadius * 0.5;
      var attach = capRadius + bunRadius * 0.6;
      var bun = new THREE.Mesh(new THREE.SphereGeometry(bunRadius, 10, 10), mat);
      bun.position.set(0, headY - attach * 0.301, -attach * 0.954);
      g3.add(bun);
      return g3;
    }
    if (style === 'long') {
      var g4 = new THREE.Group();
      var longHair = new THREE.Mesh(new THREE.SphereGeometry(headRadius + longOff, 14, 12, 0, Math.PI * 2, 0, Math.PI * 0.8), mat);
      longHair.position.y = headY - 0.04;
      g4.add(longHair);
      var lR = (headRadius + longOff) * Math.sin(Math.PI * 0.8);
      var lY = headY - 0.04 + (headRadius + longOff) * Math.cos(Math.PI * 0.8);
      var lSeam = new THREE.Mesh(new THREE.TorusGeometry(Math.max(lR, 0.01), headRadius * 0.08, 8, 16), seamMat);
      lSeam.position.y = lY;
      lSeam.rotation.x = Math.PI / 2;
      g4.add(lSeam);
      return g4;
    }
    var g5 = new THREE.Group();
    var shortHair = new THREE.Mesh(new THREE.SphereGeometry(headRadius + shortOff, 14, 12, 0, Math.PI * 2, 0, Math.PI * 0.55), mat);
    shortHair.position.y = headY + 0.04;
    g5.add(shortHair);
    var sR = (headRadius + shortOff) * Math.sin(Math.PI * 0.55);
    var sY = headY + 0.04 + (headRadius + shortOff) * Math.cos(Math.PI * 0.55);
    var sSeam = new THREE.Mesh(new THREE.TorusGeometry(Math.max(sR, 0.01), headRadius * 0.07, 8, 16), seamMat);
    sSeam.position.y = sY;
    sSeam.rotation.x = Math.PI / 2;
    g5.add(sSeam);
    return g5;
  }

  // Devil-style horns — REPLACES the normal piece topper (see createHuman())
  // rather than adding to it; opt in via appearance.horns: true.
  // Horn angle is a fixed design rule, not a per-character choice: each
  // horn tilts OUTWARD from vertical by exactly 45° — like the 😈 emoji,
  // diverging as they rise, never converging toward each other — halfway
  // between straight up (0°, the most "inward" — i.e. no divergence at
  // all — two horns can go) and fully horizontal (90°, the ceiling this
  // must never exceed), on the Devil or any future horned character,
  // since this is the one shared builder every appearance.horns: true
  // character uses. A pure Z-axis rotation (no added forward/backward
  // tilt) keeps that angle exact and verifiable rather than an eyeballed
  // compound one.
  //
  // Sign matters here, not just magnitude: rotating a cone that points
  // +Y by rotation.z = +θ swings its tip toward -X (see THREE's standard
  // 2D rotation — x' = -y sinθ). The right horn (side=+1) sits at +X, so
  // it needs rotation.z = -θ to swing its tip further +X (away from
  // center, outward); by symmetry the left horn (side=-1) needs +θ. That
  // pattern is exactly `-side * HORN_ANGLE` — `side * HORN_ANGLE` (the
  // first version) swings each horn's tip toward the OTHER horn instead,
  // which reads as horns curling inward/together rather than the 😈
  // shape they're meant to be.
  var HORN_ANGLE = Math.PI / 4; // 45°, per the rule above — must stay <= Math.PI / 2 (90°)
  function buildHorns(color) {
    var g = new THREE.Group();
    var mat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.5 });
    [-1, 1].forEach(function (side) {
      var horn = new THREE.Mesh(new THREE.ConeGeometry(0.045, 0.34, 8), mat);
      horn.position.set(side * 0.1, 0.15, -0.03);
      horn.rotation.z = -side * HORN_ANGLE;
      horn.castShadow = true;
      g.add(horn);
    });
    return g;
  }

  // Devil-style tail — an ADD, not a replacement (unlike horns, which
  // replace the topper): every Hell resident is a demon, so every one of
  // them gets a tail regardless of what piece type or topper they
  // otherwise have. Opt-in via appearance.tail: true, applied to every
  // Hell NPC's appearance by convention (not hardcoded to the level —
  // createHuman() has no idea what level it's rendering into), the same
  // way appearance.horns is opt-in per-character rather than automatic.
  //
  // One clean curled hook, not a jointed/segmented tail — a single
  // partial TorusGeometry arc with a tapered cone at its open end reads
  // as a tail immediately at this low-poly scale, no separate curve/
  // spline machinery needed. Anchored low and to one side (never
  // mirrored — there's only ever one), which is inherently the
  // asymmetric-silhouette idea the swirl topper above also uses: a
  // single off-center element reads as more alive/organic than anything
  // symmetric on this page.
  function buildTail(color) {
    var g = new THREE.Group();
    var mat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.45 });
    var arc = new THREE.Mesh(new THREE.TorusGeometry(0.09, 0.02, 8, 16, Math.PI * 1.15), mat);
    arc.rotation.y = Math.PI / 2;
    arc.rotation.z = 0.5;
    arc.position.set(0.2, 0.14, -0.02);
    arc.castShadow = true;
    g.add(arc);
    var tip = new THREE.Mesh(new THREE.ConeGeometry(0.026, 0.09, 8), mat);
    tip.position.set(0.2, 0.235, -0.09);
    tip.rotation.set(-0.9, 0, 0.5);
    tip.castShadow = true;
    g.add(tip);
    return g;
  }

  // ------------------------------------------------------------------
  // Small worn accessories — greyscale-recognition pass: every main
  // character except Boy/Dad/Mom (unchanged) and whoever already had a
  // distinct feature (Sir Earth's tie-dye, Liz's flower crown, Dr. Voss's
  // swirl topper, the Devil's horns/tail) now gets exactly one real,
  // role-tied SHAPE — never just a different color, since color is
  // exactly what applyColorFactor() washes out under Grief's greyscale.
  // Each is an unconditional ADD in createHuman() below, same pattern as
  // buildTail() above — never competing with the horns/crown/topper slot.
  // ------------------------------------------------------------------

  // Connects two points with a cylinder of the given radius — precise by
  // construction (length and orientation both derived from the two points
  // themselves) rather than hand-picked rotation.x/z, which is exactly
  // how a diagonal strap or tube ends up not actually reaching both ends.
  function cylinderBetween(p1, p2, radius, mat) {
    var dir = new THREE.Vector3().subVectors(p2, p1);
    var mesh = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, dir.length(), 8), mat);
    mesh.position.copy(p1).addScaledVector(dir, 0.5);
    mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
    return mesh;
  }

  // A thick workman's belt with a square buckle, sized to sit just
  // outside a rook body's constant 0.24 radius. Opt-in via
  // appearance.belt: true; given to Farmer Jono (fieldwork).
  function buildBelt(color) {
    var g = new THREE.Group();
    var mat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.6 });
    var band = new THREE.Mesh(new THREE.TorusGeometry(0.275, 0.022, 8, 16), mat);
    band.rotation.x = Math.PI / 2;
    band.position.y = 0.75;
    g.add(band);
    var buckle = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.05, 0.02), mat);
    buckle.position.set(0, 0.75, 0.29);
    g.add(buckle);
    return g;
  }

  // Small hoop earrings flanking the head — the one personal-touch
  // accessory in this pass rather than a role-tied prop. Opt-in via
  // appearance.earrings: true; given to Elsie (the one main female-
  // presenting NPC without a role-topper of her own).
  function buildEarrings(color) {
    var g = new THREE.Group();
    var mat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.3, metalness: 0.5 });
    [-1, 1].forEach(function (side) {
      var hoop = new THREE.Mesh(new THREE.TorusGeometry(0.022, 0.006, 6, 10), mat);
      hoop.position.set(side * 0.17, 1.22, 0.08);
      g.add(hoop);
    });
    return g;
  }

  // A simple kept pendant on a cord, spanning the gap between a pawn's
  // collar and its (fixed-height) head — a real cord (cylinderBetween,
  // not two shapes left to float near each other) so it reads as one
  // worn item, not floating debris. Something cared-for, not
  // utilitarian. Opt-in via appearance.necklace: true; given to Milo
  // (hungry_kid), the kindness-arc recipient.
  function buildNecklace(color) {
    var g = new THREE.Group();
    var mat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.4, metalness: 0.3 });
    var neckY = 1.14;
    var pendantPos = new THREE.Vector3(0, 0.97, 0.05);
    var loop = new THREE.Mesh(new THREE.TorusGeometry(0.09, 0.012, 8, 16), mat);
    loop.rotation.x = Math.PI / 2;
    loop.position.set(0, neckY, 0);
    g.add(loop);
    g.add(cylinderBetween(new THREE.Vector3(0, neckY, 0.09), pendantPos, 0.01, mat));
    var pendant = new THREE.Mesh(new THREE.OctahedronGeometry(0.04), mat);
    pendant.position.copy(pendantPos);
    g.add(pendant);
    return g;
  }

  // A diagonal guitar-strap sash across the torso, built with
  // cylinderBetween so it actually reaches both the shoulder and the
  // opposite hip rather than a guessed rotation. Opt-in via
  // appearance.sash: true; given to Eric — literally how a guitarist is
  // silhouetted.
  function buildSash(color) {
    var g = new THREE.Group();
    var mat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.55 });
    var shoulder = new THREE.Vector3(-0.13, 0.86, 0.1);
    var hip = new THREE.Vector3(0.13, 0.16, 0.14);
    g.add(cylinderBetween(shoulder, hip, 0.035, mat));
    return g;
  }

  // Round spectacle rings with a bridge, floating just outside the
  // head's own curved surface. Opt-in via appearance.glasses: true;
  // given to Mr. Lester (id: 'wainwright') — scholarly, pattern-obsessed.
  function buildGlasses(color) {
    var g = new THREE.Group();
    var mat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.3, metalness: 0.4 });
    var lensY = 1.29, lensZ = 0.145;
    [-1, 1].forEach(function (side) {
      var lens = new THREE.Mesh(new THREE.TorusGeometry(0.045, 0.008, 8, 12), mat);
      lens.position.set(side * 0.075, lensY, lensZ);
      g.add(lens);
    });
    var bridge = new THREE.Mesh(new THREE.CylinderGeometry(0.006, 0.006, 0.05, 6), mat);
    bridge.rotation.z = Math.PI / 2;
    bridge.position.set(0, lensY, lensZ);
    g.add(bridge);
    return g;
  }

  // A doctor's accessory — real topology, not a decorative
  // approximation: one piece goes around the BACK of the neck, its two
  // ends come down the front and converge into a Y, and ONE tube
  // continues from that join down to a SINGLE round chest piece. Built
  // with cylinderBetween for the same reason as the sash above — a
  // hand-picked rotation is exactly how an earlier draft of this ended
  // up with tubes that never met. Opt-in via appearance.stethoscope:
  // true; given to Nurse Odalys.
  function buildStethoscope(color) {
    var g = new THREE.Group();
    var mat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.35, metalness: 0.25 });
    var neckRadius = 0.165, neckTube = 0.03;
    var arc = Math.PI * 1.5;
    var drape = new THREE.Mesh(new THREE.TorusGeometry(neckRadius, neckTube, 8, 16, arc), mat);
    var neckSpin = -Math.PI / 2 - arc / 2;
    drape.rotation.x = Math.PI / 2;
    drape.rotation.z = neckSpin;
    drape.position.y = 1.09;
    g.add(drape);
    var neckLeft = new THREE.Vector3(neckRadius * Math.cos(neckSpin), 1.09, neckRadius * Math.sin(neckSpin));
    var neckRight = new THREE.Vector3(neckRadius * Math.cos(arc + neckSpin), 1.09, neckRadius * Math.sin(arc + neckSpin));
    var yJoint = new THREE.Vector3(0, 0.90, 0.26);
    var chestCenter = new THREE.Vector3(0, 0.73, 0.30);
    var tubeRadius = 0.026;
    g.add(cylinderBetween(neckLeft, yJoint, tubeRadius, mat));
    g.add(cylinderBetween(neckRight, yJoint, tubeRadius, mat));
    g.add(cylinderBetween(yJoint, chestCenter, tubeRadius, mat));
    var joint = new THREE.Mesh(new THREE.SphereGeometry(tubeRadius * 1.15, 8, 8), mat);
    joint.position.copy(yJoint);
    g.add(joint);
    var chestPiece = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.035, 16), mat);
    chestPiece.rotation.x = Math.PI / 2;
    chestPiece.position.copy(chestCenter);
    g.add(chestPiece);
    return g;
  }

  // A bed, not a body — swapped in wherever `appearance.bedridden: true` is
  // set (see createHuman() below and the doc above LEVELS). Self-contained:
  // the bed frame is part of the returned group, so it can drop into
  // whichever tile the standing version used to occupy with no map changes.
  // Only skin/hair carry over from a normal appearance; pieceType, top,
  // bottom, and every chess-piece-only field are irrelevant lying down.
  function createBedriddenHuman(opts) {
    opts = opts || {};
    var skinColor = opts.skin || SKIN_LIGHT;
    var hairColor = opts.hair || 0x3a2a22;
    var g = new THREE.Group();

    // Frame and legs sit OUTSIDE the pivot on purpose — the per-frame idle
    // animation in update() scales n.obj.userData.pivot to fake breathing,
    // and a wooden bed frame pulsing along with it would look wrong. Only
    // the patient (blanket/pillow/head/hair) goes in the pivot, same
    // contract createHuman()'s standing figures use.
    var frameMat = new THREE.MeshStandardMaterial({ color: 0x5a4230, roughness: 0.8 });
    var frame = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.16, 0.5), frameMat);
    frame.position.y = 0.22;
    frame.castShadow = true;
    g.add(frame);
    [[-0.38, -0.19], [0.38, -0.19], [-0.38, 0.19], [0.38, 0.19]].forEach(function (p) {
      var leg = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.22, 0.06), frameMat);
      leg.position.set(p[0], 0.11, p[1]);
      g.add(leg);
    });

    var pivot = new THREE.Group();
    g.add(pivot);

    var blanketMat = new THREE.MeshStandardMaterial({ color: 0xd8dde2, roughness: 0.85 });
    var blanket = new THREE.Mesh(new THREE.CapsuleGeometry(0.16, 0.5, 4, 8), blanketMat);
    blanket.rotation.z = Math.PI / 2;
    blanket.position.set(-0.05, 0.36, 0);
    blanket.castShadow = true;
    pivot.add(blanket);

    var pillowMat = new THREE.MeshStandardMaterial({ color: 0xf3efe6, roughness: 0.8 });
    var pillow = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.08, 0.32), pillowMat);
    pillow.position.set(0.34, 0.34, 0);
    pivot.add(pillow);

    var head = new THREE.Mesh(new THREE.SphereGeometry(0.14, 14, 12), new THREE.MeshStandardMaterial({ color: skinColor, roughness: 0.6 }));
    head.position.set(0.4, 0.38, 0);
    head.castShadow = true;
    pivot.add(head);

    var hair = buildHair(0.14, hairColor, opts.hairStyle, false, 0.38, skinColor);
    hair.position.x = 0.4;
    hair.position.z = 0;
    pivot.add(hair);

    g.userData = { pivot: pivot, idlePhase: rand(0, Math.PI * 2) };
    return g;
  }

  // Generic adult NPC — same low-poly-diorama vocabulary as the player,
  // but taller proportions and customizable clothing/hair so Mom, Dad, and
  // every future townsperson can share one builder.
  function createHuman(opts) {
    opts = opts || {};
    if (opts.bedridden) return createBedriddenHuman(opts);
    var skinColor = opts.skin || SKIN_LIGHT;
    var hairColor = opts.hair || 0x3a2a22;
    var topColor = opts.tieDye ? getTieDyeTexture() : (opts.top || 0x6b7a8f);
    var bottomColor = opts.bottom || 0x2e2a35;

    var g = new THREE.Group();
    var pivot = new THREE.Group();
    g.add(pivot);

    var isChess = CHARACTER_STYLE === 'chess';
    if (isChess) {
      var pieceType = opts.pieceType || 'pawn';
      var pieceBuilder = PIECE_BODY_BUILDERS[pieceType] || createPawnBody;
      pivot.add(pieceBuilder(topColor, bottomColor));
    } else {
      var body = new THREE.Mesh(
        new THREE.CapsuleGeometry(0.27, 0.5, 4, 8),
        new THREE.MeshStandardMaterial({ color: topColor, roughness: 0.7 })
      );
      body.position.y = 0.63;
      body.castShadow = true;
      pivot.add(body);

      if (opts.skirt) {
        var skirt = new THREE.Mesh(new THREE.ConeGeometry(0.3, 0.4, 10), new THREE.MeshStandardMaterial({ color: bottomColor, roughness: 0.75 }));
        skirt.position.y = 0.22;
        skirt.castShadow = true;
        pivot.add(skirt);
      } else {
        var legGeo = new THREE.CylinderGeometry(0.09, 0.09, 0.42, 8);
        var legMat = new THREE.MeshStandardMaterial({ color: bottomColor });
        [-0.13, 0.13].forEach(function (lx) {
          var leg = new THREE.Mesh(legGeo, legMat);
          leg.position.set(lx, 0.21, 0);
          leg.castShadow = true;
          pivot.add(leg);
        });
      }
    }

    // Shrunk well below life-size proportions in chess mode on purpose — a
    // human-sized head on top of a piece-shaped body read as "a person
    // standing on a fancy plinth," not as a chess piece. A small head
    // perched atop a much bigger turned body is the actual piece silhouette
    // (think finial, not head), while still carrying skin tone and hair so
    // family/identity stays legible.
    var headRadius = isChess ? 0.16 : 0.23;
    var head = new THREE.Mesh(new THREE.SphereGeometry(headRadius, 14, 12), new THREE.MeshStandardMaterial({ color: skinColor, roughness: 0.6 }));
    head.position.y = 1.28;
    head.castShadow = true;
    pivot.add(head);

    var hair = buildHair(headRadius, hairColor, opts.hairStyle, isChess, head.position.y, skinColor);
    pivot.add(hair);

    if (isChess) {
      if (opts.horns) {
        var horns = buildHorns(opts.pieceAccent || 0x2a1414);
        horns.position.y = head.position.y + 0.19;
        pivot.add(horns);
      } else {
        var topperBuilder = PIECE_TOPPER_BUILDERS[opts.pieceType];
        if (opts.pieceType === 'queen' && CROWN_STYLE_BUILDERS[opts.crownStyle]) {
          topperBuilder = CROWN_STYLE_BUILDERS[opts.crownStyle];
        } else if (opts.pieceType === 'bishop' && BISHOP_TOPPER_BUILDERS[opts.bishopTopperStyle]) {
          topperBuilder = BISHOP_TOPPER_BUILDERS[opts.bishopTopperStyle];
        } else if (opts.pieceType === 'pawn' && opts.pawnFlair) {
          topperBuilder = buildPawnFlair;
        }
        if (topperBuilder) {
          var topper = topperBuilder(opts.pieceAccent || 0xf0a83c);
          topper.position.y = head.position.y + 0.19;
          pivot.add(topper);
        }
      }
    }

    // Every Hell resident is a demon and gets a tail — see buildTail()'s
    // doc comment. An ADD, independent of whichever branch above ran
    // (horns replace the topper; a tail never does), so a horned King and
    // a plain-topped Pawn can both have one without any special-casing here.
    if (opts.tail) {
      var tail = buildTail(opts.pieceAccent || 0x2a1414);
      pivot.add(tail);
    }

    // Small worn accessories — see the doc block above buildBelt() for
    // why these exist (greyscale recognition) and why each is an
    // unconditional ADD like the tail above, never touching the
    // horns/crown/topper slot.
    if (opts.belt) pivot.add(buildBelt(opts.pieceAccent || 0x3a2a1a));
    if (opts.earrings) pivot.add(buildEarrings(opts.pieceAccent || 0xd8b84a));
    if (opts.necklace) pivot.add(buildNecklace(opts.pieceAccent || 0xc9a84a));
    if (opts.sash) pivot.add(buildSash(opts.pieceAccent || 0x8a3a3a));
    if (opts.glasses) pivot.add(buildGlasses(opts.pieceAccent || 0x2a2018));
    if (opts.stethoscope) pivot.add(buildStethoscope(opts.pieceAccent || 0x232323));

    g.userData = { pivot: pivot, idlePhase: rand(0, Math.PI * 2) };
    return g;
  }

  function createPlayer() {
    var g = new THREE.Group();
    var tunicMat = new THREE.MeshStandardMaterial({ color: 0x2f6fb0, roughness: 0.7 });
    var skinMat = new THREE.MeshStandardMaterial({ color: SKIN_BROWN, roughness: 0.6 });
    var hairMat = new THREE.MeshStandardMaterial({ color: 0x4a2f22, roughness: 0.7 });
    var scarfMat = new THREE.MeshStandardMaterial({ color: 0xd6432f, roughness: 0.6 });

    var pivot = new THREE.Group();
    g.add(pivot);

    var body = null, legL = null, legR = null;
    var isChess = CHARACTER_STYLE === 'chess';

    if (isChess) {
      pivot.add(createPawnBody(0x2f6fb0, 0x3a2a20));
    } else {
      body = new THREE.Mesh(new THREE.CapsuleGeometry(0.26, 0.42, 4, 8), tunicMat);
      body.position.y = 0.5;
      body.castShadow = true;
      pivot.add(body);

      var legGeo = new THREE.CylinderGeometry(0.075, 0.075, 0.34, 8);
      var legMat = new THREE.MeshStandardMaterial({ color: 0x3a2a20 });
      legL = new THREE.Mesh(legGeo, legMat);
      legL.position.set(-0.12, 0.17, 0);
      legL.castShadow = true;
      pivot.add(legL);
      legR = new THREE.Mesh(legGeo, legMat);
      legR.position.set(0.12, 0.17, 0);
      legR.castShadow = true;
      pivot.add(legR);
    }

    // Same shrink-the-head reasoning as createHuman() — see the comment
    // there.
    var playerHeadRadius = isChess ? 0.17 : 0.24;
    var head = new THREE.Mesh(new THREE.SphereGeometry(playerHeadRadius, 14, 12), skinMat);
    head.position.y = 0.98;
    head.castShadow = true;
    pivot.add(head);

    var hair = new THREE.Mesh(new THREE.SphereGeometry(playerHeadRadius + (isChess ? 0.011 : 0.015), 14, 12, 0, Math.PI * 2, 0, Math.PI * 0.62), hairMat);
    hair.position.y = 1.0;
    pivot.add(hair);

    var scarf = new THREE.Mesh(new THREE.TorusGeometry(isChess ? 0.16 : 0.22, isChess ? 0.045 : 0.06, 8, 12), scarfMat);
    scarf.rotation.x = Math.PI / 2;
    scarf.position.y = isChess ? 0.93 : 0.78;
    pivot.add(scarf);

    // Pawn is the smallest, plainest piece by design — no topper. Leg
    // refs stay null in chess mode; the walk-swing animation guards for
    // that and skips itself (a piece doesn't need a leg-cycle to glide).
    g.userData = { pivot: pivot, legL: legL, legR: legR, body: body, head: head };
    return g;
  }

  // ----------------------------------------------------------------------
  // World construction / teardown — turns parsed level data into a Three.js
  // group. This is the only place that touches the scene graph per level.
  // ----------------------------------------------------------------------
  function buildWorldGroup(w) {
    var group = new THREE.Group();
    var waterTiles = [];

    for (var gy = 0; gy < w.H; gy++) {
      for (var gx = 0; gx < w.W; gx++) {
        var ch = w.groundKinds[gy][gx];
        var isPortal = w.exitChars.has(ch);
        var thickness = ch === '~' ? 0.16 : 0.3;
        var color = isPortal ? PORTAL_TILE_COLOR : groundColorFor(ch, w.id);
        var tileMesh = makeTile(color, thickness);
        var pos = worldPos(w, gx, gy);
        tileMesh.position.set(pos.x, thickness / -2 + (ch === '~' ? 0.02 : GROUND_SURFACE_Y), pos.z);
        group.add(tileMesh);
        if (ch === '~') waterTiles.push({ mesh: tileMesh, phase: rand(0, Math.PI * 2), baseY: tileMesh.position.y });
      }
    }

    function place(list, builder) {
      list.forEach(function (f) {
        var p = worldPos(w, f.x, f.y);
        var obj = builder(f);
        obj.position.x += p.x;
        obj.position.z += p.z;
        group.add(obj);
        f.obj = obj;
      });
    }

    // An INTERIOR_THEMES level swaps the outdoor tree ring and rock
    // decorations for plain walls/furniture in its own palette, and drops
    // flowers entirely — none of that reads as "indoors" otherwise. A
    // theme with a `glow` field (see Hell/Studio below) swaps the rock
    // spots for an emissive fire/panel prop instead, each with a real
    // PointLight nested right inside its own returned group — since that
    // group is what place() positions, the light arrives at the correct
    // world position for free, no separate light-placement pass needed.
    var interiorTheme = INTERIOR_THEMES[w.id];
    place(w.features.trees, interiorTheme ? function () { return createInteriorWall(interiorTheme.wall); } : createTree);
    place(w.features.rocks, interiorTheme ? function () {
      if (!interiorTheme.glow) return createInteriorProp(interiorTheme.prop);
      var glowGroup = interiorTheme.glow.prop === 'panel' ? createGlowPanel(interiorTheme.glow.color) : createFire();
      var light = new THREE.PointLight(interiorTheme.glow.color, 2.4, 4.2, 2);
      light.position.y = 0.4;
      glowGroup.add(light);
      return glowGroup;
    } : createRock);
    place(w.features.bushes, createBush);
    if (!interiorTheme) place(w.features.flowers, createFlower);
    place(w.features.signs, createSignPost);
    place(w.features.portals, createPortalMarker);

    if (w.features.houseTiles.length) {
      var hMinX = Math.min.apply(null, w.features.houseTiles.map(function (t) { return t.x; }));
      var hMaxX = Math.max.apply(null, w.features.houseTiles.map(function (t) { return t.x; }));
      var hMinY = Math.min.apply(null, w.features.houseTiles.map(function (t) { return t.y; }));
      var hMaxY = Math.max.apply(null, w.features.houseTiles.map(function (t) { return t.y; }));
      var hc1 = worldPos(w, hMinX, hMinY), hc2 = worldPos(w, hMaxX, hMaxY);
      var house = createHouse(w.features.houseTiles, w.id === 'hospital' ? 'clinical' : undefined);
      house.position.set((hc1.x + hc2.x) / 2, 0, (hc1.z + hc2.z) / 2);
      group.add(house);
    }

    place(w.features.shards, createShard);
    place(w.features.crops, function (f) { return createCrop(f.kind || f.item); });
    place(w.features.practiceSpots, createPracticeSpot);

    w.features.npcs.forEach(function (n) {
      var p = worldPos(w, n.x, n.y);
      // appearanceDuring (see the doc above LEVELS) lets one NPC def look
      // different across the chapters it's present for — e.g. Dad standing,
      // then bedridden — without splitting into a second map tile.
      var appearance = (n.def.appearanceDuring && n.def.appearanceDuring[story.chapter]) || n.def.appearance;
      var obj = createHuman(appearance);
      obj.position.set(p.x, 0, p.z);
      // Eric grows up alongside Boy — see growthScaleForChapter()'s doc.
      // Every other NPC stays whatever size their body/topper already imply.
      if (n.def.id === 'eric') obj.scale.setScalar(growthScaleForChapter(story.chapter));
      group.add(obj);
      n.obj = obj;
    });

    // Decorative background crowd (School/College) — see randomCrowdAppearance()
    // and the '%' map symbol above. Re-rolled fresh every time the level
    // loads; "roughly Boy-sized" means matching Boy's CURRENT growth scale,
    // not a fixed size, since Boy himself grows across the story.
    w.features.crowd.forEach(function (spot) {
      var p = worldPos(w, spot.x, spot.y);
      var obj = createHuman(randomCrowdAppearance());
      obj.position.set(p.x, 0, p.z);
      obj.scale.setScalar(growthScaleForChapter(story.chapter));
      obj.rotation.y = pick([0, Math.PI / 2, Math.PI, -Math.PI / 2]);
      group.add(obj);
    });

    if (w.features.car) {
      var carPos = worldPos(w, w.features.car.x, w.features.car.y);
      var carObj = createCar();
      carObj.position.set(carPos.x, 0, carPos.z);
      group.add(carObj);
      w.features.car.obj = carObj;
    }

    return { group: group, waterTiles: waterTiles };
  }

  function disposeGroup(group) {
    group.traverse(function (obj) {
      if (obj.isMesh) {
        if (obj.geometry) obj.geometry.dispose();
        if (obj.material) {
          if (Array.isArray(obj.material)) obj.material.forEach(function (m) { m.dispose(); });
          else obj.material.dispose();
        }
      }
    });
  }

  // ----------------------------------------------------------------------
  // Grief's greyscale, applied to real materials rather than a screen-space
  // filter — every prop/ground/NPC in this game is already just a
  // MeshStandardMaterial with a flat color (or, for Sir Earth's tie-dye,
  // a texture tinted through .color), so desaturating in place needs no
  // new rendering pipeline: remember each material's original color once,
  // then blend toward its grey equivalent by however much color the world
  // has earned back. See worldColorFactor()/markReconnected() above.
  // ----------------------------------------------------------------------
  function luminanceGrey(hex) {
    var r = (hex >> 16 & 255) / 255, g = (hex >> 8 & 255) / 255, b = (hex & 255) / 255;
    var v = Math.round((0.2126 * r + 0.7152 * g + 0.0722 * b) * 255);
    return (v << 16) | (v << 8) | v;
  }
  function tagBaseColors(root) {
    root.traverse(function (obj) {
      if (!obj.isMesh || !obj.material) return;
      (Array.isArray(obj.material) ? obj.material : [obj.material]).forEach(function (m) {
        if (m.color && m.userData.baseColor === undefined) m.userData.baseColor = m.color.getHex();
        if (m.emissive && m.userData.baseEmissive === undefined) m.userData.baseEmissive = m.emissive.getHex();
      });
    });
  }
  function applyColorFactor(root, factor) {
    root.traverse(function (obj) {
      if (!obj.isMesh || !obj.material) return;
      (Array.isArray(obj.material) ? obj.material : [obj.material]).forEach(function (m) {
        if (m.userData.baseColor !== undefined) {
          m.color.setHex(m.userData.baseColor).lerp(new THREE.Color(luminanceGrey(m.userData.baseColor)), 1 - factor);
        }
        if (m.userData.baseEmissive !== undefined) {
          m.emissive.setHex(m.userData.baseEmissive).lerp(new THREE.Color(luminanceGrey(m.userData.baseEmissive)), 1 - factor);
        }
      });
    });
  }
  // Re-tints whatever level is CURRENTLY loaded to match the current
  // worldColorFactor() — called once from loadLevel() (a fresh level
  // starts at today's factor) and again from markReconnected() (so
  // reconnecting with someone recolors the world you're standing in
  // immediately, with no level reload needed). Mom, the Devil, and Boy are
  // the three standing exceptions to the shared dial — see the doc above
  // it. Mom/Devil's line here is harmless before 'grief' too: the shared
  // factor is already 1 for everyone then, so forcing them to 1 changes
  // nothing until the world actually starts desaturating.
  function applyWorldColor() {
    if (!world) return;
    var factor = worldColorFactor();
    tagBaseColors(world.group);
    applyColorFactor(world.group, factor);
    world.features.npcs.forEach(function (n) {
      if (n.def.id === 'mom' || n.def.id === 'devil') applyColorFactor(n.obj, 1);
    });
    // Boy's own exception is a hard binary, not a ride on the shared dial —
    // "he's the LAST to return to color" means a distinct reveal the
    // instant 'duty' begins, not whatever the world's factor happens to be
    // at that moment (which could coincidentally already be 1 if every
    // roster member was reconnected with before Mom's own arc finished).
    tagBaseColors(player.obj);
    applyColorFactor(player.obj, story.chapter === 'duty' ? 1 : 0);
  }

  // ----------------------------------------------------------------------
  // Player state
  // ----------------------------------------------------------------------
  var DIR_VEC = { up: { dx: 0, dz: -1 }, down: { dx: 0, dz: 1 }, left: { dx: -1, dz: 0 }, right: { dx: 1, dz: 0 } };
  var DIR_ROT = { down: 0, up: Math.PI, right: Math.PI / 2, left: -Math.PI / 2 };

  // The player's facing direction is remembered independent of movement —
  // set the instant a direction is pressed, not deferred to the next move
  // tick, so even a very quick tap (or a tap+release inside one frame)
  // still turns the character to face that way.
  function setFacing(dir) {
    player.facing = dir;
    player.obj.rotation.y = DIR_ROT[dir];
  }

  var player = {
    obj: createPlayer(),
    tileX: 0,
    tileY: 0,
    facing: 'down',
    isMoving: false,
    moveElapsed: 0,
    from: null,
    to: null
  };

  var MOVE_DURATION = 0.17;

  // A one-shot "speak wiggle" — reuses Boy's own per-tile movement hop
  // shape (position.y = sin(frac * PI) * amplitude, see the walking code
  // in update() below) rather than inventing a new motion, so it reads as
  // "similar to how Boy moves" instead of a generic wobble. Two quick
  // bounces, not one — a single hop reads as a nod, not a wiggle — at a
  // smaller amplitude than Boy's own travel hop, since this NPC isn't
  // going anywhere, just reacting in place. triggerSpeakWiggle() just
  // stamps a start time; update()'s NPC loop (which already runs every
  // frame regardless of dialogueOpen, for the idle-breathing pulse) reads
  // elapsed time off that stamp and stops touching position.y once the
  // duration has passed — no separate "turn it off" bookkeeping needed.
  var WIGGLE_DURATION = 0.32;
  var WIGGLE_BOUNCES = 2;
  var WIGGLE_AMPLITUDE = 0.07;
  function triggerSpeakWiggle(obj) {
    if (!obj) return;
    obj.userData.wiggleAt = clock.elapsedTime;
  }

  // ----------------------------------------------------------------------
  // Camera
  // ----------------------------------------------------------------------
  var camOffset = new THREE.Vector3(0, 10.5, 6.2);
  var camLookAhead = new THREE.Vector3(0, 0.6, -1.1);

  window.addEventListener('resize', function () {
    camera.aspect = root.clientWidth / root.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(root.clientWidth, root.clientHeight);
  });

  // ----------------------------------------------------------------------
  // Level loading — the level-switching engine. loadLevel() is the whole
  // API: tear down the current level's group (if any), build the new one,
  // drop the player at the right spawn tile, and snap the camera/shadow
  // frustum to fit.
  // ----------------------------------------------------------------------
  var world = null;
  var LEVEL_INDEX = {};
  LEVELS.forEach(function (lvl, i) { LEVEL_INDEX[lvl.id] = i; });

  // GOAL_INDEX['<tool>:<goal id>'] -> { key, npcName } — built once from
  // every mission/challenge step with a `goal`, so the postMessage
  // listener below can turn a tool's "I saw you do X" into "which mission
  // key was that for, and whose name goes in the toast." See the `goal`
  // field's doc comment above LEVELS.
  var GOAL_INDEX = {};
  LEVELS.forEach(function (lvl) {
    if (!lvl.npcs) return;
    Object.keys(lvl.npcs).forEach(function (letter) {
      var npc = lvl.npcs[letter];
      var steps = npc.missions || (npc.challenge ? [npc.challenge] : []);
      steps.forEach(function (step) {
        if (step.goal) GOAL_INDEX[step.goal.tool + ':' + step.goal.id] = { key: step.key, npcName: npc.name };
      });
    });
  });

  // A sibling tool running in #tool-frame posts this when the player
  // does the SPECIFIC thing a mission step asked for — never on merely
  // opening the tool. Matched against GOAL_INDEX; story.goalDone[key] is
  // what talkToNpc's `goal` branch actually checks (see there for why
  // this doesn't just complete the step immediately: you still have to
  // go tell the teacher, same as every other mission in this game).
  window.addEventListener('message', function (e) {
    if (!e.data || e.data.source !== 'boy-tool') return;
    var entry = GOAL_INDEX[e.data.tool + ':' + e.data.goal];
    if (!entry || story.goalDone[entry.key]) return;
    story.goalDone[entry.key] = true;
    showToast('✓ Task complete! Go tell ' + entry.npcName + '.', 2600);
    setTimeout(closeToolFrame, 1400);
  });

  function loadLevel(index, spawnOverride) {
    var levelDef = LEVELS[index];
    // First step outside Home, into the village — respect-earning begins.
    if (levelDef.id === 'clearing' && story.chapter === 'childhood') {
      story.chapter = 'earning_respect';
    }
    // A real, checkable "graduated to college" flag — first time this
    // level loads, not a talked-into-existence flag. Gates Mom's own
    // growth-beat below (see her dialogue.earning_respect's last entry).
    if (levelDef.id === 'college') {
      story.learned.visitedCollege = true;
    }
    var newWorld = parseLevel(levelDef);
    var built = buildWorldGroup(newWorld);
    newWorld.group = built.group;
    newWorld.waterTiles = built.waterTiles;
    newWorld.shardsCollected = 0;
    newWorld.maxShards = newWorld.totalShards;

    // Indoors never shows the outdoor sky — swap the background/fog color
    // to this level's own interior tone, or back to SKY_COLOR outdoors.
    // The sky/fog desaturates right along with everything else in grief —
    // see applyWorldColor() below, called once world/player are in place.
    var bgColor = (INTERIOR_THEMES[levelDef.id] || { bg: SKY_COLOR }).bg;
    var bgFactor = worldColorFactor();
    if (bgFactor < 1) bgColor = new THREE.Color(bgColor).lerp(new THREE.Color(luminanceGrey(bgColor)), 1 - bgFactor).getHex();
    scene.background = new THREE.Color(bgColor);
    scene.fog.color.set(bgColor);

    if (world) {
      scene.remove(world.group);
      disposeGroup(world.group);
    }

    world = newWorld;
    scene.add(world.group);
    world.group.add(player.obj);
    applyWorldColor();

    var spawnTile = spawnOverride || world.playerStart;
    player.tileX = spawnTile.x;
    player.tileY = spawnTile.y;
    player.isMoving = false;
    var p = tileToWorld(player.tileX, player.tileY);
    player.obj.position.set(p.x, 0, p.z);

    var shadowSpan = Math.max(world.W, world.H) * TILE * 0.6;
    sun.shadow.camera.left = -shadowSpan;
    sun.shadow.camera.right = shadowSpan;
    sun.shadow.camera.top = shadowSpan;
    sun.shadow.camera.bottom = -shadowSpan;
    sun.shadow.camera.updateProjectionMatrix();

    renderShardCount();
    renderStats();
    dialogueOpen = false;
    closeDialogue();
    closeCarMenu();

    // Snap instantly rather than lerping — panning across the old map on
    // the way to the new one would look broken.
    camera.position.copy(player.obj.position).add(camOffset);
    camera.lookAt(player.obj.position.clone().add(camLookAhead));

    startMusicForLevel(levelDef.id);
    showToast(levelDef.name, 2000);
  }

  // ----------------------------------------------------------------------
  // Audio — tiny synthesized SFX + a per-level 8-bit soundtrack, no
  // external files. Everything routes through masterGain, so one mute
  // toggle (see muted/setMuted() and #mute-btn below) silences both at
  // once — sfxBus and musicBus underneath it exist only to let music sit
  // quieter than sound effects, never to be muted independently.
  // ----------------------------------------------------------------------
  var audioCtx = null, masterGain = null, sfxBus = null, musicBus = null;
  var muted = (function () {
    try { return localStorage.getItem('boy_muted') === '1'; } catch (e) { return false; }
  })();
  function ensureAudio() {
    if (!audioCtx) {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      audioCtx = new Ctx();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = muted ? 0 : 1;
      masterGain.connect(audioCtx.destination);
      sfxBus = audioCtx.createGain();
      sfxBus.gain.value = 1;
      sfxBus.connect(masterGain);
      musicBus = audioCtx.createGain();
      musicBus.gain.value = 0.55;
      musicBus.connect(masterGain);
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    // Music is scheduled independently of any user gesture (see
    // startMusicForLevel), so the very first gesture that unlocks
    // audioCtx also needs to kick the current level's loop off.
    if (!musicState.timer && world) startMusicForLevel(world.id);
  }
  function setMuted(next) {
    muted = next;
    try { localStorage.setItem('boy_muted', muted ? '1' : '0'); } catch (e) {}
    if (masterGain) masterGain.gain.value = muted ? 0 : 1;
    var btn = document.getElementById('mute-btn');
    btn.textContent = muted ? '\u{1F507}' : '\u{1F50A}';
    btn.classList.toggle('muted', muted);
  }
  function tone(freq, start, dur, type, gain, bus) {
    if (!audioCtx) return;
    var osc = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    g.gain.value = 0;
    osc.connect(g);
    g.connect(bus || sfxBus);
    var t0 = audioCtx.currentTime + start;
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(gain || 0.18, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.start(t0);
    osc.stop(t0 + dur + 0.02);
  }
  function sfxPickup() { tone(660, 0, 0.12, 'triangle'); tone(880, 0.07, 0.14, 'triangle'); tone(1180, 0.14, 0.2, 'triangle'); }
  function sfxWin() { [523, 659, 784, 1046].forEach(function (f, i) { tone(f, i * 0.12, 0.28, 'triangle'); }); }
  // Softer than a 'square' wave's buzzy harmonics (which read as an
  // alarm/error at this frequency) and quieter — this plays on every
  // wall bump, easily the most-repeated sfx in the game.
  function sfxBump() { tone(110, 0, 0.07, 'triangle', 0.045); }
  function sfxPortal() { tone(440, 0, 0.14, 'sine', 0.14); tone(660, 0.08, 0.2, 'sine', 0.14); tone(880, 0.16, 0.26, 'sine', 0.12); }

  // A one-shot flourish for the moment a challenge is actually LEARNED
  // (story.learned[ch.key] going true for the first time — see
  // completeMissionStep()), not a loop. The four classic instrument
  // teachers (violin/piano/guitar/flute) each get a motif shaped like
  // their instrument; anything else falls back to the original sfxWin()
  // fanfare, so no learned-moment plays silent.
  var INSTRUMENT_STINGS = {
    violin: { notes: [392.00, 493.88, 587.33, 783.99], wave: 'triangle', step: 0.11, dur: 0.32 },   // G4 B4 D5 G5 — bright ascending arpeggio

  function sfxInstrumentLearned(key) {

  // ---- 8-bit soundtrack ----
  // One looping theme per level, matching that place's vibe — Home warm,
  // Hospital cold and sparse, the Clearing a bright village jig, and each
  // single-teacher level (Hollow/Riverside/Meadow/Schoolhouse/Studio/

  // Julia (id: 'alden') is the one teacher without his own level (he shares the
  // Clearing with Jono/Elsie/Milo) — his motif lives in INSTRUMENT_STINGS
  // above instead of here, played once when the violin is actually learned.
  //
  // A theme is { tempo, wave, pattern }: pattern is a sequence of
  // [melodyNote, bassNoteOrNull, steps] triples, played in a single
  // lockstep loop (both notes of a step start together) — 'R' means rest.
  // tempo is milliseconds per step. Note names are parsed by noteFreq().
  var MUSIC_THEMES = {
    home: {
      tempo: 320, wave: 'triangle',
      pattern: [
        ['F4', 'F3', 2], ['A4', null, 1], ['C5', 'C3', 1],
        ['A4', null, 2], ['F4', 'F3', 1], ['G4', null, 1],
        ['A4', 'Bb2', 2], ['G4', null, 1], ['F4', 'C3', 1]
      ]
    },
    hospital: {
      // No bass at all, long held tones, lots of rest — cold and empty on
      // purpose. wave 'sine' is the plainest, least "alive" timbre we have.
      tempo: 420, wave: 'sine',
      pattern: [
        ['A3', null, 3], ['R', null, 2], ['C4', null, 2], ['R', null, 1],
        ['B3', null, 3], ['R', null, 2], ['A3', null, 3], ['R', null, 3]
      ]
    },
    clearing: {
      tempo: 210, wave: 'square',
      pattern: [
        ['G4', 'G3', 1], ['B4', null, 1], ['D5', 'D3', 1], ['B4', null, 1],
        ['G4', 'G3', 1], ['A4', null, 1], ['B4', 'D3', 1], ['D5', null, 1],
        ['E5', 'G3', 1], ['D5', null, 1], ['B4', 'D3', 1], ['G4', null, 1]
      ]
    },
    field: {
      // Slower and steadier than the Clearing — plodding root-note bass,
      // like working a steady rhythm into the ground.
      tempo: 260, wave: 'triangle',
      pattern: [
        ['D4', 'G2', 2], ['B3', null, 2], ['D4', 'G2', 2], ['G4', null, 2],
        ['E4', 'C3', 2], ['D4', null, 2], ['B3', 'G2', 2], ['D4', null, 2]
      ]
    },
    hollow: {
      // Ms. Whitfield teaches piano here — an arpeggiated, no-bass line
      // (a solo piano, not a band) in a minor key for the cave-like hush.
      tempo: 230, wave: 'triangle',
      pattern: [
        ['D4', null, 1], ['F4', null, 1], ['A4', null, 1], ['D5', null, 1],
        ['C5', null, 1], ['A4', null, 1], ['F4', null, 1], ['A4', null, 1],
        ['Bb3', null, 1], ['D4', null, 1], ['F4', null, 1], ['A4', null, 1],
        ['G4', null, 1], ['F4', null, 1], ['D4', null, 2]
      ]
    },
    riverside: {
      // Eric teaches guitar — a syncopated blues-scale riff with a
      // square-wave "twang".
      tempo: 190, wave: 'square',
      pattern: [
        ['E4', 'E3', 1], ['G4', null, 1], ['E4', null, 1], ['R', null, 1],
        ['A4', 'A2', 1], ['G4', null, 1], ['E4', null, 2],
        ['D4', 'D3', 1], ['E4', null, 1], ['G4', null, 1], ['R', null, 1],
        ['E4', 'E3', 2]
      ]
    },
    meadow: {
      // Sora teaches flute — slow, breathy, wide-interval, no bass at all
      // so it stays airy and open like the field itself.
      tempo: 300, wave: 'sine',
      pattern: [
        ['E4', null, 3], ['G4', null, 2], ['A4', null, 3],
        ['G4', null, 2], ['E4', null, 3], ['D4', null, 3],
        ['C4', null, 4]
      ]
    },
    schoolhouse: {
      // Mr. Lester teaches fractals — the melody is a single 3-note
      // cell (step, step, step) repeated at successively higher
      // transpositions before resolving, echoing self-similarity instead
      // of just being "a cheerful classroom tune."
      tempo: 200, wave: 'square',
      pattern: [
        ['C4', null, 1], ['D4', null, 1], ['E4', null, 1],
        ['F4', null, 1], ['G4', null, 1], ['A4', null, 1],
        ['G4', null, 1], ['A4', null, 1], ['B4', null, 1],
        ['C5', null, 1], ['B4', null, 1], ['C5', null, 2]
      ]
    },
    studio: {
      // Professor Coffee teaches modular synthesis — a fast sawtooth
      // 16th-note arpeggio, the most "electronic sequencer" timbre and
      // rhythm we have on hand.
      tempo: 130, wave: 'sawtooth',
      pattern: [
        ['A4', null, 1], ['C5', null, 1], ['E5', null, 1], ['A5', null, 1],
        ['E5', null, 1], ['C5', null, 1], ['A4', null, 1], ['R', null, 1],
        ['G4', null, 1], ['B4', null, 1], ['D5', null, 1], ['G5', null, 1],
        ['D5', null, 1], ['B4', null, 1], ['G4', null, 1], ['R', null, 1]
      ]
    },
    conservatory: {
      // Sir Earth teaches the Circle of Fifths — so the bass line IS one:
      // A-D-G-C, each root a fifth below the last (the vi-ii-V-I everyone
      // already knows the sound of), with the melody arpeggiating each
      // chord in turn.
      tempo: 260, wave: 'triangle',
      pattern: [
        ['A4', 'A3', 1], ['C5', null, 1], ['E5', null, 1], ['C5', null, 1],
        ['D4', 'D3', 1], ['F4', null, 1], ['A4', null, 1], ['F4', null, 1],
        ['G4', 'G3', 1], ['B4', null, 1], ['D5', null, 1], ['B4', null, 1],
        ['C4', 'C3', 1], ['E4', null, 1], ['G4', null, 1], ['E4', null, 1]
      ]
    }
  };

  // Grief's music — very slow, very sparse, one plain minor descent with
  // more rest than notes. Not a per-level theme: while worldColorFactor()
  // is below 1 (see the greyscale system above buildWorldGroup), this
  // blends against whichever level you're actually standing in instead of
  // replacing it outright — see effectiveMusicTheme() below. Tempo eases
  // back toward that level's own pace as color returns; the melody itself
  // switches at the halfway point rather than crossfading note-by-note,
  // which the simple lockstep sequencer here has no way to do smoothly.
  var GRIEF_THEME = {
    tempo: 420, wave: 'sine',
    pattern: [
      ['A3', 'A2', 2], ['R', null, 2], ['G3', null, 2], ['R', null, 2],
      ['F3', 'F2', 2], ['R', null, 2], ['E3', null, 3], ['R', null, 1]
    ]
  };
  function effectiveMusicTheme(levelId) {
    var base = MUSIC_THEMES[levelId];
    if (!base) return null;
    var factor = worldColorFactor();
    if (factor >= 1) return base;
    return {
      tempo: GRIEF_THEME.tempo + (base.tempo - GRIEF_THEME.tempo) * factor,
      wave: factor < 0.5 ? GRIEF_THEME.wave : base.wave,
      pattern: factor < 0.5 ? GRIEF_THEME.pattern : base.pattern
    };
  }

  var NOTE_SEMITONES = { C: -9, 'C#': -8, D: -7, 'D#': -6, E: -5, F: -4, 'F#': -3, G: -2, 'G#': -1, A: 0, 'A#': 1, Bb: 1, B: 2 };
  function noteFreq(name) {
    var m = /^([A-G][#b]?)(\d)$/.exec(name);
    if (!m) return 0;
    var semitonesFromA4 = NOTE_SEMITONES[m[1]] + (parseInt(m[2], 10) - 4) * 12;
    return 440 * Math.pow(2, semitonesFromA4 / 12);
  }

  var musicState = { levelId: null, stepIndex: 0, timer: null };
  function scheduleNextMusicStep() {
    // Re-evaluated on every single step rather than cached at
    // startMusicForLevel() time — that's what makes the blend track
    // worldColorFactor() live as you reconnect with people, with no
    // separate "music changed" event needed.
    var theme = effectiveMusicTheme(musicState.levelId);
    if (!theme || !audioCtx) { musicState.timer = null; return; }
    var step = theme.pattern[musicState.stepIndex % theme.pattern.length];
    var stepSeconds = (step[2] * theme.tempo) / 1000;
    if (step[0] !== 'R') tone(noteFreq(step[0]), 0, stepSeconds * 0.9, theme.wave, 0.11, musicBus);
    if (step[1]) tone(noteFreq(step[1]) / 2, 0, stepSeconds * 0.9, theme.wave, 0.09, musicBus);
    musicState.stepIndex++;
    musicState.timer = setTimeout(scheduleNextMusicStep, stepSeconds * 1000);
  }
  // Called on every loadLevel() and from ensureAudio() once audio first
  // unlocks — safe to call with no audioCtx yet (it just resets the
  // pointer; ensureAudio() picks the loop back up once it exists).
  function startMusicForLevel(levelId) {
    clearTimeout(musicState.timer);
    musicState.timer = null;
    musicState.levelId = levelId;
    musicState.stepIndex = 0;
    if (audioCtx && MUSIC_THEMES[levelId]) scheduleNextMusicStep();
  }

  var pressedDirs = [];
  var KEY_DIR = { ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right' };
  var KEY_DIR_BY_KEY = { ArrowUp: 'up', w: 'up', W: 'up', ArrowDown: 'down', s: 'down', S: 'down', ArrowLeft: 'left', a: 'left', A: 'left', ArrowRight: 'right', d: 'right', D: 'right' };

  function dirFromEvent(e) { return (e.code && KEY_DIR[e.code]) || KEY_DIR_BY_KEY[e.key]; }
  function isActionKey(e) { return e.code === 'Space' || e.code === 'KeyE' || e.key === ' ' || e.key === 'Spacebar' || e.key === 'e' || e.key === 'E'; }

  function pushDir(dir) {
    var idx = pressedDirs.indexOf(dir);
    if (idx !== -1) pressedDirs.splice(idx, 1);
    pressedDirs.push(dir);
  }
  function releaseDir(dir) {
    var idx = pressedDirs.indexOf(dir);
    if (idx !== -1) pressedDirs.splice(idx, 1);
  }

  // A hash-only address-bar edit (pasting/hand-editing a save link, see
  // applySaveFromHash() below) doesn't reliably re-run this script on its
  // own in every browser — some just fire hashchange without a real
  // navigation. Forcing a reload here guarantees the new hash is actually
  // read from scratch every time, regardless of that browser quirk. Our
  // own writes (copySaveLink()) use history.replaceState, which never
  // fires hashchange, so this can't loop back on itself.
  window.addEventListener('hashchange', function () { location.reload(); });

  window.addEventListener('keydown', function (e) {
    if (toolFrameOpen) {
      if (e.key === 'Escape') closeToolFrame();
      return;
    }
    var dir = dirFromEvent(e);
    if (dir) { pushDir(dir); setFacing(dir); e.preventDefault(); }
    else if (isActionKey(e)) { handleAction(); e.preventDefault(); }
  });
  window.addEventListener('keyup', function (e) {
    var dir = dirFromEvent(e);
    if (dir) releaseDir(dir);
  });

  document.querySelectorAll('#dpad button').forEach(function (btn) {
    var dir = btn.getAttribute('data-dir');

    btn.addEventListener('pointerup', function () { releaseDir(dir); });
