<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stock Sonifier</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <main class="app">
    <header class="app-header">
      <div class="brand">
        <span class="brand-mark">♪</span>
        <span class="brand-name">Stock Sonifier</span>
      </div>
      <form class="symbol-form" id="symbolForm">
        <input id="symbolInput" class="symbol-input mono" type="text" value="AAPL" spellcheck="false" autocomplete="off" maxlength="15" />
        <button type="submit" class="go-btn" aria-label="Load symbol">→</button>
      </form>
    </header>

    <section class="quote-header">
      <div class="quote-id">
        <h1 id="quoteSymbol">AAPL</h1>
        <span id="quoteRangeLabel" class="quote-range-label">Max</span>
      </div>
      <div class="quote-price-row">
        <span id="quotePrice" class="quote-price mono">—</span>
        <span id="quoteChange" class="quote-change mono">—</span>
      </div>
    </section>

    <section class="toolbar">
      <div class="pills" id="rangePills" role="tablist" aria-label="Date range">
        <button class="pill" data-range="1m">1M</button>
        <button class="pill" data-range="6m">6M</button>
        <button class="pill" data-range="ytd">YTD</button>
        <button class="pill" data-range="1y">1Y</button>
        <button class="pill" data-range="5y">5Y</button>
        <button class="pill" data-range="10y">10Y</button>
        <button class="pill is-active" data-range="max">Max</button>
      </div>
      <div class="mode-toggle" id="modeToggle" role="tablist" aria-label="Chart style">
        <button class="mode-btn" data-mode="line" aria-label="Line view" title="Line">〜</button>
        <button class="mode-btn is-active" data-mode="candles" aria-label="Candlestick view" title="Candles">▤</button>
      </div>
    </section>

    <section class="chart-panel">
      <div class="chart-frame">
        <canvas id="chartCanvas"></canvas>
        <div id="chartTooltip" class="chart-tooltip mono" hidden></div>
        <div id="chartOverlay" class="chart-overlay" hidden>
          <span id="chartOverlayText">Loading…</span>
        </div>
      </div>
    </section>

    <section class="transport-panel">
      <div class="instrument-toggle" id="instrumentToggle" role="tablist" aria-label="Instrument">
        <button class="pill is-active" data-instrument="candlestick">Play</button>
        <button class="pill" data-instrument="scrub">Scrub</button>
      </div>
      <button id="playBtn" class="play-btn" aria-pressed="false">
        <span id="playIcon">▶</span>
      </button>

      <div class="transport-controls has-extra" id="candlestickControls">
        <div class="control-grid">
          <div class="control">
            <label for="tempoSlider">Tempo <span id="tempoVal" class="mono">8/s</span></label>
            <input id="tempoSlider" type="range" min="1" max="30" value="8" />
          </div>
          <div class="control">
            <label for="candlestickVolumeSlider">Volume <span id="candlestickVolumeVal" class="mono">50%</span></label>
            <input id="candlestickVolumeSlider" type="range" min="0" max="100" value="50" />
          </div>
          <div class="control control-toggle">
            <label for="quantizeToggle">Quantize <span id="quantizeVal" class="mono">On</span></label>
            <label class="switch">
              <input type="checkbox" id="quantizeToggle" checked />
              <span class="switch-track"></span>
            </label>
          </div>
          <div class="control control-toggle">
            <label for="percussionToggle">Percussion <span id="percussionVal" class="mono">Off</span></label>
            <label class="switch">
              <input type="checkbox" id="percussionToggle" />
              <span class="switch-track"></span>
            </label>
          </div>
          <div class="control control-toggle">
            <label for="gapToggle">Gap <span id="gapVal" class="mono">Off</span></label>
            <label class="switch">
              <input type="checkbox" id="gapToggle" />
              <span class="switch-track"></span>
            </label>
          </div>
          <div class="control control-toggle">
            <label for="wickShapeToggle">Wick Shape <span id="wickShapeVal" class="mono">Off</span></label>
            <label class="switch">
              <input type="checkbox" id="wickShapeToggle" />
              <span class="switch-track"></span>
            </label>
          </div>
        </div>
        <!-- Hidden for now: the demo Twelve Data key only resolves AAPL, so comparing
             tickers isn't usable yet. Code stays wired up (rebuildCandlestickTracks,
             loadCompareSymbols, SonicCandlestick multi-track support) — re-enable by
             removing `hidden` here once a real API key is in place. -->
        <div class="compare-row" hidden>
          <label for="compareInput">Compare <span class="hint">optional · up to 2 tickers, comma-separated</span></label>
          <input id="compareInput" type="text" class="mono compare-input" placeholder="e.g. MSFT, GOOGL" spellcheck="false" autocomplete="off" />
          <p id="compareStatus" class="compare-status" hidden></p>
        </div>
      </div>

      <div class="transport-controls" id="scrubControls" hidden>
        <div class="control">
          <label for="startSlider">Start <span id="startVal" class="mono">0%</span></label>
          <input id="startSlider" type="range" min="0" max="1000" value="0" />
        </div>
        <div class="control">
          <label for="stopSlider">Stop <span id="stopVal" class="mono">8%</span></label>
          <input id="stopSlider" type="range" min="0" max="1000" value="80" />
        </div>
        <div class="control">
          <label for="speedSlider">Speed <span id="speedVal" class="mono">1.00×</span></label>
          <input id="speedSlider" type="range" min="-300" max="300" value="0" />
        </div>
        <div class="control">
          <label for="volumeSlider">Volume <span id="volumeVal" class="mono">50%</span></label>
          <input id="volumeSlider" type="range" min="0" max="100" value="50" />
        </div>
        <div class="control">
          <label for="glideSlider">Glide <span id="glideVal" class="mono">50ms</span></label>
          <input id="glideSlider" type="range" min="0" max="100" value="10" />
        </div>
      </div>
    </section>

    <!-- Scrub-only: a keyboard transposes the fundamental (the Speed slider's
         rate). Sustain (the Play button, relabeled here) holds a drone at the
         fundamental with no key held; releasing Sustain doesn't silence a held
         key, and releasing every key doesn't silence Sustain. Styled after the
         Modular Synth applet's keyboard module (GATE+PITCH, last-note-priority). -->
    <section class="keyboard-panel" id="keyboardPanel" hidden>
      <div class="piano-wrap" id="pianoWrap"></div>
      <p class="keyboard-hint">A–K transposes the fundamental · tap/hold on touch</p>
    </section>

    <p id="status" class="status" hidden></p>
  </main>

  <script src="js/data.js"></script>
  <script src="js/chart.js"></script>
  <script src="js/scales.js"></script>
  <script src="js/audio.js"></script>
  <script>
    const $ = (sel) => document.querySelector(sel);
    const symbolForm = $('#symbolForm');
    const symbolInput = $('#symbolInput');
    const quoteSymbol = $('#quoteSymbol');
    const quoteRangeLabel = $('#quoteRangeLabel');
    const quotePrice = $('#quotePrice');
    const quoteChange = $('#quoteChange');
    const rangePills = $('#rangePills');
    const modeToggle = $('#modeToggle');
    const chartOverlay = $('#chartOverlay');
    const chartOverlayText = $('#chartOverlayText');
    const chartTooltip = $('#chartTooltip');
    const statusEl = $('#status');

    const RANGE_LABELS = { '1m': '1M', '3m': '3M', '6m': '6M', ytd: 'YTD', '1y': '1Y', '5y': '5Y', '10y': '10Y', max: 'Max' };

    const state = {
      symbol: 'AAPL',
      range: 'max',
      bars: [],
      loading: false,
      instrument: 'candlestick',
      compareSymbols: [], // up to 2 extra tickers layered into candlestick playback
      compareBars: {}, // symbol -> raw bars
    };

    const scrubber = new WavetableScrubber();
    const candlestick = new SonicCandlestick();

    // Takes displayBars explicitly (rather than reading chart.displayBars) because
    // this also runs synchronously from inside StockChart's own constructor (via
    // onRecompute), before the `chart` const below finishes being assigned.
    function rebuildCandlestickTracks(displayBars) {
      const targetLen = displayBars.length;
      const rawTracks = [{ symbol: state.symbol, bars: state.bars }];
      for (const sym of state.compareSymbols) {
        const raw = state.compareBars[sym];
        if (raw && raw.length) rawTracks.push({ symbol: sym, bars: raw });
      }
      candlestick.setTracksFromRaw(rawTracks, targetLen);
    }

    const chart = new StockChart(document.getElementById('chartCanvas'), {
      mode: 'candles',
      onHover: (bar) => showTooltip(bar),
      onRecompute: (displayBars) => rebuildCandlestickTracks(displayBars),
    });

    function fmt(n, digits = 2) {
      return n == null || Number.isNaN(n) ? '—' : n.toFixed(digits);
    }

    function setOverlay(text) {
      if (text) {
        chartOverlayText.textContent = text;
        chartOverlay.hidden = false;
      } else {
        chartOverlay.hidden = true;
      }
    }

    function setError(msg) {
      if (msg) {
        statusEl.textContent = msg;
        statusEl.hidden = false;
      } else {
        statusEl.hidden = true;
      }
    }

    function showTooltip(bar) {
      if (!bar) {
        chartTooltip.hidden = true;
        return;
      }
      chartTooltip.hidden = false;
      const up = bar.close >= bar.open;
      chartTooltip.innerHTML = `
        <div class="tt-date">${bar.date}</div>
        <div class="tt-row"><span>O</span>${fmt(bar.open)}</div>
        <div class="tt-row"><span>H</span>${fmt(bar.high)}</div>
        <div class="tt-row"><span>L</span>${fmt(bar.low)}</div>
        <div class="tt-row tt-close ${up ? 'tt-up' : 'tt-down'}"><span>C</span>${fmt(bar.close)}</div>
        <div class="tt-row"><span>Vol</span>${bar.volume.toLocaleString()}</div>
      `;
    }

    function updateQuoteHeader() {
      const bars = state.bars;
      quoteSymbol.textContent = state.symbol;
      quoteRangeLabel.textContent = RANGE_LABELS[state.range] || state.range;
      if (!bars.length) {
        quotePrice.textContent = '—';
        quoteChange.textContent = '—';
        quoteChange.className = 'quote-change mono';
        return;
      }
      const first = bars[0];
      const last = bars[bars.length - 1];
      const change = last.close - first.open;
      const pct = (change / first.open) * 100;
      const up = change >= 0;
      const pctDigits = Math.abs(pct) >= 1000 ? 0 : 2;
      const pctStr = Math.abs(pct).toLocaleString(undefined, { minimumFractionDigits: pctDigits, maximumFractionDigits: pctDigits });
      quotePrice.textContent = fmt(last.close);
      quoteChange.textContent = `${up ? '▲' : '▼'} ${fmt(Math.abs(change))} (${pctStr}%)`;
      quoteChange.className = 'quote-change mono ' + (up ? 'is-up' : 'is-down');
    }

    let loadToken = 0;

    async function load() {
      const myToken = ++loadToken;
      state.loading = true;
      setError(null);
      setOverlay('Loading…');
      stopActiveInstrument();
      try {
        const { bars } = await window.StockData.fetchBars(state.symbol, state.range);
        if (myToken !== loadToken) return; // a newer load() superseded this one
        state.bars = bars;
        chart.setData(bars); // triggers onRecompute -> rebuildCandlestickTracks()
        scrubber.setBars(bars);
        updateQuoteHeader();
        setOverlay(null);
        await loadCompareSymbols(myToken);
      } catch (err) {
        if (myToken !== loadToken) return;
        state.bars = [];
        chart.setData([]);
        updateQuoteHeader();
        setOverlay(null);
        setError(err.message);
      } finally {
        if (myToken === loadToken) state.loading = false;
      }
    }

    const compareStatus = $('#compareStatus');

    function setCompareStatus(msg, isIssue) {
      if (!msg) {
        compareStatus.hidden = true;
        return;
      }
      compareStatus.textContent = msg;
      compareStatus.className = 'compare-status' + (isIssue ? ' has-issue' : '');
      compareStatus.hidden = false;
    }

    async function loadCompareSymbols(myToken) {
      if (!state.compareSymbols.length) {
        state.compareBars = {};
        setCompareStatus(null);
        rebuildCandlestickTracks(chart.displayBars);
        return;
      }
      const results = await Promise.all(
        state.compareSymbols.map((sym) =>
          window.StockData.fetchBars(sym, state.range)
            .then(({ bars }) => ({ sym, bars }))
            .catch((err) => ({ sym, error: err.message }))
        )
      );
      if (myToken !== loadToken) return;
      const failed = [];
      state.compareBars = {};
      for (const r of results) {
        if (r.bars) state.compareBars[r.sym] = r.bars;
        else failed.push(r.sym);
      }
      setCompareStatus(failed.length ? `Unavailable: ${failed.join(', ')}` : null, true);
      rebuildCandlestickTracks(chart.displayBars);
    }

    symbolForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const val = symbolInput.value.trim().toUpperCase();
      if (!val) return;
      state.symbol = val;
      load();
    });

    rangePills.addEventListener('click', (e) => {
      const btn = e.target.closest('.pill');
      if (!btn) return;
      rangePills.querySelectorAll('.pill').forEach((p) => p.classList.remove('is-active'));
      btn.classList.add('is-active');
      state.range = btn.dataset.range;
      load();
    });

    modeToggle.addEventListener('click', (e) => {
      const btn = e.target.closest('.mode-btn');
      if (!btn) return;
      modeToggle.querySelectorAll('.mode-btn').forEach((b) => b.classList.remove('is-active'));
      btn.classList.add('is-active');
      chart.setMode(btn.dataset.mode);
    });

    // --- Transport: two instruments sharing one play button ---
    const instrumentToggle = $('#instrumentToggle');
    const scrubControls = $('#scrubControls');
    const candlestickControls = $('#candlestickControls');
    const keyboardPanel = $('#keyboardPanel');
    const playBtn = $('#playBtn');
    const playIcon = $('#playIcon');

    const startSlider = $('#startSlider');
    const stopSlider = $('#stopSlider');
    const speedSlider = $('#speedSlider');
    const volumeSlider = $('#volumeSlider');
    const startVal = $('#startVal');
    const stopVal = $('#stopVal');
    const speedVal = $('#speedVal');
    const volumeVal = $('#volumeVal');

    const tempoSlider = $('#tempoSlider');
    const tempoVal = $('#tempoVal');
    const candlestickVolumeSlider = $('#candlestickVolumeSlider');
    const candlestickVolumeVal = $('#candlestickVolumeVal');

    function activeEngine() {
      return state.instrument === 'candlestick' ? candlestick : scrubber;
    }

    function stopActiveInstrument() {
      scrubber.stop();
      candlestick.stop();
      chart.setPlayheadIndex(null);
      setPlayButtonState(false);
    }

    function setPlayButtonState(playing) {
      playBtn.classList.toggle('is-playing', playing);
      playBtn.setAttribute('aria-pressed', String(playing));
      playIcon.textContent = playing ? '■' : '▶';
    }

    function speedFromSlider(v) {
      return Math.pow(2, v / 100); // -300..300 -> 0.125x..8x
    }

    function applyLoopWindow() {
      let s = Number(startSlider.value);
      let e = Number(stopSlider.value);
      if (s >= e) {
        e = Math.min(1000, s + 2);
        stopSlider.value = e;
      }
      const startFrac = s / 1000;
      const stopFrac = e / 1000;
      scrubber.setLoopWindow(startFrac, stopFrac);
      if (state.instrument === 'scrub') chart.setLoopWindow(startFrac, stopFrac);
      startVal.textContent = (startFrac * 100).toFixed(1) + '%';
      stopVal.textContent = (stopFrac * 100).toFixed(1) + '%';
    }

    startSlider.addEventListener('input', applyLoopWindow);
    stopSlider.addEventListener('input', applyLoopWindow);

    speedSlider.addEventListener('input', () => {
      const speed = speedFromSlider(Number(speedSlider.value));
      scrubber.setSpeed(speed);
      speedVal.textContent = speed.toFixed(2) + '×';
    });

    volumeSlider.addEventListener('input', () => {
      const v = Number(volumeSlider.value) / 100;
      scrubber.setVolume(v);
      volumeVal.textContent = Math.round(v * 100) + '%';
    });

    const glideSlider = $('#glideSlider');
    const glideVal = $('#glideVal');
    function glideSecondsFromSlider(v) {
      return (v / 100) * 0.5; // 0..100 -> 0..500ms
    }
    glideSlider.addEventListener('input', () => {
      const seconds = glideSecondsFromSlider(Number(glideSlider.value));
      scrubber.setGlideTime(seconds);
      glideVal.textContent = Math.round(seconds * 1000) + 'ms';
    });

    // --- Scrub keyboard: transposes the fundamental, Sustain-independent.
    // Styled after the Modular Synth applet's keyboard module (same key
    // layout/mapping and mouse+touch handling approach), adapted to this
    // engine's single gated/transposed voice instead of a GATE+PITCH patch cable.
    const NOTE_SEMITONES = { C: 0, 'C#': 1, D: 2, 'D#': 3, E: 4, F: 5, 'F#': 6, G: 7, 'G#': 8, A: 9, 'A#': 10, B: 11, C2: 12 };
    const KEY_MAP = { a: 'C', w: 'C#', s: 'D', e: 'D#', d: 'E', f: 'F', t: 'F#', g: 'G', y: 'G#', h: 'A', u: 'A#', j: 'B', k: 'C2' };
    const WHITE_NOTES = ['C', 'D', 'E', 'F', 'G', 'A', 'B', 'C2'];
    const BLACK_MAP = { C: 'C#', D: 'D#', F: 'F#', G: 'G#', A: 'A#' };

    const pianoWrap = $('#pianoWrap');
    const keyEls = {};

    const whiteKeysEl = document.createElement('div');
    whiteKeysEl.className = 'white-keys';
    WHITE_NOTES.forEach((note) => {
      const k = document.createElement('div');
      k.className = 'white-key';
      k.dataset.note = note;
      keyEls[note] = k;
      whiteKeysEl.appendChild(k);
    });
    pianoWrap.appendChild(whiteKeysEl);

    const whiteKeyPct = 100 / WHITE_NOTES.length;
    Object.keys(BLACK_MAP).forEach((whiteNote) => {
      const note = BLACK_MAP[whiteNote];
      const wIdx = WHITE_NOTES.indexOf(whiteNote);
      const bk = document.createElement('div');
      bk.className = 'black-key';
      bk.dataset.note = note;
      bk.style.left = `calc(${(wIdx + 1) * whiteKeyPct}% - 11px)`;
      keyEls[note] = bk;
      pianoWrap.appendChild(bk);
    });

    function pressKeyboardNote(note) {
      scrubber.pressNote(NOTE_SEMITONES[note]);
      keyEls[note].classList.add('is-pressed');
    }
    function releaseKeyboardNote(note) {
      scrubber.releaseNote(NOTE_SEMITONES[note]);
      keyEls[note].classList.remove('is-pressed');
    }
    function releaseAllKeyboardKeys() {
      Object.keys(keyEls).forEach((note) => keyEls[note].classList.remove('is-pressed'));
      scrubber.releaseAllNotes();
    }

    // Mouse + touch (not Pointer Events — matches the Modular Synth applet's
    // bindDrag: real cross-browser reliability gaps in Safari otherwise).
    Object.keys(keyEls).forEach((note) => {
      const el = keyEls[note];
      function down(e) {
        e.preventDefault();
        pressKeyboardNote(note);
        window.addEventListener('mouseup', up);
        window.addEventListener('touchend', up);
        window.addEventListener('touchcancel', up);
      }
      function up() {
        releaseKeyboardNote(note);
        window.removeEventListener('mouseup', up);
        window.removeEventListener('touchend', up);
        window.removeEventListener('touchcancel', up);
      }
      el.addEventListener('mousedown', down);
      el.addEventListener('touchstart', down, { passive: false });
    });

    // Panic release: if the pointer/finger leaves the window entirely (over
    // another app, a different monitor) no mouseup/touchend ever reaches this
    // page, so a held note would otherwise stay stuck on forever.
    window.addEventListener('blur', releaseAllKeyboardKeys);

    document.addEventListener('keydown', (e) => {
      if (state.instrument !== 'scrub' || e.repeat) return;
      const tag = document.activeElement && document.activeElement.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;
      const note = KEY_MAP[e.key.toLowerCase()];
      if (note) pressKeyboardNote(note);
    });
    document.addEventListener('keyup', (e) => {
      if (state.instrument !== 'scrub') return;
      const note = KEY_MAP[e.key.toLowerCase()];
      if (note) releaseKeyboardNote(note);
    });

    tempoSlider.addEventListener('input', () => {
      const n = Number(tempoSlider.value);
      candlestick.setNotesPerSecond(n);
      tempoVal.textContent = n + '/s';
      if (candlestick.playing) {
        // restart to apply new tempo cleanly to the remaining schedule
        candlestick.play();
      }
    });

    candlestickVolumeSlider.addEventListener('input', () => {
      const v = Number(candlestickVolumeSlider.value) / 100;
      candlestick.setVolume(v);
      candlestickVolumeVal.textContent = Math.round(v * 100) + '%';
    });

    const quantizeToggle = $('#quantizeToggle');
    const quantizeVal = $('#quantizeVal');
    quantizeToggle.addEventListener('change', () => {
      candlestick.setQuantize(quantizeToggle.checked);
      quantizeVal.textContent = quantizeToggle.checked ? 'On' : 'Off';
      if (candlestick.playing) candlestick.play(); // restart to apply cleanly to the whole schedule
    });

    const percussionToggle = $('#percussionToggle');
    const percussionVal = $('#percussionVal');
    percussionToggle.addEventListener('change', () => {
      candlestick.setPercussion(percussionToggle.checked);
      percussionVal.textContent = percussionToggle.checked ? 'On' : 'Off';
      if (candlestick.playing) candlestick.play();
    });

    const gapToggle = $('#gapToggle');
    const gapVal = $('#gapVal');
    gapToggle.addEventListener('change', () => {
      candlestick.setGapEnabled(gapToggle.checked);
      gapVal.textContent = gapToggle.checked ? 'On' : 'Off';
      if (candlestick.playing) candlestick.play();
    });

    const wickShapeToggle = $('#wickShapeToggle');
    const wickShapeVal = $('#wickShapeVal');
    wickShapeToggle.addEventListener('change', () => {
      candlestick.setWickShapeEnabled(wickShapeToggle.checked);
      wickShapeVal.textContent = wickShapeToggle.checked ? 'On' : 'Off';
      if (candlestick.playing) candlestick.play();
    });

    const compareInput = $('#compareInput');
    function commitCompareInput() {
      const symbols = compareInput.value
        .split(',')
        .map((s) => s.trim().toUpperCase())
        .filter((s) => s && s !== state.symbol)
        .slice(0, 2);
      state.compareSymbols = symbols;
      loadCompareSymbols(loadToken);
    }
    compareInput.addEventListener('change', commitCompareInput);
    compareInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        compareInput.blur(); // triggers 'change'
      }
    });

    candlestick.onPlayheadUpdate = (idx) => chart.setPlayheadIndex(idx);
    candlestick.onEnded = () => setPlayButtonState(false);

    instrumentToggle.addEventListener('click', (e) => {
      const btn = e.target.closest('.pill');
      if (!btn) return;
      const instrument = btn.dataset.instrument;
      if (instrument === state.instrument) return;
      stopActiveInstrument();
      state.instrument = instrument;
      instrumentToggle.querySelectorAll('.pill').forEach((p) => p.classList.remove('is-active'));
      btn.classList.add('is-active');
      if (instrument === 'candlestick') {
        scrubControls.hidden = true;
        candlestickControls.hidden = false;
        keyboardPanel.hidden = true;
        releaseAllKeyboardKeys();
        chart.setLoopWindow(null);
        modeToggle.querySelectorAll('.mode-btn').forEach((b) => b.classList.toggle('is-active', b.dataset.mode === 'candles'));
        chart.setMode('candles');
        playBtn.title = 'Play';
      } else {
        candlestickControls.hidden = true;
        scrubControls.hidden = false;
        keyboardPanel.hidden = false;
        applyLoopWindow();
        playBtn.title = 'Sustain';
      }
    });

    playBtn.addEventListener('click', () => {
      const nowPlaying = activeEngine().toggle();
      setPlayButtonState(nowPlaying);
    });

    applyLoopWindow();
    scrubber.setSpeed(speedFromSlider(0));
    scrubber.setVolume(0.5);
    scrubber.setGlideTime(glideSecondsFromSlider(Number(glideSlider.value)));
    playBtn.title = 'Play';
    candlestick.setNotesPerSecond(8);
    candlestick.setVolume(0.5);
    candlestick.setPercussion(false);
    candlestick.setGapEnabled(false);
    candlestick.setWickShapeEnabled(false);

    load();
  </script>
</body>
</html>
