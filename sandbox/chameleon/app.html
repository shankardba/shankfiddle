<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chameleon — Combinatorial Generative Studio</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2386efac'/%3E%3Cstop offset='.55' stop-color='%2322c55e'/%3E%3Cstop offset='1' stop-color='%2315803d'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M30,70 C20,75 10,70 12,60 C14,50 24,48 28,55 C31,61 27,65 23,61' fill='none' stroke='url(%23g)' stroke-width='5' stroke-linecap='round'/%3E%3Cpath d='M30,70 Q40,40 65,35 Q85,32 91,45 Q93,56 79,59 Q58,63 44,66 Q35,69 30,70 Z' fill='url(%23g)'/%3E%3Ccircle cx='24' cy='58' r='2.2' fill='%23a855f7'/%3E%3Ccircle cx='45' cy='50' r='3' fill='%23ef4444'/%3E%3Ccircle cx='55' cy='43' r='2.8' fill='%23f97316'/%3E%3Ccircle cx='66' cy='39' r='2.6' fill='%23eab308'/%3E%3Ccircle cx='76' cy='40' r='2.8' fill='%233b82f6'/%3E%3Ccircle cx='88' cy='42' r='6' fill='%230b0d12'/%3E%3Ccircle cx='90' cy='40' r='2' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0d12;
    --border:#2a2f3a;
    --panel:#12151c;
    --panel2:#171b24;
    --ink:#e8eaf0;
    --ink-dim:#8b93a5;
    --accent:#38bdae;
    --recipe-warp:#38bdae;
    --recipe-branch:#7dd35f;
    --recipe-bloom:#f59e42;
    --recipe-mandala:#8b5cf6;
    --danger:#e0526b;
    --radius:10px;
  }
  [data-theme="light"]{
    --bg:#f3f4f7;
    --border:#d7dbe3;
    --panel:#ffffff;
    --panel2:#f7f8fb;
    --ink:#161a22;
    --ink-dim:#5b6270;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Space Grotesk',system-ui,sans-serif;overflow:hidden;}
  .mono{font-family:'IBM Plex Mono',ui-monospace,monospace;}
  #stage{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none;}

  /* ---- floating icon buttons: gear alone top-right; everything else clustered top-left ----
     Square (not round) chip, per spirograph-studio's icon-btn family. */
  .icon-btn{
    position:fixed;top:14px;width:36px;height:36px;border-radius:4px;
    background:color-mix(in srgb, var(--panel) 88%, transparent);
    border:1px solid var(--border);color:var(--ink);
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    font-size:16px;z-index:40;backdrop-filter:blur(6px);
    transition:transform .15s ease, border-color .15s ease, background .15s ease;
  }
  .icon-btn:hover{transform:translateY(-1px);border-color:var(--accent);}
  .icon-btn:active{transform:translateY(0);}
  .icon-btn.open{border-color:var(--accent);color:var(--accent);}
  .icon-btn svg{width:17px;height:17px;stroke:currentColor;fill:none;display:block;transition:transform .4s ease;}
  #gearBtn.open svg{transform:rotate(75deg);}
  #mathBtn{font-family:'IBM Plex Mono',monospace;font-size:16px;font-weight:600;}
  #gearBtn{right:14px;}
  #downloadBtn{left:14px;}
  #diceBtn{left:58px;}
  #mathBtn{left:102px;}
  #themeBtn{left:146px;}

  /* ---- HUD: bottom-left, per convention ---- */
  #hud{
    position:fixed;left:14px;bottom:14px;z-index:40;
    background:color-mix(in srgb, var(--panel) 88%, transparent);
    border:1px solid var(--border);border-radius:var(--radius);
    padding:9px 13px;font-size:12px;line-height:1.7;color:var(--ink-dim);
    backdrop-filter:blur(6px);max-width:min(72vw,460px);
  }
  #hud b{color:var(--ink);font-weight:600;}
  #hud .recipe-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle;}

  /* ---- slide panels ---- */
  .panel{
    position:fixed;top:0;bottom:0;width:min(380px,92vw);
    background:var(--panel);border-left:1px solid var(--border);
    z-index:60;overflow-y:auto;transition:transform .25s ease;
    padding:18px 18px 40px;
  }
  #settingsPanel{right:0;transform:translateX(100%);border-left:1px solid var(--border);border-right:none;}
  #settingsPanel.open{transform:translateX(0);}
  #mathPanel{left:0;width:min(520px,94vw);border-right:1px solid var(--border);border-left:none;transform:translateX(-100%);}
  #mathPanel.open{transform:translateX(0);}
  .panel h2{font-size:16px;margin:0 0 14px;display:flex;align-items:center;justify-content:space-between;}
  .panel-close{cursor:pointer;color:var(--ink-dim);font-size:20px;line-height:1;background:none;border:none;padding:2px 6px;}
  .panel-close:hover{color:var(--ink);}
  #overlay{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .25s ease;z-index:50;}
  #overlay.show{opacity:.45;pointer-events:auto;}

  fieldset{border:1px solid var(--border);border-radius:var(--radius);margin:0 0 14px;padding:10px 12px 12px;}
  legend{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-dim);padding:0 4px;}
  label.ctrl{display:block;margin:8px 0;font-size:12.5px;color:var(--ink-dim);}
  label.ctrl b{color:var(--ink);font-weight:500;}
  label.ctrl .val{float:right;color:var(--accent);}
  input[type=range]{width:100%;accent-color:var(--accent);margin-top:3px;}
  select,input[type=color]{width:100%;background:var(--panel2);color:var(--ink);border:1px solid var(--border);
    border-radius:6px;padding:6px 8px;font-family:inherit;font-size:12.5px;margin-top:3px;}
  .checkrow{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:12.5px;color:var(--ink-dim);}
  .checkrow input{accent-color:var(--accent);}

  .recipe-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:4px;}
  .recipe-card{border:1.5px solid var(--border);border-radius:9px;padding:9px 10px;cursor:pointer;font-size:12px;
    background:var(--panel2);transition:border-color .15s ease, background .15s ease;}
  .recipe-card b{display:block;font-size:12.5px;margin-bottom:2px;}
  .recipe-card.active{border-color:var(--rc,var(--accent));background:color-mix(in srgb, var(--rc,var(--accent)) 14%, var(--panel2));}
  .recipe-card:hover{border-color:var(--rc,var(--accent));}

  .preset-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
  .chip{border:1px solid var(--border);background:var(--panel2);color:var(--ink-dim);border-radius:999px;
    padding:5px 11px;font-size:11.5px;cursor:pointer;transition:all .15s ease;}
  .chip:hover{border-color:var(--accent);color:var(--ink);}

  .btn-row{display:flex;gap:8px;margin-top:4px;}
  .btn{flex:1;border:1px solid var(--border);background:var(--panel2);color:var(--ink);border-radius:8px;
    padding:9px 10px;font-size:12.5px;cursor:pointer;font-family:inherit;font-weight:500;}
  .btn:hover{border-color:var(--accent);}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#0b0d12;}

  .math-body{font-size:13px;line-height:1.65;color:var(--ink-dim);}
  .math-body h3{color:var(--ink);font-size:14.5px;margin:20px 0 6px;}
  .math-body h3:first-child{margin-top:0;}
  .math-body .eq{font-family:'IBM Plex Mono',monospace;background:var(--panel2);border:1px solid var(--border);
    border-radius:7px;padding:9px 11px;margin:8px 0;font-size:12px;color:var(--ink);white-space:pre-wrap;overflow-x:auto;}
  .math-body dl{margin:6px 0;}
  .math-body dt{color:var(--ink);font-weight:600;display:inline;}
  .math-body dd{margin:0 0 4px 0;display:inline;color:var(--ink-dim);}
  .math-body dd::after{content:"";display:block;}
  .math-body table{width:100%;border-collapse:collapse;font-size:12px;margin:8px 0;}
  .math-body th,.math-body td{border:1px solid var(--border);padding:5px 7px;text-align:left;}
  .math-body th{color:var(--ink);background:var(--panel2);}
  .math-body .tie{border-left:3px solid var(--accent);padding:8px 10px;background:var(--panel2);border-radius:0 7px 7px 0;margin:12px 0;}
  .math-body .cite{font-size:11px;color:var(--ink-dim);opacity:.8;margin-top:18px;}

  .toast{position:fixed;left:50%;bottom:70px;transform:translate(-50%,10px);background:var(--panel);
    border:1px solid var(--border);border-radius:8px;padding:8px 16px;font-size:12.5px;z-index:70;
    opacity:0;transition:all .25s ease;pointer-events:none;}
  .toast.show{opacity:1;transform:translate(-50%,0);}

  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
</style>
</head>

  </svg>
</button>

<div id="hud" class="mono"></div>

<!-- ============ SETTINGS PANEL ============ -->
<aside class="panel" id="settingsPanel">
  <h2>Settings <button class="panel-close" data-close="settingsPanel">&times;</button></h2>

  <fieldset>
    <legend>Recipe — how the systems combine</legend>
    <div class="recipe-grid" id="recipeGrid"></div>
    <p class="mono" id="recipeBlurb" style="font-size:11.5px;color:var(--ink-dim);margin:8px 0 0;line-height:1.5;"></p>
    <div class="preset-row" id="presetRow"></div>
  </fieldset>

  <div id="dynamicParams"></div>

  <fieldset>
    <legend>Appearance</legend>
    <label class="ctrl"><b>Palette</b>
      <select id="paletteSelect">
        <option value="0">Ember</option>
        <option value="1">Deep Sea</option>
        <option value="2">Ultraviolet</option>
        <option value="3">Mono Warm</option>
        <option value="4">Mono Cool</option>
        <option value="5">Rainbow (HSL)</option>
        <option value="6">Zebra</option>
        <option value="7">Solid</option>
      </select>
    </label>
    <label class="ctrl" id="solidColorRow" style="display:none;"><b>Solid color</b><input type="color" id="solidColor" value="#38bdae"></label>
    <label class="ctrl"><b>Line width</b> <span class="val mono" id="lineWidthVal"></span><input type="range" id="lineWidth" min="0.4" max="4" step="0.1" value="1.4"></label>
    <div class="checkrow"><input type="checkbox" id="glowToggle" checked><label for="glowToggle">Glow</label></div>
    <label class="ctrl"><b>Trail (fade instead of clear)</b> <span class="val mono" id="trailVal"></span><input type="range" id="trail" min="0" max="0.9" step="0.02" value="0"></label>
  </fieldset>

  <div class="btn-row">
    <button class="btn primary" id="surpriseBtn">Surprise me (any recipe)</button>
  </div>
  <div class="btn-row" style="margin-top:8px;">
    <button class="btn" id="resetBtn">Reset recipe</button>
  </div>
</aside>

<!-- ============ MATH PANEL ============ -->
<aside class="panel" id="mathPanel">
  <h2>The math <button class="panel-close" data-close="mathPanel">&times;</button></h2>
  <div class="math-body" id="mathBody"></div>
</aside>

<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";

/* =========================================================================
   SHARED COLOR SYSTEM
   Ported verbatim (same coefficients) from the cosine-gradient palette
   shared by spirograph-studio / lsystem-widget / voronoi-widget, so this
   applet's colors sit in the same visual family as its siblings.
   cosinePalette(idx,t) = a + b*cos(2*PI*(c*t+d))   per RGB channel.
   ========================================================================= */
const PALETTES = [
  {a:[.55,.35,.20], b:[.55,.35,.20], c:[1.0,.7,.4], d:[0,.15,.2]},
  {a:[.15,.35,.45], b:[.25,.35,.45], c:[.6,.8,1.0], d:[.3,.5,.7]},
  {a:[.45,.25,.55], b:[.45,.25,.55], c:[1.0,.6,1.0], d:[.1,.5,.9]},
  {a:[.5,.5,.5],    b:[.5,.5,.5],    c:[1,1,1],      d:[0,0,0]},
  {a:[.5,.5,.5],    b:[.5,.5,.5],    c:[1,1,1],      d:[0,.33,.67]}
];
function cosinePalette(idx,t){
  const p = PALETTES[idx];
  const ch = k => Math.max(0,Math.min(1, p.a[k]+p.b[k]*Math.cos(2*Math.PI*(p.c[k]*t+p.d[k]))));
  return [Math.round(ch(0)*255),Math.round(ch(1)*255),Math.round(ch(2)*255)];
}
function colorFor(paletteIdx, t, idx, solidColor){
  t = ((t%1)+1)%1;
  if(paletteIdx===5){ const h=t*360; return `hsl(${h.toFixed(1)},85%,60%)`; }
  if(paletteIdx===6){ return (idx%2===0) ? '#f2a65a' : '#57d9c4'; }
  if(paletteIdx===7){ return solidColor; }
  const [r,g,b]=cosinePalette(paletteIdx,t); return `rgb(${r},${g},${b})`;
}

/* =========================================================================
   PRNG — mulberry32, same seeded-generator convention as voronoi-widget,
   so randomize() is reproducible from a seed for debugging/sharing.
   ========================================================================= */
function mulberry32(seed){
  let a = seed >>> 0;
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
let rng = mulberry32(Date.now() & 0xffffffff);
function rand(min,max){ return min + rng()*(max-min); }
function randInt(min,max){ return Math.floor(rand(min,max+1)); }
function pick(arr){ return arr[Math.floor(rng()*arr.length)]; }
function clamp(v,lo,hi){ return Math.max(lo,Math.min(hi,v)); }
// Canvas2D pays a steep per-call cost for shadowBlur strokes; recipes
// whose item count can explode (L-system branch counts grow ~5^depth,
// mandala motifs grow rings*symmetry) must budget their segment count
// rather than draw every generated point, or a single frame can take
// seconds instead of milliseconds.
function subsampleArr(arr, maxN){
  if(arr.length<=maxN) return arr;
  const out = new Array(maxN);
  for(let i=0;i<maxN;i++) out[i] = arr[Math.floor(i*arr.length/maxN)];
  return out;
}
function lerp(a,b,t){ return a+(b-a)*t; }
function gcd(a,b){ a=Math.abs(a);b=Math.abs(b); while(b){[a,b]=[b,a%b];} return a||1; }
function lcm(a,b){ return Math.abs(a*b)/gcd(a,b); }

/* =========================================================================
   MODULE 1 — SECOND-ORDER ROULETTE
   Ported formula from spirograph-studio/index.html (computeCurve, ~L820-945):
   a gear-in-hoop-in-wheel epicyclic construction (credit: glagolj's
   "second-order roulette", see math panel citation). Returns the BASE
   (ring+wheel+hoop) point and the PEN VECTOR separately so recipes can
   scale the pen vector independently (that's the hook recipe "warp" uses
   to let a fractal field bend the curve).
   ========================================================================= */
function rouletteRaw(t, R){
  const m0 = R.n0/R.n1, m1 = R.n2/R.n3;
  const t1 = m0*t;
  const t2 = t1 + Math.atan2(R.h*Math.sin(t1), 1-R.h*Math.cos(t1));
  const a0 = t - t1;
  const t3 = m1*t2;
  const a1 = a0 + t2 - t3;
  const baseX = (R.n0-R.n1)*Math.cos(t) + R.n1*R.h*Math.cos(a0) + (R.n2-R.n3)*Math.cos(a0+t2);
  const baseY = (R.n0-R.n1)*Math.sin(t) + R.n1*R.h*Math.sin(a0) + (R.n2-R.n3)*Math.sin(a0+t2);
  const phi = (R.phi||0)*Math.PI/180;
  const penX = R.n3*R.p*Math.cos(a1+phi);
  const penY = R.n3*R.p*Math.sin(a1+phi);
  return {baseX,baseY,penX,penY,angle:a1+phi};
}
// Curated shape families — n0/n1 (the outer ring:wheel ratio, which mostly
// determines overall symmetry) are FIXED per family to known-clean values;
// only h/p/detail stay user-tunable. This replaces raw n0..n3 sliders
// entirely: full gear customization risked ugly/degenerate ratios (see the
// period-closure gotcha below) and wasn't needed for an app about
// combining concepts, not fine-tuning one spirograph from scratch.
const ROULETTE_FAMILIES = [
  {name:'Sevenfold',   n0:140, n1:128, n2:54, n3:45},
  {name:'Nonagon',     n0:96,  n1:77,  n2:33, n3:20},
  {name:'Rippleship',  n0:180, n1:161, n2:70, n3:29},
  {name:'Hexrose',     n0:60,  n1:47,  n2:19, n3:12},
  {name:'Twelvefold',  n0:84,  n1:65,  n2:26, n3:17},
  {name:'Pentaspiral', n0:45,  n1:34,  n2:13, n3:8}
];
function resolveRoulette(R){
  const fam = ROULETTE_FAMILIES.find(f=>f.name===R.family) || ROULETTE_FAMILIES[0];
  const detail = R.detail==null ? 1 : R.detail;
  return {
    n0:fam.n0, n1:fam.n1,
    n2:Math.max(3, Math.round(fam.n2*detail)),
    n3:Math.max(2, Math.round(fam.n3*detail)),
    h:R.h, p:R.p, phi:0
  };
}
function roulettePeriod(R){
  // classic epicyclic closure: reduce each internal gear ratio to lowest
  // terms and take the lcm of the resulting denominators — the curve
  // repeats once every denominator-th outer revolution, same principle
  // as a plain hypotrochoid's period = 2*pi*r/gcd(R,r).
  const q0 = R.n1/gcd(R.n0,R.n1);
  const q1 = R.n3/gcd(R.n2,R.n3);
  const L = lcm(q0,q1);
  // hard safety cap: also keeps points-per-revolution reasonable at the
  // fixed 6000-point ceiling (400 revs = 15pt/rev, muddy; 140 = ~43pt/rev,
  // clean) so curated-random gear ratios don't collapse into a filled scribble
  return 2*Math.PI*Math.min(L, 140);
}
// full curve, optionally with a per-point pen-scale callback for warping.
// `density` means points-PER-REVOLUTION (so the main curve gets more
// samples when its period spans more revolutions); pass `fixedN` instead
// when the caller needs an exact, budgeted point count regardless of the
// gear ratio's own period (decorative rosette/motif stamping).
function rouletteCurve(R, density, penScaleFn, fixedN){
  const T = roulettePeriod(R);
  const n = fixedN ? clamp(Math.round(fixedN), 6, 400)
                    : clamp(Math.round(density*(T/(2*Math.PI))), 32, 6000);
  const pts = new Array(n);
  let maxR = 1;
  for(let i=0;i<n;i++){
    const t = T*i/(n-1);
    const raw = rouletteRaw(t,R);
    const scale = penScaleFn ? penScaleFn(raw,t,i/n) : 1;
    const x = raw.baseX + raw.penX*scale, y = raw.baseY + raw.penY*scale;
    pts[i] = {x,y,t,frac:i/(n-1),raw};
    maxR = Math.max(maxR, Math.hypot(x,y));
  }
  return {pts, T, maxR};
}

/* =========================================================================
   MODULE 2 — COMPLEX-PLANE ESCAPE-TIME FRACTAL
   fractal-widget renders this in a WebGL/GLSL shader (no CPU-side JS
   point loop exists there). Ported to plain JS here — same z -> z^2+c
   power family and smooth escape-time formula from fractal-widget's
   shader (~L360-532), reimplemented on the CPU because this recipe
   needs to *sample* the field at arbitrary (x,y) to bend other curves,
   not just rasterize a full-screen image.
   ========================================================================= */
const FRACTAL_SPOTS = {
  mandelbrot: [ {cx:-0.5,cy:0,zoom:1.15}, {cx:-0.745,cy:0.1127,zoom:0.02}, {cx:-0.75,cy:0.1,zoom:0.06}, {cx:0.275,cy:0.0,zoom:0.045} ],
  burningship:[ {cx:-1.75,cy:-0.03,zoom:0.14}, {cx:-1.762,cy:-0.028,zoom:0.02}, {cx:-0.5,cy:-0.5,zoom:0.9} ],
  tricorn:    [ {cx:-0.5,cy:0,zoom:1.2}, {cx:-1.1,cy:0.2,zoom:0.25} ],
  julia:      [ {c:[-0.4,0.6]}, {c:[0.285,0.01]}, {c:[-0.8,0.156]}, {c:[-0.70176,-0.3842]}, {c:[0.355,0.355]} ]
};
function escapeSmooth(cx, cy, F){
  let zx, zy, cxx, cyy;
  if(F.mode==='julia'){ zx=cx; zy=cy; cxx=F.juliaC[0]; cyy=F.juliaC[1]; }
  else { zx=0; zy=0; cxx=cx; cyy=cy; }
  const bail2 = F.bailout*F.bailout;
  let n=0;
  for(; n<F.maxIter; n++){
    let x=zx, y=zy;
    if(F.mode==='burningship'){ x=Math.abs(x); y=Math.abs(y); }
    if(F.mode==='tricorn'){ y=-y; }
    const x2=x*x, y2=y*y;
    zx = x2-y2+cxx; zy = 2*x*y+cyy;
    if(x2+y2>bail2) break;
  }
  if(n>=F.maxIter) return null; // interior — never escaped
  const logZn = 0.5*Math.log(zx*zx+zy*zy);
  const nu = Math.log(logZn/Math.log(F.bailout))/Math.LN2;
  const smoothN = n+1-nu;
  return clamp(smoothN/F.maxIter, 0, 1);
}

/* =========================================================================
   MODULE 3 — L-SYSTEM + TURTLE
   Ported from lsystem-widget/index.html (generateString ~L580-594,
   interpret ~L599-624). Extended here to record stack DEPTH per drawn
   segment and to flag branch TIPS (the last drawn point at a given
   depth immediately before a ']' pop) — that depth/tip data is the hook
   recipes "branch" and "mandala" use to parameterize roulette rosettes.
   ========================================================================= */
const LSYSTEMS = {
  plant:   {axiom:'X', rules:{X:'F+[[X]-X]-F[-FX]+X', F:'FF'}, angle:25, heading:90, maxDepth:6},
  tree:    {axiom:'F', rules:{F:'F[+F]F[-F]F'},                angle:30, heading:90, maxDepth:5},
  dragon:  {axiom:'F', rules:{F:'F+G', G:'F-G'},                angle:90, heading:0,  maxDepth:13},
  arrowhead:{axiom:'A',rules:{A:'B-A-B', B:'A+B+A'},            angle:60, heading:0,  maxDepth:8, drawSymbols:['A','B']}
};
function lsystemGenerate(axiom, rules, depth){
  let s = axiom;
  const MAX_CHARS = 60000;
  for(let i=0;i<depth;i++){
    let next='';
    for(const ch of s){ next += (rules[ch]!==undefined ? rules[ch] : ch); if(next.length>MAX_CHARS) break; }
    s = next;
    if(s.length>MAX_CHARS) break;
  }
  return s;
}
function lsystemInterpret(str, angleDeg, headingDeg, drawSymbols){
  const drawSet = new Set(drawSymbols || ['F','G']);
  const angle = angleDeg*Math.PI/180;
  let x=0,y=0,heading=headingDeg*Math.PI/180;
  const stack=[]; const segs=[]; const tips=[];
  let lastDrawAtDepth = new Map(); // depth -> last segment index drawn while at that depth
  for(let i=0;i<str.length;i++){
    const ch = str[i];
    if(drawSet.has(ch)){
      const nx = x+Math.cos(heading), ny = y+Math.sin(heading);
      const idx = segs.length;
      segs.push({x1:x,y1:y,x2:nx,y2:ny,depth:stack.length});
      lastDrawAtDepth.set(stack.length, idx);
      x=nx; y=ny;
    } else if(ch==='f'||ch==='g'){
      x += Math.cos(heading); y += Math.sin(heading);
    } else if(ch==='+'){ heading += angle; }
    else if(ch==='-'){ heading -= angle; }
    else if(ch==='['){ stack.push({x,y,heading,depth:stack.length}); }
    else if(ch===']'){
      const d = stack.length;
      if(lastDrawAtDepth.has(d)){
        const seg = segs[lastDrawAtDepth.get(d)];
        tips.push({x:seg.x2,y:seg.y2,heading,depth:d});
        lastDrawAtDepth.delete(d);
      }
      const st = stack.pop();
      if(st){ x=st.x; y=st.y; heading=st.heading; }
    }
  }
  // any still-open branch tip (no explicit pop, e.g. the trunk itself)
  if(segs.length){ const last=segs[segs.length-1]; tips.push({x:last.x2,y:last.y2,heading,depth:last.depth}); }
  return {segs, tips};
}
function safeDepth(sys, requested){
  let d = requested;
  while(d>1 && lsystemGenerate(sys.axiom,sys.rules,d).length>60000) d--;
  return d;
}

/* =========================================================================
   MODULE 4 — VORONOI CELLS (Euclidean, half-plane clipping)
   Ported from voronoi-widget/index.html (computeEuclideanCells ~L690-722):
   for each site, clip the canvas rectangle against every other site's
   perpendicular-bisector half-plane (Sutherland-Hodgman). No external
   library, matches the sibling's own from-scratch approach.
   ========================================================================= */
function clipHalfPlane(poly, nx, ny, c){
  const out=[];
  for(let i=0;i<poly.length;i++){
    const cur=poly[i], prev=poly[(i-1+poly.length)%poly.length];
    const curIn = nx*cur.x+ny*cur.y <= c, prevIn = nx*prev.x+ny*prev.y <= c;
    if(curIn){
      if(!prevIn){ out.push(intersect(prev,cur,nx,ny,c)); }
      out.push(cur);
    } else if(prevIn){ out.push(intersect(prev,cur,nx,ny,c)); }
  }
  return out;
}
function intersect(p1,p2,nx,ny,c){
  const d1=nx*p1.x+ny*p1.y-c, d2=nx*p2.x+ny*p2.y-c;
  const t = d1/(d1-d2);
  return {x:p1.x+t*(p2.x-p1.x), y:p1.y+t*(p2.y-p1.y)};
}
function computeVoronoiCells(sites, W, H){
  const bounds=[{x:0,y:0},{x:W,y:0},{x:W,y:H},{x:0,y:H}];
  return sites.map((s,i)=>{
    let poly = bounds.slice();
    for(let j=0;j<sites.length;j++){
      if(i===j) continue;
      const o = sites[j];
      const nx=o.x-s.x, ny=o.y-s.y;
      const c=(o.x*o.x+o.y*o.y-s.x*s.x-s.y*s.y)/2;
      poly = clipHalfPlane(poly, nx, ny, c);
      if(!poly.length) break;
    }
    return poly;
  });
}
function polyCentroid(poly){
  if(!poly.length) return {x:0,y:0};
  let x=0,y=0; for(const p of poly){x+=p.x;y+=p.y;} return {x:x/poly.length,y:y/poly.length};
}

    groups:['lsys'],
    knobs:[
      {key:'rosetteScale', bank:'branch', label:'Rosette scale', min:0.05, max:0.35, step:0.01, curated:[0.1,0.24]},
      {key:'rosetteComplexity', bank:'branch', label:'Rosette complexity', min:2, max:9, step:1, curated:[3,7]},
    ],
    presets:[
      {name:'Fern Rosettes', lsys:{preset:'plant',depth:5,angle:25}, branch:{rosetteScale:0.13,rosetteComplexity:4}},
      {name:'Tree Blossoms', lsys:{preset:'tree',depth:4,angle:30}, branch:{rosetteScale:0.2,rosetteComplexity:5}},
      {name:'Dragon Gears', lsys:{preset:'dragon',depth:10,angle:90}, branch:{rosetteScale:0.09,rosetteComplexity:6}},

      let ext=1;
      for(const s of segs){ ext=Math.max(ext,Math.hypot(s.x2,s.y2),Math.hypot(s.x1,s.y1)); }

      }
      // Stamp points: bracket-branch tips are the natural hook for
      // branching presets (plant/tree), but dragon/arrowhead have no
      // brackets at all — allTips would degenerate to a single point.
      // Sample evenly along the WHOLE drawn path instead, so every
      // preset gets even rosette coverage; bracket depth still modulates
      // gearing where it's meaningful (>0), and path position fills in
      // as the variation signal where it isn't (depth stays 0).
      const pathSamples = subsampleArr(segs, 200).map((s,i)=>({
        x:s.x2, y:s.y2, heading:Math.atan2(s.y2-s.y1,s.x2-s.x1), depth:s.depth, idx:i

        for(let j=1;j<rc.pts.length;j++){
          const a=rc.pts[j-1], b=rc.pts[j];
          rosetteSegs.push({
            x0:ox+(a.x/rc.maxR)*rscale, y0:oy+(a.y/rc.maxR)*rscale,
            x1:ox+(b.x/rc.maxR)*rscale, y1:oy+(b.y/rc.maxR)*rscale,
            t:signalFrac, lw
          });
        }
      });
      strokeSegBatch(ctx, rosetteSegs, i=>colorFor(state.appearance.palette, rosetteSegs[i].t, i, state.appearance.solidColor), i=>rosetteSegs[i].lw);
      hudExtra = `preset:${state.lsys.preset} · depth:${depth} · branch tips:${allTips.length} · rosettes:${tips.length}`;
    }
  },
  {
    id:'bloom', name:'Voronoi Bloom', color:'var(--recipe-bloom)',
    blurb:'Points sampled from another system’s own geometry become Voronoi seeds; each cell’s color is a direct function of that source point’s local value.',

    ],
    presets:[

      {name:'Orbit Cells', vor:{seedSource:'fractal',seedCount:90,colorBy:'escape'}, fractal:{mode:'julia',juliaC:[0.285,0.01]}},

        for(let k=0;k<sym;k++){
          const baseAng = (2*Math.PI*k/sym) + r*state.mandala.ringTwist*Math.PI/180;
          const ox = cx + Math.cos(baseAng)*ringRadius, oy = cy + Math.sin(baseAng)*ringRadius;
          const tFrac = (r*sym+k)/(rings*sym);
          const cosA=Math.cos(baseAng), sinA=Math.sin(baseAng);
          for(let j=1;j<rc.pts.length;j++){
            const a=rc.pts[j-1], b=rc.pts[j];
            const ax = a.x/rc.maxR, ay=a.y/rc.maxR, bx=b.x/rc.maxR, by=b.y/rc.maxR;
            motifSegs.push({
              x0: ox + (ax*cosA-ay*sinA)*ringScale, y0: oy + (ax*sinA+ay*cosA)*ringScale,
              x1: ox + (bx*cosA-by*sinA)*ringScale, y1: oy + (bx*sinA+by*cosA)*ringScale,
              t:tFrac, lw
            });
          }
        }
      }
      strokeSegBatch(ctx, motifSegs, i=>colorFor(state.appearance.palette, motifSegs[i].t, i, state.appearance.solidColor), i=>motifSegs[i].lw);
      hudExtra = `rings:${rings} × symmetry:${sym} = ${rings*sym} motifs`;
    }
  }
];
function fractalParamsFor(f){
  const base = {mode:f.mode, bailout:f.bailout, maxIter:f.maxIter, zoom:f.zoom, cx:f.cx, cy:f.cy, juliaC:f.juliaC};
  return base;
}

/* =========================================================================
   RENDERER
   ========================================================================= */
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
let hudExtra = '';
let dpr = Math.min(2, window.devicePixelRatio||1);

function resize(){
  dpr = Math.min(2, window.devicePixelRatio||1);
  canvas.width = innerWidth*dpr; canvas.height = innerHeight*dpr;
  canvas.style.width = innerWidth+'px'; canvas.style.height = innerHeight+'px';
}
window.addEventListener('resize', ()=>{ resize(); render(); });

// Batch any number of segments into a fixed ~240 stroke() calls, regardless
// of total count. One stroke() per segment (with shadowBlur re-set each
// time) is the exact bug already found and fixed in this family's
// lsystem-widget ("Fix severe rendering slowdown on large systems") and
// voronoi-widget ("Fix drag/slider responsiveness with a coalesced
// recompute") — a recipe with thousands of segments meant thousands of
// individual shadowBlur'd draw calls per frame. Ported here verbatim
// (same constant, same approach) rather than re-deriving it.
const RENDER_CHUNKS = 240;
function strokeSegBatch(ctx, segs, colorAt, widthAt){
  const n = segs.length;
  if(!n) return;
  const chunkCount = Math.min(RENDER_CHUNKS, n);
  const perChunk = Math.max(1, Math.ceil(n/chunkCount));
  const glow = state.appearance.glow;
  for(let c=0; c*perChunk<n; c++){
    const start = c*perChunk, end = Math.min(n, start+perChunk);
    const mid = start + ((end-start)>>1);
    const col = colorAt(mid);
    ctx.strokeStyle = col;
    if(glow){ ctx.shadowColor = col; ctx.shadowBlur = 6; } else { ctx.shadowBlur = 0; }
    if(widthAt) ctx.lineWidth = widthAt(mid);
    ctx.beginPath();
    for(let i=start;i<end;i++){ const s=segs[i]; ctx.moveTo(s.x0,s.y0); ctx.lineTo(s.x1,s.y1); }
    ctx.stroke();
  }
}

let lastRenderMs = 0;
function render(){
  const t0 = performance.now();
  const W = canvas.width, H = canvas.height;
  ctx.setTransform(1,0,0,1,0,0);
  if(state.appearance.trail>0){
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim() || '#0b0d12';
    ctx.globalAlpha = 1-state.appearance.trail; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1;
  } else {
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim() || '#0b0d12';
    ctx.fillRect(0,0,W,H);
  }
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.lineCap='round'; ctx.lineJoin='round';
  const cx = innerWidth/2, cy = innerHeight/2, scale = Math.min(innerWidth,innerHeight)*0.42;
  const rec = RECIPES.find(r=>r.id===state.recipe);
  hudExtra='';
  try{ rec.draw(ctx, innerWidth, innerHeight, cx, cy, scale); }
  catch(e){ console.error('render error', e); hudExtra='render error — see console'; }
  ctx.shadowBlur=0;
  lastRenderMs = performance.now()-t0;
  updateHud(rec);
}

// Coalesces rapid-fire slider 'input' events into at most one render() per
// animation frame — same fix as lsystem-widget's "Fix severe rendering
// slowdown on large systems" and voronoi-widget's "Fix drag/slider
// responsiveness with a coalesced recompute": without this, dragging a
// slider fires a full synchronous render() on every raw input tick (each
// one potentially doing real work — L-system regeneration, Voronoi
// half-plane clipping, escape-time sampling), which is what makes
// dragging feel frozen. The slider's own label text still updates
// synchronously in fieldControl() so the number feels immediate.
let renderRafPending = false;
function scheduleRender(){
  if(renderRafPending) return;
  renderRafPending = true;
  requestAnimationFrame(()=>{ renderRafPending=false; render(); });
}

function updateHud(rec){
  const dot = `<span class="recipe-dot" style="background:${rec.color}"></span>`;
  document.getElementById('hud').innerHTML =
    `${dot}<b>${rec.name}</b><br>${hudExtra}<br>render: ${lastRenderMs.toFixed(1)}ms`;
}

/* =========================================================================
   UI — built dynamically from RECIPES so a future 5th recipe needs no
   new UI wiring, only a new registry entry.
   ========================================================================= */
const $ = sel => document.querySelector(sel);
const toast = (msg)=>{ const el=$('#toast'); el.textContent=msg; el.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove('show'),1600); };

function buildRecipeGrid(){
  const grid = $('#recipeGrid'); grid.innerHTML='';
  RECIPES.forEach(r=>{
    const card = document.createElement('div');
    card.className = 'recipe-card'+(r.id===state.recipe?' active':'');
    card.style.setProperty('--rc', r.color);
    card.innerHTML = `<b>${r.name}</b>`;
    card.onclick = ()=>{ state.recipe = r.id; buildRecipeGrid(); buildDynamicParams(); render(); };
    grid.appendChild(card);
  });
  const rec = RECIPES.find(r=>r.id===state.recipe);
  $('#recipeBlurb').textContent = rec.blurb;
  const pr = $('#presetRow'); pr.innerHTML='';
  rec.presets.forEach(p=>{
    const chip = document.createElement('div'); chip.className='chip'; chip.textContent=p.name;
    chip.onclick = ()=>{ applyPreset(rec,p); toast('Loaded "'+p.name+'"'); };
    pr.appendChild(chip);
  });
}
function applyPreset(rec, p){
  Object.keys(p).forEach(bank=>{
    if(bank==='name') return;
    Object.assign(state[bank], p[bank]);
  });
  buildDynamicParams(); render();
}

const GROUP_FIELDS = {
  roulette:[
    {key:'family',label:'Shape family',select:ROULETTE_FAMILIES.map(f=>f.name)},
    {key:'h',label:'Hoop depth',min:0.15,max:0.8,step:0.01,curated:[0.2,0.75]},
    {key:'p',label:'Pen reach',min:0.4,max:1,step:0.01,curated:[0.45,0.95]},
    {key:'detail',label:'Detail',min:0.6,max:1.3,step:0.02,curated:[0.7,1.2]}
  ],
  fractal:[
    {key:'mode',label:'Fractal mode',select:['mandelbrot','julia','burningship','tricorn']},
    {key:'zoom',label:'Zoom',min:0.01,max:2,step:0.01},
  ],
  lsys:[
    {key:'preset',label:'Rule set',select:Object.keys(LSYSTEMS)},
    {key:'depth',label:'Depth',min:2,max:12,step:1},
    {key:'angle',label:'Turn angle °',min:5,max:150,step:0.5}
  ],
  vor:[
    {key:'seedSource',label:'Seed source',select:['roulette','fractal','lsystem']},
    {key:'colorBy',label:'Color by',select:['index','escape','angle']},
    {key:'cellStroke',label:'Cell edges',toggle:true}
  ]
};
function buildDynamicParams(){
  const rec = RECIPES.find(r=>r.id===state.recipe);
  const host = $('#dynamicParams'); host.innerHTML='';
  rec.groups.forEach(g=>{
    if(!GROUP_FIELDS[g]){ console.warn('unknown param group', g); return; }
    const fs = document.createElement('fieldset');
    const lg = document.createElement('legend'); lg.textContent = groupLabel(g); fs.appendChild(lg);
    GROUP_FIELDS[g].forEach(f=>fs.appendChild(fieldControl(g,f)));
    host.appendChild(fs);
  });
  const fs2 = document.createElement('fieldset');
  const lg2 = document.createElement('legend'); lg2.textContent='Recipe knobs'; fs2.appendChild(lg2);
  rec.knobs.forEach(k=>fs2.appendChild(fieldControl(k.bank,{key:k.key,label:k.label,min:k.min,max:k.max,step:k.step})));
  host.appendChild(fs2);
}
function groupLabel(g){ return {roulette:'Roulette shape',fractal:'Fractal field',lsys:'L-system',vor:'Voronoi'}[g]||g; }
function fieldControl(bank, f){
  const wrap = document.createElement('label'); wrap.className='ctrl';
  if(f.toggle){
    wrap.innerHTML = `<div class="checkrow"><input type="checkbox" ${state[bank][f.key]?'checked':''}><span>${f.label}</span></div>`;
    wrap.querySelector('input').onchange = e=>{ state[bank][f.key]=e.target.checked; render(); };
    return wrap;
  }
  if(f.select){
    wrap.innerHTML = `<b>${f.label}</b><select></select>`;
    const sel = wrap.querySelector('select');
    f.select.forEach(v=>{ const o=document.createElement('option'); o.value=v; o.textContent=v; if(state[bank][f.key]===v) o.selected=true; sel.appendChild(o); });
    sel.onchange = e=>{ state[bank][f.key]=e.target.value; render(); };
    return wrap;
  }
  const val = state[bank][f.key];
  wrap.innerHTML = `<b>${f.label}</b><span class="val mono">${fmtVal(val)}</span><input type="range" min="${f.min}" max="${f.max}" step="${f.step}" value="${val}">`;
  const input = wrap.querySelector('input');
  input.oninput = e=>{ state[bank][f.key]=parseFloat(e.target.value); wrap.querySelector('.val').textContent=fmtVal(state[bank][f.key]); scheduleRender(); };
  return wrap;
}
function fmtVal(v){ return (Math.round(v*100)/100).toString(); }

/* ---- appearance controls ---- */
$('#paletteSelect').value = state.appearance.palette;
$('#paletteSelect').onchange = e=>{ state.appearance.palette=+e.target.value; $('#solidColorRow').style.display = state.appearance.palette===7?'block':'none'; render(); };
$('#solidColor').oninput = e=>{ state.appearance.solidColor=e.target.value; scheduleRender(); };
$('#lineWidth').oninput = e=>{ state.appearance.lineWidth=+e.target.value; $('#lineWidthVal').textContent=e.target.value; scheduleRender(); };
$('#lineWidthVal').textContent = state.appearance.lineWidth;
$('#glowToggle').checked = state.appearance.glow;
$('#glowToggle').onchange = e=>{ state.appearance.glow=e.target.checked; render(); };
$('#trail').oninput = e=>{ state.appearance.trail=+e.target.value; $('#trailVal').textContent=e.target.value; scheduleRender(); };
$('#trailVal').textContent = state.appearance.trail;

/* ---- panel open/close ---- */
function setBtnOpen(btn, open){ btn.classList.toggle('open', open); btn.setAttribute('aria-expanded', open); }
function openPanel(id, btn){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('open'));
  [gearBtn, mathBtn].forEach(b=>setBtnOpen(b, b===btn));
  $('#'+id).classList.add('open'); $('#overlay').classList.add('show');
}
function closePanels(){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('open'));
  [gearBtn, mathBtn].forEach(b=>setBtnOpen(b, false));
  $('#overlay').classList.remove('show');
}
const gearBtn = $('#gearBtn'), mathBtn = $('#mathBtn');
gearBtn.onclick = ()=>openPanel('settingsPanel', gearBtn);
mathBtn.onclick = ()=>{ renderMath(); openPanel('mathPanel', mathBtn); };
$('#overlay').onclick = closePanels;
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>closePanels());

/* ---- theme ---- */
const themeBtn = document.getElementById('themeBtn');
const iconMoon = themeBtn.querySelector('.icon-moon');
const iconSun = themeBtn.querySelector('.icon-sun');
let currentTheme = 'dark';
function setTheme(theme){
  currentTheme = theme;
  document.documentElement.setAttribute('data-theme', theme);
  iconMoon.style.display = theme === 'dark' ? '' : 'none';
  iconSun.style.display = theme === 'light' ? '' : 'none';
  themeBtn.setAttribute('aria-pressed', theme === 'light');
  const nextLabel = theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode';
  themeBtn.setAttribute('aria-label', nextLabel);
  themeBtn.title = nextLabel;
  render();
}
themeBtn.addEventListener('click', () => setTheme(currentTheme === 'dark' ? 'light' : 'dark'));

/* ---- download ---- */
$('#downloadBtn').onclick = ()=>{
  const a = document.createElement('a');
  a.download = `chameleon-${state.recipe}-${Date.now()}.png`;
  a.href = canvas.toDataURL('image/png');
  a.click();
  toast('PNG saved');
};

/* ---- randomize ---- */
function curatedRandomize(recOnly){
  const rec = RECIPES.find(r=>r.id===state.recipe);
  const target = recOnly ? rec : pick(RECIPES);
  if(!recOnly){ state.recipe = target.id; }
  target.groups.forEach(g=>{
    GROUP_FIELDS[g].forEach(f=>{
      if(f.select){ state[groupBankFor(g)][f.key] = pick(f.select); }
      else if(f.toggle){ /* leave toggles as-is for cleanliness */ }
      else { const [lo,hi] = f.curated || [f.min,f.max]; state[groupBankFor(g)][f.key] = round2(rand(lo, hi)); }
    });
  });
  target.knobs.forEach(k=>{
    const [lo,hi] = k.curated || [k.min,k.max];
    state[k.bank][k.key] = round2(rand(lo,hi));
  });
  if(state.lsys) state.lsys.depth = Math.round(state.lsys.depth);
  if(state.mandala){ state.mandala.rings=Math.round(state.mandala.rings); state.mandala.symmetry=Math.round(state.mandala.symmetry); }
  if(state.vor) state.vor.seedCount = Math.round(state.vor.seedCount);
  buildRecipeGrid(); buildDynamicParams(); render();
}
function groupBankFor(g){ return g; }
function round2(v){ return Math.round(v*100)/100; }
$('#diceBtn').onclick = ()=>curatedRandomize(true);
$('#surpriseBtn').onclick = ()=>{ curatedRandomize(false); toast('Surprised you'); };
$('#resetBtn').onclick = ()=>{ const rec=RECIPES.find(r=>r.id===state.recipe); applyPreset(rec, rec.presets[0]); };

/* =========================================================================
   MATH PANEL — teaching-tool shape: framing, glossary, live equations,
   why + comparison, real-world grounding, tie-back, citation.
   ========================================================================= */
function renderMath(){
  const rec = RECIPES.find(r=>r.id===state.recipe);
  const R = resolveRoulette(state.roulette), F = state.fractal;
  let body = `
  <h3>What problem is Chameleon solving?</h3>
  <p>Four sibling widgets (spirograph-studio, fractal-widget, lsystem-widget, voronoi-widget) each render one generative system well. Chameleon asks a different question: what happens if one system's <em>output</em> is fed into another system's <em>formula</em> as a live parameter, instead of drawing them as separate transparent layers? The four recipes below are four different answers.</p>

  <h3>Glossary</h3>
  <dl>
    <dt>Roulette curve</dt><dd> — a point traced by a "pen" fixed to a wheel that rolls inside a hoop, itself rolling inside a fixed ring (a second-order epicyclic/roulette construction, not a plain hypotrochoid). The outer ring:wheel gear ratio (n0:n1) mostly sets the overall symmetry count; Chameleon exposes that as a curated "Shape family" picker instead of raw tooth-count sliders, since most tooth-count combinations render as an undersampled scribble rather than a clean loop (see the period-closure gotcha in the KB) — the "Detail" slider still scales the inner hoop/pen-wheel gears continuously for real variety.</dd><br>
    <dt>Escape time</dt><dd> — for a point c in the complex plane, how many iterations of z&#8594;z&sup2;+c (or a sign-folded variant) it takes before |z| shoots past a bailout radius; points that never escape are "inside" the set.</dd><br>
    <dt>Production rule</dt><dd> — a find/replace rule (e.g. F&#8594;F+F-F-F+F) applied to a string over several generations; a turtle then walks the resulting string to draw it.</dd><br>
    <dt>Voronoi cell</dt><dd> — the region of the plane closer to one seed point than to any other seed.</dd>
  </dl>

  <h3>This recipe: ${rec.name}</h3>
  <p>${rec.blurb}</p>
  `;

  if(rec.id==='warp'){
    body += `
    <div class="eq">roulette base:  x=(n0-n1)cos(t)+n1&middot;h&middot;cos(a0)+(n2-n3)cos(a0+t2)
pen vector:     penX = n3&middot;p&middot;cos(a1+&phi;),  penY = n3&middot;p&middot;sin(a1+&phi;)
escape field:   z&#8594;z&sup2;+c, smoothN = n+1-log(log|z|/log(B))/ln2, e = smoothN/maxIter
coupling:       scale(t) = 1 + strength&middot;(e(x(t),y(t)) - 0.35)&middot;2
final point:    (x,y) = base + penVector &middot; scale(t)</div>
    <p><b>Why a scale on the pen vector, not the whole curve?</b> Scaling the whole curve just zooms it uniformly — boring. Scaling only the pen vector keeps the underlying gear ratio (and therefore the roulette's symmetry count) intact while letting the escape-time field visibly pinch and bulge the loops, so you can still see "it's a roulette" even as the fractal bends it.</p>
    <p>Current numbers: family="${state.roulette.family}" (n0=${R.n0}, n1=${R.n1}, n2=${R.n2}, n3=${R.n3}), h=${R.h}, p=${R.p}, mode=${F.mode}, strength=${state.warp.strength}.</p>
    <div class="tie">Try it: open Settings &#8594; Fractal field &#8594; switch mode from Mandelbrot to Julia. The loop shapes reorganize immediately, because escape(x,y) is now sampling a completely different iteration (z fixed at the sample point, c fixed at the Julia constant) at the exact same (x,y) locations.</div>`;
  } else if(rec.id==='branch'){
    body += `
    <div class="eq">rewrite:   s(0)=axiom;  s(i+1)=map(s(i), ch => rules[ch] or ch)
turtle:    F draws forward &amp; records (depth=stack.length)
           [ pushes (x,y,heading);  ] pops AND marks a branch tip
rosette gearing at a tip of depth d:
  n0 = 6+2c+d,  n1 = 5+c+d,  n2 = 3+&lceil;c/2&rceil;,  n3 = 2+&lceil;c/3&rceil;   (c = complexity knob)</div>
    <p><b>Why gear the rosette off depth?</b> Depth is exactly the L-system's own recursion counter — reusing it (rather than inventing a separate random size) means the rosettes visibly get denser/tighter toward the branch tips exactly where the skeleton itself is recursing more, so the two systems read as one structure, not a skeleton with ornaments glued on.</p>
    <p>Current rule set "${state.lsys.preset}": axiom=${LSYSTEMS[state.lsys.preset].axiom}, angle=${state.lsys.angle}&deg;, requested depth=${state.lsys.depth}.</p>
    <div class="tie">Try it: raise Depth in the L-system group. On a branching rule set (plant/tree) more generations means more branch tips (check the HUD's "branch tips:" count) with visibly deeper gearing; on a non-branching curve (dragon/arrowhead — no brackets at all, so bracket depth stays 0) rosette variety instead comes from each stamp's position along the path, which is why those two still look lively rather than degenerating to one rosette.</div>`;
  } else if(rec.id==='bloom'){
    body += `
    <div class="eq">seed set:      P = sampled points from source system (curve / fractal orbit / turtle tips)
cell(i):       { p in canvas : dist(p,P_i) &le; dist(p,P_j) &forall; j }   via half-plane clip per neighbor
half-plane:    n&middot;p &le; c,  n=(P_j-P_i),  c=(|P_j|&sup2;-|P_i|&sup2;)/2
fill(cell i):  color = palette( value(P_i) )   where value = curve-fraction, escape-time, or angle</div>
    <p><b>Why seed from another system instead of random points?</b> Random seeds make a generic Voronoi mosaic. Seeding from the roulette curve's own arc-length samples (or the fractal's escape values, or the L-system's branch tips) means the <em>cell layout itself</em> — not just the fill color — is shaped by that system's geometry: dense curve regions get denser cells, sparse regions get bigger ones.</p>
    <p>Current source: ${state.vor.seedSource}, seeds: ${state.vor.seedCount}, colored by: ${state.vor.colorBy}.</p>
    <div class="tie">Try it: switch Seed source from "roulette" to "fractal" — the cell mosaic reorganizes from following a smooth curve's arc length to following escape-time hot/cold regions, using the exact same half-plane-clip cell math either way.</div>`;
  } else if(rec.id==='mandala'){
    body += `
    <div class="eq">ring r &isin; [0,rings), copy k &isin; [0,symmetry):
  angle(r,k) = 2&pi;k/symmetry + r&middot;ringTwist&middot;(&pi;/180)
  ringScale(r) = 0.42&middot;scale&middot;decay^r
  motif point  = origin(r,k) + Rot(angle(r,k)) &middot; roulettePoint &middot; ringScale(r)</div>
    <p><b>Why drive rings off a "depth" idea instead of a fixed loop?</b> Treating ring count as a recursion depth (same conceptual role as an L-system's generation count) is what makes this recipe extensible — a future recipe could literally replace the flat ring loop with a real L-system traversal and reuse this same rotate/scale/stamp step unchanged.</p>
    <p>Current: rings=${state.mandala.rings}, symmetry=${state.mandala.symmetry}, decay=${state.mandala.scaleDecay}, twist=${state.mandala.ringTwist}&deg; &#8594; ${state.mandala.rings*state.mandala.symmetry} total motif stamps.</p>
    <div class="tie">Try it: set Ring twist to 0 vs. ~20&deg; — at 0 every ring's copies line up radially (spokes); a nonzero twist staggers each ring, which is what produces the "kaleidoscope" braided look.</div>`;
  }

  body += `
  <h3>How the four recipes compare</h3>
  <table><tr><th>Recipe</th><th>What couples what</th><th>Shared with siblings</th></tr>
  <tr><td>Fractal-Warped Roulette</td><td>escape-time &#8594; pen-vector scale</td><td>roulette formula, escape formula</td></tr>
  <tr><td>Branching Rosettes</td><td>L-system depth &#8594; roulette gear ratio</td><td>turtle interpreter, roulette formula</td></tr>
  <tr><td>Voronoi Bloom</td><td>curve/orbit/turtle points &#8594; Voronoi seeds</td><td>half-plane clip, all 3 point sources</td></tr>
  <tr><td>Recursive Mandala</td><td>recursion depth &#8594; ring count/rotation</td><td>roulette formula, cosine palette</td></tr>
  </table>

  <h3>Real-world grounding</h3>
  <p>Escape-time fractals underlie real-time GPU shader art and antenna/signal-processing self-similarity studies; roulette/epicyclic curves are literally how spirograph toys and some mechanical gear-cutting machines work; L-systems were invented (Lindenmayer, 1968) to model real plant growth; Voronoi diagrams show up in everything from cell biology to mobile-network coverage planning.</p>

  <p class="cite">Roulette construction: glagolj's "second-order roulette" write-up. Workflow ideas (presets, randomizers): Abel Vincze's HTML Spirograph. Escape-time formula ported from this family's own fractal-widget shader. Half-plane Voronoi clip ported from this family's own voronoi-widget. A possible future 3D sibling of Chameleon is noted but not built yet — see the project README.</p>
  `;
  $('#mathBody').innerHTML = body;
}

/* ---- init ---- */
resize();
buildRecipeGrid();
buildDynamicParams();
render();

})();
</script>
